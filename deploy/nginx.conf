# 全域数字化智能决策支撑系统 — 网关反向代理（docker compose `gateway` 服务）。
# 路由约定（前端 PRD §2 dual-baseURL，真连部署为同源相对路径）：
#   /            → frontend（SPA 静态 + fallback）
#   /a/v1/       → datacore:4001（System A）
#   /b/v1/       → agentcore:4002（System B 原生 + QOS 别名）
#   /api/v1/     → agentcore:4002（QOS 原生前缀）
server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # ---- System A · DataCore --------------------------------------------
    location /a/v1/ {
        proxy_pass http://datacore:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ---- System B · AgentCore（/b/v1 + /api/v1；SSE 长连接不缓冲） -------
    location ~ ^/(b|api)/v1/ {
        proxy_pass http://agentcore:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE：关缓冲、长读超时（QOS-PRD §8.2 事件流 + 心跳）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后端健康探针透出（可选，便于运维）
    location = /healthz/a { proxy_pass http://datacore:4001/healthz; }
    location = /healthz/b { proxy_pass http://agentcore:4002/healthz; }

    # ---- SPA -------------------------------------------------------------
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

