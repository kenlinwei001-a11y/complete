name: gates

# 治理门禁（不靠自觉）：每个 PR / push 必须五包构建+测试全绿，且全部本体/闭包/去电池/PRD 门禁通过。
# 仓主在 Settings → Branches 开启分支保护并勾选本 workflow（gates）为必过项 → 不绿合不进。
#
# WO-INTEGRATION-LOOP 修正两处**真实假绿风险**：
#  ① 原先跑 `pnpm -r build && pnpm -r test` 而**不跑 `scripts/gate.sh`**——后者才是本仓防假绿的单一入口：
#     它显式捕获退出码（绝不在管道后取 `$?`，本仓曾据此把 agentcore 编译失败判为 BUILD 通过并并入正线），
#     且 TEST 段**逐包点名 + 断言包数=5**（防「某包 test 脚本被删/改名 → 静默跳过仍 RC=0」）。
#  ② 原先 `pnpm -r test` 未串行化，datacore 并发多 vitest 违反 CLAUDE.md 的 LOOP 纪律（互相抢资源致假红/超时）。
#     gate.sh 内部用 `--workspace-concurrency=1`。
# 新增 ③ handoff 并线台账门：治「并线状态只存在于审核方脑子里」——需要全量分支历史，故 fetch-depth: 0。

on:
  pull_request:
  push:
    # ⚠ 不要写成 branches: ["**"] —— 那会让每次向 PR 分支推送同时触发 push 与 pull_request 两条
    #   workflow，各跑一遍约 28 分钟的五包全量：CI 成本翻倍，且同一个 sha 产出两条一模一样的
    #   失败通知，复审时极易把孪生运行误当成两个独立问题去分别排查（本轮真实发生过）。
    #   handoff 分支的验证由其 PR 承担（本仓 LOOP 纪律要求每张 WO 一条分支一个 PR），
    #   push 触发因此只保留给没有 PR 的长期分支：canonical 与 main。
    branches: [main, "claude/inspiring-gates-aqczjg"]

# 同一分支的新推送取消尚未跑完的旧运行：陈旧运行既浪费 runner，其失败通知也会把已修好的问题
# 反复推回复审视野（本轮多次收到早已被后续提交取代的 sha 的红色告警）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 并线台账门要比对所有 claude/handoff-* 分支与 canonical，浅克隆取不到 → 必须全量。
          fetch-depth: 0
      # ⛔ 不要在此写 `version:` —— package.json 已有 `packageManager: pnpm@10.33.0`，
      #    两处同时指定会让 pnpm/action-setup@v4 直接报 "Multiple versions of pnpm specified" 并退出。
      #    **这正是本仓 CI 长期红而无人察觉的真因**：workflow 钉 pnpm 9、package.json 写 10.33.0，
      #    每次 run 都在 setup 阶段 8 秒内失败 —— 五包测试与 `pnpm gates` 在 CI 里一次都没真正执行过，
      #    `gates` workflow 自建立起就是装饰品。版本单一来源 = package.json 的 packageManager。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # 五包 build + 静态门 + 五包串行 test，全部经 gate.sh 显式捕获退出码（防假绿单一入口）
      - name: Gate (build + 静态门 + 五包串行 test)
        run: bash scripts/gate.sh

      - name: Governance gates
        # ontology / chain / debattery / prd / meta-sync / resource-descriptor / slice / loop-control
        # / arg-drop-seam / scenario-slot-keys / schema-readability
        run: pnpm gates

      - name: 本体回写完整性（每个并入 gates 的门都须在本体 §7 登记）
        run: node scripts/check-ontology-writeback.mjs

  # 运行时便携性门：沙箱依赖 Node 权限模型，而该开关名随版本变过（Node 20 = --experimental-permission，
  # 较新的 22.x/23+ = --permission）。此前 sandbox.ts 写死 --permission，于是在 CLAUDE.md 声明支持的
  # **最低版本 Node 20** 上沙箱启动即失败，生成式求解器整条路径连同 DF.8/DF.11 接地链全死；
  # 而开发机跑 Node 22 本地全绿、CI 又从未真正执行过测试，缺陷因此长期无人发现。
  #
  # 主 gate 跑在 Node 20（声明的最低支持版本，也正是它抓出这个缺陷）。此 job 额外在 Node 22 上
  # 复跑沙箱与接地这两组**直接依赖运行时能力**的测试——只跑这几个文件，成本低，但让"在 A 版本绿
  # 在 B 版本红"这类便携性漂移不可能再静默发生。
  runtime-portability:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # `datacore...` = datacore **及其全部工作区依赖**（contracts + llm-adapters）。
      # 不要手写依赖清单 —— 初版只建了 contracts，漏掉 llm-adapters，两个 Node 版本双双红在
      # `TS2307: Cannot find module '@platform/llm-adapters'`，看着像便携性缺陷、实为门自己写错。
      # 让 pnpm 解依赖图，新增包时此处无需跟着改。
      - name: Build (datacore + 其工作区依赖)
        run: pnpm --filter "datacore..." build
      - name: 沙箱 + 接地链在本 Node 版本上必须真跑通
        run: |
          out="$(pnpm --filter datacore exec vitest run \
            test/a18-sandbox.test.ts \
            test/grounding-hook.test.ts \
            test/grounding-vocab-grow.test.ts 2>&1)"
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ]; then
            echo "::error::沙箱/接地在 Node ${{ matrix.node }} 上失败 —— 运行时便携性回归"
            exit 1
          fi

  # 并线台账：独立 job，只在 canonical / main 上强制——handoff 分支自己不该为「别人没并线」而红。
  integration-ledger:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/inspiring-gates-aqczjg' || github.base_ref == 'claude/inspiring-gates-aqczjg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: handoff 并线台账门（无静默积压 + 无测试并线缺口）
        run: node scripts/check-handoff-integration.mjs --days 21
