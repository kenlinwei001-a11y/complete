name: gates

# 治理门禁（不靠自觉）：每个 PR / push 必须四包构建+测试全绿，且全部本体/闭包/去电池/PRD 门禁通过。
# 仓主在 Settings → Branches 开启分支保护并勾选本 workflow（gates）为必过项 → 不绿合不进。

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ⛔ 不要在此写 `version:` —— package.json 已有 `packageManager: pnpm@10.33.0`，
      #    两处同时指定会让 pnpm/action-setup@v4 报 "Multiple versions of pnpm specified" 直接退出，
      #    每次 run 在 setup 阶段 8 秒内失败。版本单一来源 = package.json 的 packageManager。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (4 packages)
        run: pnpm -r build
      - name: Test (datacore / agentcore / frontend / contracts)
        run: pnpm -r test
      - name: Governance gates
        # = ontology:check + chain:check + debattery:check + prd:check + prd-coverage + meta-sync
        run: pnpm gates
