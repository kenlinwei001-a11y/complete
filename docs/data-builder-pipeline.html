<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>数据构建管线 · 节点图（DataCore Data Builder Pipeline）</title>
<style>
  :root{--bg:#0f172a;--panel:#1e293b;--ink:#e2e8f0;--muted:#94a3b8;--line:#475569;--hot:#f59e0b;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:18px;color:#fff}
  header p{margin:4px 0 0;color:var(--muted);font-size:12px}
  .wrap{display:flex;gap:0;height:calc(100vh - 60px)}
  .stage{flex:1;overflow:auto;position:relative}
  .canvas{position:relative}
  svg.edges{position:absolute;inset:0;z-index:0;pointer-events:none}
  .node{position:absolute;z-index:1;width:172px;height:52px;border-radius:8px;padding:6px 8px;cursor:pointer;
        border:1px solid var(--line);background:var(--panel);transition:.12s;overflow:hidden}
  .node:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .node .t{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .e{font-size:10px;color:var(--muted);font-family:ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node.store{border-radius:14px}
  .node.sel{outline:3px solid var(--hot);border-color:var(--hot)}
  .node.dim{opacity:.25}
  .lane{position:absolute;top:0;bottom:0;border-right:1px dashed #33415555;z-index:0}
  .lane span{position:absolute;top:6px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px}
  .side{width:340px;min-width:340px;border-left:1px solid var(--line);padding:16px;overflow:auto;background:#0b1220}
  .side h2{font-size:14px;margin:0 0 4px;color:#fff}
  .side .ep{font-family:ui-monospace,monospace;font-size:11px;color:var(--hot);word-break:break-all;margin-bottom:8px}
  .side .det{font-size:13px;color:var(--ink)}
  .side .rel{margin-top:12px;font-size:12px}
  .side .rel b{color:var(--muted);font-weight:700}
  .side .chip{display:inline-block;background:#1e293b;border:1px solid var(--line);border-radius:10px;padding:1px 7px;margin:2px 3px 0 0;font-size:11px;cursor:pointer}
  .side .chip:hover{border-color:var(--hot)}
  .hint{color:var(--muted);font-size:12px}
  .legend{position:fixed;right:356px;bottom:14px;background:#0b1220cc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;z-index:5}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
</style>
</head>
<body>
<header>
  <h1>数据构建管线 · 节点图</h1>
  <p>全域数字化智能决策支撑系统 · DataCore Data Builder Pipeline ——
     点击任意节点查看说明与上下游。① 入口 → ② 接入校验 → ③ 建模 → ④ 落库 → ⑤ 加工/权限 → ⑥ 消费。虚线=条件/事件流。</p>
</header>
<div class="wrap">
  <div class="stage"><div class="canvas" id="canvas"><svg class="edges" id="edges"></svg></div></div>
  <div class="side" id="side">
    <h2>说明</h2>
    <div class="hint">点击左侧任意节点查看：所属环节、真实端点/服务、职责、上游来源与下游去向。再次点击空白处复位。</div>
  </div>
</div>
<div class="legend">
  <div><i style="background:#2563eb"></i>① 入口 &nbsp; <i style="background:#0891b2"></i>② 接入 &nbsp; <i style="background:#9333ea"></i>③ 建模</div>
  <div><i style="background:#16a34a"></i>④ 落库 &nbsp; <i style="background:#ca8a04"></i>⑤ 加工 &nbsp; <i style="background:#db2777"></i>⑥ 消费</div>
</div>
<script>
const LAYERS=["① 数据导入入口","② 接入·解析·校验","③ A3 半自动建模","④ 落库(单一事实源)","⑤ 加工·派生·权限","⑥ 消费模块"];
const COLOR=["#2563eb","#0891b2","#9333ea","#16a34a","#ca8a04","#db2777"];
// id, layer, 标题, 端点/服务, 说明, store?
const N=[
 ["a7",0,"A7 一键合成","POST /a/v1/synthetic/jobs","行业模板+seed/scale 确定性生成全套数据；livedIn 时再回放一年。"],
 ["a1",0,"A1 连接器同步","POST /a/v1/connections/:id/sync","外部数据源拉取行数据，落 RawDataset；TIMESERIES 类直走时序写入。"],
 ["a2",0,"A2 规则文档","POST /a/v1/rule-docs","上传规则文档→分段→LLM 抽取规则候选(带原文引用)。"],
 ["s4",0,"S4 知识库","POST /a/v1/kb/:conn/docs|sync","文档上传→切块→embedding→向量库。"],
 ["lv",0,"运营态 live-ingest","POST /a/v1/history/live-ingest","真实数据按月回填，覆盖合成水印。"],
 ["ck",0,"A8 模拟时钟","POST /a/v1/synthetic/clock/tick","推进仿真时钟，注入时序事件(到货/检修/良率)。"],

 ["parse",1,"解析 parsers","connectors/parsers.ts","csv/json/jsonl 解析为行。"],
 ["prof",1,"剖析 profiler","connectors/profiler.ts","推断字段类型 + 数据集类别(主数据/事务/时序)。"],
 ["raw",1,"RawDataset","repos.rawDatasets","原始数据集(幂等：同 conn+dataset 覆盖)。",1],
 ["val",1,"物化校验","modeling.materialize","主键/外键/类型校验，决定入对象还是隔离区。"],
 ["quar",1,"隔离区 Quarantine","/a/v1/quarantine/:id/reprocess","异常行隔离，可编辑后 reprocess 重入管线，或 discard。",1],
 ["extract",1,"LLM 抽取","ruledocs.ts","规则文档→候选规则(sourceQuote 原文回链)。"],
 ["chunk",1,"切块+embedding","embeddings.ts","文档分块并向量化。"],

 ["sug",2,"suggest 建议","/a/v1/modeling/suggest","LLM 据 RawDataset 建议对象类型/属性/FK。"],
 ["draft",2,"OntologyDraft","modeling drafts","建模草稿，人工 PATCH 改名/加属性/映射。"],
 ["pub",2,"publish 发布","/drafts/:id/publish","校验通过→本体版本 +1，写 sourceBindings。"],
 ["mat",2,"materialize 物化","/drafts/:id/materialize","按映射把 RawDataset 行物化为对象。"],

 ["ont",3,"本体 types/links/slices","ontology_types/links/slice_specs","对象类型/链路类型/切片规格(schema 层)。",1],
 ["obj",3,"对象 objects","repos.objects(origin)","业务对象事实源，每条带 origin/snapshot。",1],
 ["lnk",3,"链路 links","repos.links","对象间关系边(跨域切片可遍历)。",1],
 ["ts",3,"时序 ts_series/points","repos.tsSeries/tsPoints","时间序列原始点(OEE/良率/产出…)。",1],
 ["rule",3,"规则 rules","repos.rules","约束/规则 DSL(C01–C33…)。",1],
 ["kbc",3,"KB 向量 kb_chunks","repos.kbChunks","知识库向量块。",1],

 ["deriv",4,"A4 派生 DSL","ontology.runDerivations","对象/链路→派生属性，留痕 value_runs(输入→值)。"],
 ["agg",4,"A8 TS_AGGREGATE","timeseries.runAggregation","时序聚合→快照属性(Equipment.oee_current…)→再喂派生。"],
 ["scan",4,"RULE_SCAN","rules scan","对象/时序按规则扫描→违规与情景触发。"],
 ["a6",4,"A6 行级权限","authz rowFilter","所有读按角色行级过滤(切片/求解器/治理同源)。"],

 ["slice",5,"切片引擎","/ontology/slices/:key/resolve","声明式跨域切片检索(order_to_cash_720 等)。"],
 ["solve",5,"求解器 ×22","/a/v1/solvers/:key/invoke","确定性求解器(含 countermeasure_combo 编排器)。"],
 ["gov",5,"治理","搜索/聚合/图谱/引用反查","对象搜索、聚合、本体图谱、引用反查。"],
 ["view",5,"视图/驾驶舱","view_configs","经营驾驶舱/台账/看板(按角色)。"],
 ["hist",5,"运营回顾","/a/v1/history/bundle","12 月叙事/已交付/风险案例/Action 审计/MAPE。"],
 ["cal",5,"校准 calibration","calibration","预测 vs 实测，MAPE 收敛 + 参数提案。"],
 ["exp",5,"经验库 experience","search_experience","已执行 agent 推演蒸馏沉淀，可检索。",1],
 ["qos",5,"AgentCore QOS","OBO REST 跨系统","System B 经公开 REST(透传用户 JWT)消费 A 的数据。"],
];
const E=[
 ["a1","parse"],["parse","prof"],["prof","raw"],["a1","ts",1],
 ["a2","extract"],["extract","rule"],["s4","chunk"],["chunk","kbc"],["ck","ts"],["lv","ts"],["lv","obj"],["lv","hist",1],
 ["a7","ont"],["a7","obj"],["a7","lnk"],["a7","ts"],["a7","rule"],
 ["raw","sug"],["sug","draft"],["draft","pub"],["pub","ont"],["pub","mat"],["mat","val"],["val","obj"],["val","quar",1],["quar","val",1],
 ["obj","deriv"],["deriv","obj"],["lnk","deriv"],["ts","agg"],["agg","obj"],["obj","scan"],["ts","scan"],["rule","scan"],["obj","a6"],["lnk","a6"],
 ["a6","slice"],["a6","solve"],["a6","gov"],["ont","slice"],["obj","slice"],["lnk","slice"],["obj","solve"],["ts","solve"],["rule","solve"],["kbc","gov"],["obj","view"],["agg","cal"],
 ["slice","qos"],["solve","qos"],["gov","qos"],["qos","exp"],
];
const NW=172,NH=52,GAPX=240,PITCH=74,PADT=34;
const counts=[0,0,0,0,0,0]; const idx={};
N.forEach(n=>{idx[n[0]]=counts[n[1]]++;});
const maxC=Math.max(...counts);
const H=maxC*PITCH+PADT+20, W=20+5*GAPX+NW+40;
const pos={};
N.forEach(n=>{const L=n[1];const startY=PADT+(maxC-counts[L])*PITCH/2;const x=20+L*GAPX;const y=startY+idx[n[0]]*PITCH;pos[n[0]]={x,y};});
const canvas=document.getElementById("canvas"); canvas.style.width=W+"px"; canvas.style.height=H+"px";
const svg=document.getElementById("edges"); svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.style.width=W+"px"; svg.style.height=H+"px";
// 泳道标签
LAYERS.forEach((t,i)=>{const d=document.createElement("div");d.className="lane";d.style.left=(20+i*GAPX-12)+"px";d.style.width=GAPX+"px";d.innerHTML=`<span>${t}</span>`;canvas.appendChild(d);});
// 边
const epaths={};
E.forEach((e,i)=>{const a=pos[e[0]],b=pos[e[1]];if(!a||!b)return;
 const x1=a.x+NW,y1=a.y+NH/2,x2=b.x,y2=b.y+NH/2;const dx=Math.max(40,(x2-x1)/2);
 const p=document.createElementNS("http://www.w3.org/2000/svg","path");
 p.setAttribute("d",`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`);
 p.setAttribute("fill","none");p.setAttribute("stroke","#475569");p.setAttribute("stroke-width","1.4");
 if(e[2])p.setAttribute("stroke-dasharray","4 4");p.dataset.f=e[0];p.dataset.t=e[1];
 svg.appendChild(p);(epaths[e[0]]=epaths[e[0]]||[]).push(p);(epaths[e[1]]=epaths[e[1]]||[]).push(p);});
// 节点
const els={};
N.forEach(n=>{const d=document.createElement("div");d.className="node"+(n[5]?" store":"");
 d.style.left=pos[n[0]].x+"px";d.style.top=pos[n[0]].y+"px";
 d.style.borderTop="3px solid "+COLOR[n[1]];
 d.innerHTML=`<div class="t">${n[2]}</div><div class="e">${n[3]}</div>`;
 d.onclick=ev=>{ev.stopPropagation();select(n[0]);};canvas.appendChild(d);els[n[0]]=d;});
const byId=Object.fromEntries(N.map(n=>[n[0],n]));
function select(id){
 Object.values(els).forEach(e=>{e.classList.remove("sel","dim");});
 svg.querySelectorAll("path").forEach(p=>{p.setAttribute("stroke","#475569");p.setAttribute("stroke-width","1.4");});
 const rel=new Set([id]);
 E.forEach(e=>{if(e[0]===id)rel.add(e[1]);if(e[1]===id)rel.add(e[0]);});
 Object.keys(els).forEach(k=>{if(!rel.has(k))els[k].classList.add("dim");});
 els[id].classList.add("sel");
 (epaths[id]||[]).forEach(p=>{p.setAttribute("stroke","#f59e0b");p.setAttribute("stroke-width","2.4");});
 const up=E.filter(e=>e[1]===id).map(e=>e[0]), dn=E.filter(e=>e[0]===id).map(e=>e[1]);
 const chip=ids=>ids.length?ids.map(x=>`<span class="chip" data-id="${x}">${byId[x][2]}</span>`).join(""):"<span class=hint>—</span>";
 const n=byId[id];
 document.getElementById("side").innerHTML=
  `<h2>${n[2]} <span class=hint>· ${LAYERS[n[1]]}</span></h2>
   <div class="ep">${n[3]}</div>
   <div class="det">${n[4]}</div>
   <div class="rel"><b>上游来源 →</b><br>${chip(up)}</div>
   <div class="rel"><b>下游去向 →</b><br>${chip(dn)}</div>`;
 document.querySelectorAll("#side .chip").forEach(c=>c.onclick=()=>select(c.dataset.id));
}
document.getElementById("stage")?.addEventListener?.("click",()=>{});
document.querySelector(".stage").addEventListener("click",()=>{
 Object.values(els).forEach(e=>e.classList.remove("sel","dim"));
 svg.querySelectorAll("path").forEach(p=>{p.setAttribute("stroke","#475569");p.setAttribute("stroke-width","1.4");});
 document.getElementById("side").innerHTML='<h2>说明</h2><div class="hint">点击任意节点查看：所属环节、真实端点/服务、职责、上下游。点击空白处复位。</div>';
});
</script>
</body>
</html>
