<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>全域智能决策平台 · 骨架版</title>
<style>
:root{--bg:#0D1117;--bg2:#11161D;--panel:#161C24;--panel2:#10151C;--line:rgba(226,235,245,.07);--line2:rgba(226,235,245,.13);
--txt:#E9EEF5;--muted:#9AA8B6;--muted2:#67737F;--accent:#4C90F0;--green:#62BE77;--amber:#E8B54A;--red:#DD7E9E;--purple:#C470B8;
--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--sans:"Inter","Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);height:100vh;overflow:hidden}
.mono{font-family:var(--mono)}
#login{display:flex;height:100vh;align-items:center;justify-content:center}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:28px 32px;width:360px}
.card h1{font-size:18px;margin-bottom:4px}.card p{font-size:12px;color:var(--muted);margin-bottom:18px}
input,select{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;color:var(--txt);padding:9px 12px;font-size:13px;margin-bottom:10px;font-family:var(--sans)}
input:focus{outline:none;border-color:var(--accent)}
button{background:rgba(76,144,240,.16);border:1px solid rgba(76,144,240,.4);color:var(--accent);border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:var(--sans)}
button:hover{background:rgba(76,144,240,.26)}
.hint{font-size:11px;color:var(--muted2);margin-top:10px;line-height:1.6}
#app{display:none;grid-template-columns:220px 1fr;grid-template-rows:54px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line2);background:var(--bg2)}
header h1{font-size:14px}header .sub{font-size:10px;color:var(--muted);font-family:var(--mono)}
header .grow{flex:1}header .user{font-size:12px;color:var(--muted)}
nav{border-right:1px solid var(--line);background:var(--panel2);padding:14px 10px;overflow-y:auto}
.navh{font-size:10px;letter-spacing:1.2px;color:var(--muted2);text-transform:uppercase;font-family:var(--mono);margin:8px 6px}
.tab{display:block;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:13px;border:1px solid transparent;margin-bottom:4px}
.tab:hover{color:var(--txt);background:rgba(226,235,245,.04)}
.tab.on{background:rgba(76,144,240,.14);border-color:rgba(76,144,240,.3);color:#fff}
main{position:relative;overflow-y:auto;padding:20px 24px 220px}
h2{font-size:17px;margin-bottom:4px}.sub2{font-size:12px;color:var(--muted);margin-bottom:16px}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 16px;min-width:130px}
.kpi b{display:block;font-size:20px;font-family:var(--mono)}.kpi span{font-size:10px;color:var(--muted2)}
table{width:100%;border-collapse:collapse;font-size:12px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:10px;color:var(--muted);font-family:var(--mono)}
tr.sel{outline:1.5px solid var(--accent);outline-offset:-1.5px}
tr:hover td{background:rgba(226,235,245,.03);cursor:pointer}
.formrow{display:flex;gap:10px;align-items:center;margin-bottom:8px;font-size:12px}
.formrow label{width:130px;color:var(--muted)}.formrow input,.formrow select{width:160px;margin:0}
.box{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;margin-bottom:14px}
/* 查询 Dock */
#dock{position:fixed;right:0;top:54px;bottom:0;width:460px;background:var(--bg2);border-left:1px solid var(--line2);display:flex;flex-direction:column;transition:transform .2s}
#dock.hide{transform:translateX(440px)}
#dockToggle{position:absolute;left:-26px;top:14px;width:26px;height:60px;background:var(--panel);border:1px solid var(--line2);border-right:none;border-radius:8px 0 0 8px;color:var(--accent);cursor:pointer;font-size:12px;writing-mode:vertical-lr;display:flex;align-items:center;justify-content:center}
#chat{flex:1;overflow-y:auto;padding:14px}
.msg{margin-bottom:12px;font-size:12.5px;line-height:1.65}
.msg.q{color:var(--txt)}.msg.q::before{content:"你 › ";color:var(--accent);font-weight:700}
.ans{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.ans.agent{border-style:dashed;border-color:rgba(232,181,74,.5)}
.badge{display:inline-block;font-size:9px;padding:2px 8px;border-radius:10px;margin-bottom:6px;font-family:var(--mono)}
.badge.wf{color:var(--green);border:1px solid rgba(98,190,119,.4)}
.badge.ag{color:var(--amber);border:1px solid rgba(232,181,74,.5)}
.warnbar{font-size:10px;color:var(--amber);border:1px solid rgba(232,181,74,.4);border-radius:6px;padding:4px 8px;margin-bottom:6px;background:rgba(232,181,74,.07)}
.steps{font-size:10px;color:var(--muted2);font-family:var(--mono);margin:4px 0}
.ref{color:var(--accent);cursor:pointer;font-size:10px;vertical-align:super}
.ablock-kpi{display:inline-block;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;margin:4px 6px 4px 0}
.ablock-kpi b{font-family:var(--mono);font-size:15px;display:block}.ablock-kpi span{font-size:9px;color:var(--muted2)}
.viol{border-left:3px solid var(--red);background:rgba(221,126,158,.07);padding:6px 10px;border-radius:6px;margin:4px 0;font-size:11.5px}
.viol.warn{border-color:var(--amber);background:rgba(232,181,74,.06)}
.draft{border-left:3px solid var(--purple);background:rgba(196,112,184,.08);padding:6px 10px;border-radius:6px;margin:4px 0;font-size:11.5px}
.ans table{font-size:10.5px;margin:6px 0}
#inputBar{padding:10px;border-top:1px solid var(--line2);display:flex;gap:8px}
#inputBar input{flex:1;margin:0}
.chips{padding:0 10px 8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:10.5px;padding:4px 10px;border-radius:12px;border:1px solid rgba(95,194,174,.35);color:#5FC2AE;cursor:pointer;background:rgba(95,194,174,.07)}
.modebadge{font-size:9px;font-family:var(--mono);color:var(--muted2);padding:0 10px 6px}
.prov{position:fixed;z-index:99;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:11px;max-width:320px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="login"><div class="card">
  <h1>全域智能决策平台</h1><p>本体 + AI 推演 · 骨架版（拎包入住）</p>
  <input id="u" placeholder="用户名" value="planner"><input id="p" type="password" placeholder="密码" value="planner123">
  <button onclick="login()" style="width:100%">登录</button>
  <div class="hint">演示账号：planner/planner123（全局计划员）· czmgr/cz123（常州基地负责人，演示行级权限）· admin/admin123（含审批）</div>
  <div class="hint" id="loginErr" style="color:var(--red)"></div>
</div></div>

<div id="app">
  <header><h1>全域智能决策平台</h1><span class="sub" id="llmInfo"></span><div class="grow"></div><span class="user" id="userInfo"></span><button onclick="logout()" style="padding:4px 12px;font-size:11px">退出</button></header>
  <nav><div class="navh">业务视图</div><div id="navTabs"></div></nav>
  <main id="main"></main>
  <div id="dock">
    <div id="dockToggle" onclick="document.getElementById('dock').classList.toggle('hide')">对话</div>
    <div id="chat"></div>
    <div class="modebadge" id="modeBadge"></div>
    <div class="chips" id="chips"></div>
    <div id="inputBar"><input id="q" placeholder="" onkeydown="if(event.key==='Enter')ask()"><button onclick="ask()">问</button></div>
  </div>
</div>
<div class="prov" id="prov"></div>

<script>
const A = location.protocol+"//"+location.hostname+":8081", B = "";
let token="", ws=null, view="dash", selected=[], conv=null, provMap={}, hist=null;
function lineSVG(pts,w,h,color,fmt){const max=Math.max(...pts.map(p=>p.v))*1.08,min=Math.min(...pts.map(p=>p.v))*0.92;
  const xy=pts.map((p,i)=>`${(i/(pts.length-1)*w).toFixed(1)},${(h-(p.v-min)/(max-min)*h).toFixed(1)}`).join(" ");
  return `<svg width="100%" viewBox="0 0 ${w} ${h+16}" style="overflow:visible"><polyline points="${xy}" fill="none" stroke="${color}" stroke-width="2"/>${pts.map((p,i)=>i%Math.ceil(pts.length/8)===0?`<text x="${(i/(pts.length-1)*w).toFixed(0)}" y="${h+12}" font-size="8" fill="var(--muted2)">${p.l}</text>`:"").join("")}</svg>`}

async function api(base, path, opts={}){
  const r = await fetch(base+path,{...opts,headers:{"content-type":"application/json",authorization:"Bearer "+token,...(opts.headers||{})}});
  if(!r.ok){const e=await r.json().catch(()=>({error:{message:r.status}}));throw new Error(e.error?.message||r.status);}
  return r.json();
}
async function login(){
  try{
    const r=await api(A,"/a/v1/auth/login",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});
    token=r.token;
    ws=await api(A,"/a/v1/me/workspace");
    const h=await fetch(B+"/healthz").then(r=>r.json());
    document.getElementById("llmInfo").textContent=`LLM: ${h.llm==="anthropic"?"Anthropic("+h.models.agent+")":"Mock 演示模式（设 ANTHROPIC_API_KEY 启用真实 Agent）"}`;
    document.getElementById("userInfo").textContent=`${r.user.username} · ${r.user.roles.join("/")}`;
    hist=await api(A,"/a/v1/history/bundle");
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="grid";
    renderNav(); go(ws.navigation[0].viewKey);
  }catch(e){document.getElementById("loginErr").textContent=e.message}
}
function logout(){location.reload()}
function renderNav(){
  document.getElementById("navTabs").innerHTML=ws.navigation.map(n=>`<span class="tab ${n.viewKey===view?'on':''}" onclick="go('${n.viewKey}')">${n.name}</span>`).join("");
}
function scene(){return ws.scenes.find(s=>s.viewKey===view)}
function go(v){view=v;selected=[];renderNav();renderView();renderDockHints();preloadChatHistory();}
function preloadChatHistory(){
  const c=document.getElementById("chat");c.innerHTML="";
  (hist?.taskHistory||[]).filter(t=>t.view===view).forEach(t=>{
    c.insertAdjacentHTML("beforeend",`<div class="msg q" style="opacity:.55">${esc(t.q)} <span style="font-size:9px;color:var(--muted2)">${t.at}</span></div>
    <div class="msg" style="opacity:.55"><div class="ans"><span class="badge ${t.path==="AGENT"?"ag":"wf"}">${t.path==="AGENT"?"探索 · AI":"已验证 · 工作流"}</span><div>${esc(t.a)}</div></div></div>`);
  });
  if(c.innerHTML)c.insertAdjacentHTML("beforeend",`<div style="text-align:center;font-size:9px;color:var(--muted2);margin:8px 0">— 以上为历史问答 —</div>`);
}
function renderDockHints(){
  const s=scene();
  document.getElementById("q").placeholder=s.uiHints.placeholder;
  document.getElementById("chips").innerHTML=s.uiHints.suggestedQuestions.map(q=>`<span class="chip" onclick="q2('${q.replace(/'/g,"\\'")}')">${q}</span>`).join("");
  document.getElementById("modeBadge").textContent=`场景入口模式：${s.mode}${s.defaultAgentKey?" · agent="+s.defaultAgentKey:""}`;
}
function q2(t){document.getElementById("q").value=t;ask();}

/* ---------- 视图 ---------- */
async function renderView(){
  const m=document.getElementById("main");
  if(view==="dash") return renderDash(m);
  if(view==="risk") return renderRisk(m);
  if(view==="project") return renderProject(m);
  if(view==="audit") return renderAudit(m);
  if(view==="generate") return renderGenerate(m);
  if(view==="explore") return m.innerHTML=`<h2>自由探索 · AI</h2><div class="sub2">本入口为 AGENT_FIRST 模式：问题直接交给 Agent 自由编排工具回答（不走意图目录）。右侧对话框提问 →</div>`;
  if(view==="review") return renderReview(m);
  m.innerHTML="<h2>"+view+"</h2>";
}
async function renderDash(m){
  const bases=(await api(A,"/a/v1/objects/query",{method:"POST",body:JSON.stringify({objectType:"Base"})})).data;
  const orders=(await api(A,"/a/v1/objects/query",{method:"POST",body:JSON.stringify({objectType:"Order"})})).data;
  const gwh=bases.reduce((s,b)=>s+b.gwh,0), util=(bases.reduce((s,b)=>s+b.util,0)/bases.length).toFixed(1);
  const qty=orders.reduce((s,o)=>s+o.qty,0).toFixed(1);
  m.innerHTML=`<h2>经营驾驶舱</h2><div class="sub2">数据按你的权限过滤（行级）——可见 ${bases.length} 个基地 · 在手 ${orders.length} 单 · 近 12 个月已交付 ${hist.deliveredCount} 单（准交率 ${hist.onTimeRate}%）</div>
  <div class="kpis"><div class="kpi"><b>${gwh}</b><span>设计产能 GWh</span></div><div class="kpi"><b>${util}%</b><span>平均利用率</span></div><div class="kpi"><b>${qty}</b><span>在手订单 万套</span></div><div class="kpi"><b>${hist.onTimeRate}%</b><span>12个月准交率</span></div><div class="kpi"><b>${hist.actionHistory.filter(a=>a.status==="EXECUTED").length}</b><span>已执行工单(年)</span></div></div>
  <div class="box"><b style="font-size:13px">月度产出趋势（近 12 个月，万套）</b>${lineSVG(hist.trend.map(t=>({v:t.output,l:t.month.slice(2)})),560,90,"#4C90F0")}<div style="font-size:10px;color:var(--muted2)">检修月下凹可见 · 全年爬坡 · 数字与基地月度明细同源</div></div>
  <div class="box"><b style="font-size:13px">基地</b>${tbl(bases,["name","pos","lines","gwh","util","bn"],["基地","定位","产线","GWh","利用率","瓶颈"],r=>pick("Base",r.id,r.name))}</div>
  <div class="box"><b style="font-size:13px">在手订单台账</b>${tbl(orders,["so","cust","model","qty","due","seg"],["订单","客户","型号","万套","交期","细分"],r=>pick("Order",r.id,r.so))}</div>
  <div class="box"><b style="font-size:13px">近期已交付（共 ${hist.deliveredCount} 单 · 展示 8）</b>${tbl(hist.delivered.slice(0,8),["so","cust","model","qty","delivered","note"],["订单","客户","型号","万套","交付日","备注"])}</div>`;
}
async function renderRisk(m){
  const bases=(await api(A,"/a/v1/objects/query",{method:"POST",body:JSON.stringify({objectType:"Base"})})).data;
  m.innerHTML=`<h2>产能推演 · 风险时序</h2><div class="sub2">选基地与因素 → 实时重算（真实算法：基线爬升 + 事件脉冲，阈值 85 越线）</div>
  <div class="formrow"><label>基地</label><select id="rb">${bases.map(b=>`<option>${b.name}</option>`)}</select>
  <label>因素</label><select id="rf"><option>物料齐套</option><option>设备OEE</option><option>瓶颈工序</option><option>物流时长</option></select>
  <button onclick="runRisk()">推演</button></div><div id="riskOut"></div>`;
  runRisk();
}
async function runRisk(){
  const r=await api(B,"/b/v1/solvers/risk_timeline/run",{method:"POST",body:JSON.stringify({args:{baseName:rb.value,factor:rf.value,horizon:30}})});
  const d=r.data; selected=[{objectType:"Base",objectId:d.baseName,label:d.baseName}];
  const w=560,h=120,max=100;
  const pts=d.series.map(s=>`${(s.d/30*w).toFixed(0)},${(h-s.v/max*h).toFixed(0)}`).join(" ");
  document.getElementById("riskOut").innerHTML=`<div class="box">
  <div class="kpis"><div class="kpi"><b>${d.current}</b><span>当前紧张度</span></div><div class="kpi"><b style="color:${d.peak>=85?'var(--red)':'var(--amber)'}">${d.peak}</b><span>窗口峰值</span></div><div class="kpi"><b>${d.crossDay?'T+'+d.crossDay:'—'}</b><span>越线日(≥85)</span></div></div>
  <svg width="100%" viewBox="0 0 ${w} ${h+20}"><line x1="0" x2="${w}" y1="${h-85/max*h}" y2="${h-85/max*h}" stroke="var(--red)" stroke-dasharray="4 4" opacity=".5"/><polyline points="${pts}" fill="none" stroke="#DD7E9E" stroke-width="2"/>${d.events.map(e=>`<circle cx="${e.d/30*w}" cy="${h+10}" r="4" fill="var(--amber)"><title>T+${e.d} ${e.tag} +${e.amp} (${e.src})</title></circle>`).join("")}</svg>
  <div style="font-size:10px;color:var(--muted2)">事件脉冲：${d.events.map(e=>`T+${e.d} ${e.tag}(+${e.amp})`).join(" · ")||"无"}　·　选中 ${d.baseName} 已进入对话上下文（可直接问"影响哪些订单？"）</div></div>
  <div class="box"><b style="font-size:13px">历史处置案例（近 12 个月 ${hist.riskCases.length} 例：越线 → 采纳 → 消解）</b>
  ${tbl(hist.riskCases,["crossedAt","base","factor","peak","adopted","effect"],["越线日","基地","因素","峰值","采纳方案","消解效果"])}</div>`;
}
async function renderProject(m){
  m.innerHTML=`<h2>项目推演 · 型号产能可承接</h2><div class="sub2">真实算法：P50=Σ基地Σ周(周产能×爬坡×检修×认证) · P90=×0.93 · what-if 调参</div>
  <div class="formrow"><label>型号</label><select id="pm"><option>4680-NCM</option><option>2170-NCM</option><option>方形-LFP</option><option>4680-LFP</option></select>
  <label>需求(万套)</label><input id="pq" type="number" value="40"><label>周数</label><input id="pw" type="number" value="6"></div>
  <div class="formrow"><label>what-if：夜班</label><input id="wn" type="number" value="0" min="0" max="3"><label>扩通道</label><input id="wc" type="number" value="0" min="0" max="6"><label>外协%</label><input id="wo" type="number" value="0" min="0" max="20"><button onclick="runProj()">推演</button></div><div id="projOut"></div>`;
  runProj();
}
async function runProj(){
  const r=await api(B,"/b/v1/solvers/capacity_forecast/run",{method:"POST",body:JSON.stringify({args:{modelId:pm.value,qty:+pq.value,weeks:+pw.value,whatif:{night:+wn.value,channels:+wc.value,outsource:+wo.value/100}}})});
  const d=r.data; selected=[{objectType:"Model",objectId:d.modelId,label:d.modelId}];
  document.getElementById("projOut").innerHTML=`<div class="box">
  <div class="kpis"><div class="kpi"><b>${d.p50}</b><span>P50 万套</span></div><div class="kpi"><b>${d.p90}</b><span>P90(×${d.healthFactor})</span></div>
  <div class="kpi"><b style="color:${d.ok?'var(--green)':'var(--red)'}">${d.ok?'✓ 可承接':'缺口 '+d.gap}</b><span>vs 需求 ${d.demand}</span></div>
  <div class="kpi"><b>${d.mainBn.base.replace('·总部','')}</b><span>主瓶颈 ${d.mainBn.bottleneck} (${d.mainBn.tightness})</span></div></div>
  ${tbl(d.perBaseRows,["base","weeklyCap","certFactor","maintWeek","bottleneck","tightness","cumTotal"],["基地","周产能","认证","检修周","瓶颈","紧张度","累计P50"])}</div>`;
}
async function renderAudit(m){
  m.innerHTML=`<h2>规划体检</h2><div class="sub2">WORKFLOW_ONLY 入口示例 · 改字段即时重算（真实诊断规则 X01–R02）</div>
  <div class="formrow"><label>月度需求</label><input id="ad" type="number" value="132"><label>可供给</label><input id="as_" type="number" value="129.5"></div>
  <div class="formrow"><label>毛利目标%</label><input id="ag" type="number" value="16.0" step="0.1"><label>现金垫(亿)</label><input id="ac" type="number" value="58"><label>CAPEX(亿)</label><input id="ax" type="number" value="6"><button onclick="runAudit()">体检</button></div><div id="auditOut"></div>`;
  runAudit();
}
async function runAudit(){
  const r=await api(B,"/b/v1/solvers/plan_audit/run",{method:"POST",body:JSON.stringify({args:{dem:+ad.value,sup:+as_.value,gmTarget:+ag.value,cashCushion:+ac.value,capex:+ax.value}})});
  const d=r.data;
  document.getElementById("auditOut").innerHTML=`<div class="box">
  <div class="kpis"><div class="kpi"><b style="color:${d.score>=85?'var(--green)':d.score>=60?'var(--amber)':'var(--red)'}">${d.score}</b><span>${d.verdict}</span></div></div>
  ${d.hard.map(h=>`<div class="viol">⛔ <b>${h.title}</b> ${h.ruleRef?'['+h.ruleRef+']':''}<br>${h.why}${h.fix?`<br><button style="margin-top:4px;font-size:10px;padding:3px 10px" onclick='applyFix(${JSON.stringify(h.fix.patch)})'>一键应用：${h.fix.label}</button>`:''}</div>`).join("")}
  ${d.medium.map(x=>`<div class="viol warn">⚠ <b>${x.title}</b> ${x.ruleRef?'['+x.ruleRef+']':''}<br>${x.why}</div>`).join("")}
  <div style="font-size:10px;color:var(--muted2);margin-top:6px">"一键应用"仅改表单演示——实际生效走 S&OP 议程与 Action 审批（C10/C22）</div></div>`;
}
function applyFix(p){if(p.sup!=null)as_.value=p.sup;if(p.gmTarget!=null)ag.value=p.gmTarget;if(p.capex!=null)ax.value=p.capex;if(p.cashCushion!=null)ac.value=p.cashCushion;runAudit();}
async function renderGenerate(m){
  const r=await api(B,"/b/v1/solvers/plan_generate/run",{method:"POST",body:JSON.stringify({args:{}})});
  const d=r.data;
  m.innerHTML=`<h2>规划建议 · 三方案</h2><div class="sub2">五路径骨架 → 稳健/均衡/进取，推荐=无硬约束违反中综合分最高（系统不自动决策）</div>
  ${d.plans.map(p=>`<div class="box" style="${p.no===d.recommended?'outline:2px solid rgba(84,181,196,.5)':''}">
   <b>${p.no} · ${p.name}</b> ${p.no===d.recommended?'<span class="badge wf">★ 推荐</span>':''} ${p.hardViol.length?'<span class="badge ag">⛔ 硬约束</span>':''}
   <span class="mono" style="float:right;font-size:18px">${p.hardViol.length?'—':p.total}</span>
   <div style="font-size:11.5px;color:var(--muted);margin-top:6px">收入增长 ${p.outcome.revGrow.toFixed(0)}% · 毛利 ${p.outcome.gm}% · 现金垫 ${p.outcome.cash} 亿 · CAPEX ${p.outcome.capex} 亿 · 份额 +${p.outcome.share}pct</div>
   ${p.hardViol.map(v=>`<div class="viol" style="margin-top:6px">${v}</div>`).join("")}
   <div style="font-size:10px;color:var(--muted2);margin-top:6px">五维：${Object.entries(p.scores).map(([k,v])=>k+" "+Math.round(v)).join(" · ")}</div></div>`).join("")}`;
}
function renderReview(m){
  const h=hist;
  m.innerHTML=`<h2>运营回顾 · 近 12 个月</h2><div class="sub2">系统运行史：精度收敛、校准记录、S&OP 版本、规则演进、意图孵化——全部可追溯（${h.generatedFrom}）</div>
  <div class="kpis"><div class="kpi"><b style="color:var(--green)">${h.mapeSeries[h.mapeSeries.length-1].mape}%</b><span>当前 MAPE（年初 ${h.mapeSeries[0].mape}%）</span></div>
  <div class="kpi"><b>${h.calibrations.filter(c=>c.status==="APPLIED").length}/${h.calibrations.length}</b><span>校准提案 已生效/总数</span></div>
  <div class="kpi"><b>${h.sopVersions.length}</b><span>S&OP 定稿版本</span></div>
  <div class="kpi"><b>${h.riskCases.length}</b><span>风险处置闭环案例</span></div></div>
  <div class="box"><b style="font-size:13px">预测精度 MAPE 收敛（52 周）——"越用越准"的证据链</b>${lineSVG(h.mapeSeries.map((p,i)=>({v:p.mape,l:i%8===0?p.week.slice(5):""})),560,90,"#62BE77")}<div style="font-size:10px;color:var(--muted2)">第 21–22 周的回弹 = Q4 到货危机冲击；随校准生效持续收敛</div></div>
  <div class="box"><b style="font-size:13px">参数校准史（含被拒提案——回测门槛与漂移闸门生效记录）</b>${tbl(h.calibrations,["at","param","from","to","method","mapeGain","status"],["日期","参数","原值","建议值","方法","MAPE改善pct","状态"])}</div>
  <div class="box"><b style="font-size:13px">S&OP 月度版本史</b>${tbl(h.sopVersions,["version","month","demand","supply","attainment","decision"],["版本","月份","需求","供给","达成率%","第⑤步决议"])}</div>
  <div class="box"><b style="font-size:13px">Action 审计史（${h.actionHistory.length} 条 · 展示 10）</b>${tbl(h.actionHistory.slice(0,10),["createdAt","actionType","initiator","status","targetRef","comment"],["日期","类型","发起","状态","写回","备注"])}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
  <div class="box"><b style="font-size:13px">规则演进</b>${tbl(h.ruleVersions,["at","rule","version","change"],["日期","规则","版本","变更"])}</div>
  <div class="box"><b style="font-size:13px">意图孵化记录（兜底 → 预设）</b>${tbl(h.incubated,["at","intentKey","from"],["日期","意图","来源"])}</div></div>`;
}
function tbl(rows,keys,heads,onclick){
  window.__rows=rows; window.__click=onclick;
  return `<table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map((r,i)=>`<tr id="tr${i}" onclick="window.__click&&(window.__click(window.__rows[${i}]),[...document.querySelectorAll('tr')].forEach(x=>x.classList.remove('sel')),document.getElementById('tr${i}').classList.add('sel'))">${keys.map(k=>`<td>${r[k]}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function pick(type,id,label){selected=[{objectType:type,objectId:id,label}];}

/* ---------- 查询 Dock（SSE） ---------- */
async function ask(){
  const q=document.getElementById("q").value.trim(); if(!q)return;
  document.getElementById("q").value="";
  const chat=document.getElementById("chat");
  chat.insertAdjacentHTML("beforeend",`<div class="msg q">${esc(q)}</div>`);
  const sid="m"+Date.now();
  chat.insertAdjacentHTML("beforeend",`<div class="msg" id="${sid}"><span class="spin"></span> <span class="steps" id="${sid}s">路由中…</span><div id="${sid}a"></div></div>`);
  chat.scrollTop=chat.scrollHeight;
  try{
    const r=await api(B,"/b/v1/queries",{method:"POST",body:JSON.stringify({query:q,context:{view,selectedObjects:selected,filters:{},conversationId:conv}})});
    conv=conv||r.conversationId;
    const es=new EventSource(`${B}${r.streamUrl}?access_token=${token}`);
    const steps=[];
    es.addEventListener("routing.completed",e=>{const d=JSON.parse(e.data);steps.push(d.path==="WORKFLOW"?`✓ 命中意图 ${d.intentKey}（${(d.confidence*100||0).toFixed(0)}%）`:`→ 探索模式（agent=${d.agentKey}）`);upd();});
    es.addEventListener("step.started",e=>{const d=JSON.parse(e.data);steps.push(`⚙ ${d.type}…`);upd();});
    es.addEventListener("step.completed",e=>{const d=JSON.parse(e.data);steps[steps.length-1]=`✓ ${d.type} (${d.outcome})`;upd();});
    es.addEventListener("action_draft.created",e=>{const d=JSON.parse(e.data);steps.push(`📋 草稿 ${d.draftId} 已创建（待审批）`);upd();});
    es.addEventListener("answer.final",e=>{renderAnswer(sid,JSON.parse(e.data));es.close();});
    es.addEventListener("task.failed",e=>{const d=JSON.parse(e.data);document.getElementById(sid).innerHTML=`<div class="ans" style="border-color:var(--red)">❌ ${d.code}: ${esc(d.message)}</div>`;es.close();});
    function upd(){document.getElementById(sid+"s").innerHTML=steps.join("<br>");chat.scrollTop=chat.scrollHeight;}
  }catch(e){document.getElementById(sid).innerHTML=`<div class="ans" style="border-color:var(--red)">❌ ${esc(e.message)}</div>`;}
}
function renderAnswer(sid,ans){
  ans.provenance.forEach(p=>provMap[p.id]=p);
  const isAg=ans.trustLevel==="AGENT_EXPLORATORY";
  let h=`<div class="ans ${isAg?'agent':''}"><span class="badge ${isAg?'ag':'wf'}">${isAg?'探索 · AI':'已验证 · 工作流'}</span>`;
  if(ans.unverifiedNumerics)h+=`<div class="warnbar">部分数字未能溯源，仅供参考</div>`;
  for(const b of ans.blocks){
    if(b.type==="text")h+=`<div>${md(b.markdown)}</div>`;
    if(b.type==="kpi")h+=`<span class="ablock-kpi" onmouseenter="showProv(event,'${b.provId}')" onmouseleave="hideProv()"><b>${b.value}${b.unit?'<small style="font-size:9px;color:var(--muted2)"> '+b.unit+'</small>':''}</b><span>${b.label}</span></span>`;
    if(b.type==="table")h+=`<table><thead><tr>${b.columns.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${b.rows.slice(0,8).map(r=>`<tr>${r.map(c=>`<td>${c??""}</td>`).join("")}</tr>`).join("")}${b.rows.length>8?`<tr><td colspan="${b.columns.length}" style="color:var(--muted2)">… 共 ${b.rows.length} 行</td></tr>`:""}</tbody></table>`;
    if(b.type==="rule_violation")h+=`<div class="viol ${b.severity==='WARN'?'warn':''}">${b.severity==='WARN'?'⚠':'⛔'} [${b.ruleId}] ${esc(b.explanation)}</div>`;
    if(b.type==="action_draft")h+=`<div class="draft">📋 <b>${b.actionType}</b> · ${b.draftId}<br>${esc(b.summary)}</div>`;
  }
  h+=`</div>`;
  document.getElementById(sid).innerHTML=h;
  document.getElementById("chat").scrollTop=1e9;
}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,'<code class="mono" style="font-size:10px;color:var(--accent)">$1</code>').replace(/⟦ref:(\w+)⟧/g,'<span class="ref" onmouseenter="showProv(event,\'$1\')" onmouseleave="hideProv()">◈</span>')}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function showProv(e,id){const p=provMap[id];const el=document.getElementById("prov");
  el.innerHTML=p?`<b>溯源</b><br>工具：<span class="mono">${p.toolName}</span><br>调用：<span class="mono">${p.toolCallId}</span><br>路径：<span class="mono">${p.outputPath}</span><br>快照：<span class="mono">${p.snapshotVersion||"—"}</span>`:`<b>溯源</b><br>引用 #${id}（探索模式证据）`;
  el.style.display="block";el.style.left=Math.min(e.clientX,innerWidth-340)+"px";el.style.top=(e.clientY+14)+"px";}
function hideProv(){document.getElementById("prov").style.display="none"}
</script>
