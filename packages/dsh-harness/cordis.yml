# WO-DSH-POC-S1 · 路 B 运行时 cordis.yml（@platform/dsh-harness）——**生产档**。
# 与 S0 冒烟配置的差异：stock sdk-jsonrpc-server 换成我方 platform-sdk-server
# （stock 的 createSession 不收 setup 钩子 —— sdk/server/src/server.ts:223-231 写死，
#  而 setup 是按 AgentDefinition 组 scoped 世界的唯一入口）。
# stdout 只走 JSON-RPC，禁止挂 console logger。
#
# 全量钉 0.1.0-rc.6（npm dist-tag 分裂：多数包 latest 停在 0.0.1-rc.1，裸装必 ERESOLVE）。
#
# WO-DSH-N1-PROVIDER：生产档只挂 platform-llm（真 provider 缝）；mock-llm / echo-tool
# 测试夹具迁测试专档 cordis.poc.yml（E1/E2/smoke/stall 剧本经 runner opts.cordisFile 指入）。

- id: platform-sdk-server
  name: './plugins/platform-sdk-server.mjs'

# S2 · 治理裁决网桥 —— F-1（WO-DSH-PROD-READY）起生产档 = http 模式：POST {tool, args,
# governance} 到 agentcore 规则评估端点 /b/v1/governance/adjudicate（带外通道）。
# url/token 不落盘：engine 分叉逐 run 经 runner opts.env 注入 PLATFORM_GOV_URL
# （缺省推导 http://127.0.0.1:${PORT}/b/v1/governance/adjudicate，DSH_GOV_URL 可覆盖）
# 与 PLATFORM_GOV_TOKEN（= SERVICE_TOKEN，未配置则不发头）。fail-closed 链：http 模式
# 无 url ⇒ 插件 initialize 抛错；端点 401/不可达/畸形应答 ⇒ 插件一律转 deny。
- id: platform-governance
  name: './plugins/platform-governance.mjs'
  config:
    mode: 'http'

# W8主 · tool-execute 反向通道桥：子进程世界经本插件 fetch 宿主 /b/v1/dsh/tool-execute
# （带外通道，与 platform-governance http 模式同构）。url/token/runToken 不落盘：engine
# 分叉逐 run 经 runner opts.env 注入 PLATFORM_TOOL_EXEC_URL（缺省推导
# http://127.0.0.1:${PORT}/b/v1/dsh/tool-execute，DSH_TOOL_EXEC_URL 可覆盖）、
# PLATFORM_TOOL_EXEC_TOKEN（= SERVICE_TOKEN，未配置不发头 ⇒ 端点恒 401 fail-closed）与
# DSH_RUN_TOKEN（per-run 一次性，run 终注销）。env 缺 url/runToken ⇒ 插件休眠不抛
# （runner 级消费方无该 env）；setup.hostTools 到达而桥休眠 ⇒ platform-world 创建期
# fail-closed 抛错。端点非 200/不可达/超时/畸形应答 ⇒ 一律 ERROR 回执，零静默放行。
- id: platform-tool-bridge
  name: './plugins/tool-bridge.mjs'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: 'platform dsh harness (POC S1)'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: skill
  name: '@deepseek-ai/dsh-skill'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

# WO-DSH-N1-PROVIDER · 生产形态 LLM 适配器桥：路由 'platform'（= agentcore config.ts
# PRODUCTION_DSH_HARNESS_PROVIDER 同值）。连接事实逐 run 经 runner opts.env 注入
# （PLATFORM_LLM_API/BASE_URL/MODEL/API_KEY）；env 未注入 ⇒ 不注册路由（initialize 防呆诚实报错）。
- id: platform-llm
  name: './plugins/platform-llm.mjs'
