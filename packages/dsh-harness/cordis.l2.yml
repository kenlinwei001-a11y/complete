# WO-DSH-E2E · L2 专档 cordis.l2.yml（@platform/dsh-harness）——**真链路三实测试档**。
# 与生产档 cordis.yml 唯一差异：platform-governance 从 mock 档换 http 档（真规则缝）。
# url/token 不落盘：url 取 env PLATFORM_GOV_URL、服务间凭据取 env PLATFORM_GOV_TOKEN
# （插件 additive 支持，缺 token 则不发 x-service-token 头），均由 runner opts.env 注入。
# 生产档/poc 档逐字不动；本档只被 apps/agentcore/test/dsh-e2e-real-triad.test.ts 引用
# （runner opts.cordisFile 指入）。

- id: platform-sdk-server
  name: './plugins/platform-sdk-server.mjs'

- id: platform-governance
  name: './plugins/platform-governance.mjs'
  config:
    mode: 'http'

# W8主 · tool-execute 反向通道桥（与生产档同款；url/token/runToken 逐 run 经 env 缝注入，
# 缺 env ⇒ 休眠不抛——L2 三实 runner 级直驱无该 env，hostTools 到达而桥休眠 ⇒
# platform-world 创建期 fail-closed）。见 cordis.yml 同条注释。
- id: platform-tool-bridge
  name: './plugins/tool-bridge.mjs'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: 'platform dsh harness (POC S1)'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: skill
  name: '@deepseek-ai/dsh-skill'

- id: agent
  name: '@deepseek-ai/dsh-agent'

# P2A · 模型面技能目录 + `skill` 加载工具（dsh 原生缝）。inject = agents/tools/skills；
# 目录与工具都只经 ctx.skills 读，技能来源由 platform-world 的平台自有 SkillProvider
# 逐 run 注册（来源 = setup.spec.skills，不是文件系统 —— 故不挂 dsh-skill-filesystem）。
# catalogDescriptionMaxLength 显式钉 200 = SkillDefinitionSchema.summary 上限
# （packages/contracts/src/agentcore.ts，两侧同一个量）；不设 = 吃上游默认 500。
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  config:
    catalogDescriptionMaxLength: 200

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

# 生产形态 LLM 适配器桥（与生产档同款）：路由 'platform'，连接事实逐 run 经 runner
# opts.env 注入（PLATFORM_LLM_API/BASE_URL/MODEL/API_KEY）。
- id: platform-llm
  name: './plugins/platform-llm.mjs'
