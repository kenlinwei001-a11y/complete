# WO-DSH-N1-PROVIDER · 测试专档 cordis.poc.yml（@platform/dsh-harness）。
# 用途：dsh-poc-acceptance E1/E2、smoke.mjs、mock stall 剧本等**测试夹具**经 runner
# opts.cordisFile 指到本档；生产档 cordis.yml 只挂 platform-llm（真 provider 缝）。
# 内容 = 生产档 + mock-llm + echo-tool 两条测试夹具条目（其余逐字相同）。
# mock-llm.mjs 文件本体不可物理删除（N3 stall_loop 剧本住着；落线协调）。
#
# ---- 以下为 WO-DSH-POC-S1 原档说明 ----
# 路 B 运行时配置。与 S0 冒烟配置的差异：stock sdk-jsonrpc-server 换成我方
# platform-sdk-server（stock 的 createSession 不收 setup 钩子 ——
# sdk/server/src/server.ts:223-231 写死，而 setup 是按 AgentDefinition 组 scoped 世界的唯一入口）。
# stdout 只走 JSON-RPC，禁止挂 console logger。
#
# 全量钉 0.1.0-rc.6（npm dist-tag 分裂：多数包 latest 停在 0.0.1-rc.1，裸装必 ERESOLVE）。

- id: platform-sdk-server
  name: './plugins/platform-sdk-server.mjs'

# S2 · 治理裁决网桥：mock 模式 deny 清单取 env PLATFORM_GOV_DENY（csv）优先于 config.deny。
# 生产换 mode: http + url 指向 agentcore 规则评估端点（带外通道）。
- id: platform-governance
  name: './plugins/platform-governance.mjs'
  config:
    mode: 'mock'
    deny: []

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: 'platform dsh harness (POC S1)'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: skill
  name: '@deepseek-ai/dsh-skill'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

# --- POC 夹具（测试专档保留；生产档 cordis.yml 已摘除） ---
- id: mock-llm
  name: './plugins/mock-llm.mjs'

# WO-DSH-N1-PROVIDER · 生产形态 LLM 适配器桥：路由 'platform'（= agentcore config.ts
# PRODUCTION_DSH_HARNESS_PROVIDER 同值）。连接事实逐 run 经 runner opts.env 注入
# （PLATFORM_LLM_API/BASE_URL/MODEL/API_KEY）；env 未注入 ⇒ 不注册路由（initialize 防呆诚实报错）。
- id: platform-llm
  name: './plugins/platform-llm.mjs'

- id: echo-tool
  name: './plugins/echo-tool.mjs'
