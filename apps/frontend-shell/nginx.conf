# SPA 静态服务（容器内）：所有非文件路径回退 index.html（react-router 数据路由）。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 指纹化静态资源长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存（发版即生效）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
