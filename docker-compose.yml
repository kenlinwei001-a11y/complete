services:
  postgres-a:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: datacore
      POSTGRES_PASSWORD: datacore
      POSTGRES_DB: datacore
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datacore"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-b:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: agentcore
      POSTGRES_PASSWORD: agentcore
      POSTGRES_DB: agentcore
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentcore"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  datacore:
    build:
      context: .
      dockerfile: apps/datacore/Dockerfile
    environment:
      DATABASE_URL: postgres://datacore:datacore@postgres-a:5432/datacore
      PORT: "4001"
      JWT_SECRET: dev-secret-change-me
      CREDENTIAL_KEY: 0123456789abcdef0123456789abcdef
      BLOB_DIR: /data/blobs
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "4001:4001"
    depends_on:
      postgres-a:
        condition: service_healthy

  agentcore:
    build:
      context: .
      dockerfile: apps/agentcore/Dockerfile
    environment:
      DATABASE_URL: postgres://agentcore:agentcore@postgres-b:5432/agentcore
      PORT: "4002"
      DATACORE_BASE_URL: http://datacore:4001
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      QOS_CLASSIFIER_MODEL: claude-haiku-4-5
      QOS_AGENT_MODEL: claude-opus-4-8
      QOS_TAU_HIGH: "0.85"
      QOS_TAU_LOW: "0.55"
    ports:
      - "4002:4002"
    depends_on:
      postgres-b:
        condition: service_healthy
