# ── 图谱自己的盲区清单（机器可读）───────────────────────────────────────────
# premise-check 的第四列会拿声明维度去撞这张表。**没有这张表**，第四列只能降到「存疑」——
# 因为「图谱没说它看不见 X」和「图谱看得见 X」是两个不同的命题。
#
# ⚠ 每条**必须带 dims**（该盲区遮住的是哪几类声明）。只写散文的话，premise-check 只能拿
#   关键词去撞，而「两段文字有共同的词」不度量「它们说的是同一件事」——
#   实测撞错过一次：「引用图看不见 re-export 形式的调用」（说的是 NOREF）被撞到了
#   空文件声明（EMPTYFILE）头上，凭空给一条本来可信的结论扣上「图谱自认盲区」。
blindSpots:
  - dims: [NOREF, REFCOUNT]
    text: "引用图只解析静态可见的调用；re-export / 高阶函数 / 依赖注入 / 字符串键分发 / 事件订阅这五类看不见 ⇒ 「零调用方」这类否定结论本图谱永远给不实"
  - dims: []
    text: "不度量「算得对不对」—— 链路接通、类型正确、测试全绿的边，系数写错了图谱照样标 wired（CLAUDE.md 铁律 1.5 那条 9.75/9.75 的病，本图谱一个字都看不见）"
  - dims: [NOREF, REFCOUNT]
    text: "不度量运行期条件：一条 src 入边可能挂在一个恒假的分支上（「接了线没数据」态），图谱只说「接了线」"
  - dims: [COORD]
    text: "行号取自 generatedFrom 那一棵树；派单基于更新的树时坐标会漂，±容差内「对上了」不证明是同一处"

