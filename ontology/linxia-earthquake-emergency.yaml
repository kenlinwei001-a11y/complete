    - 关键
    text: '特别重大地震灾害后，州抗震救灾指挥部提出启动地震Ⅰ级应急响应的建议，立即向州委、州政府报告，由州委、州政府决定启动地震Ⅰ级应急响应。第一时间向省委、省政府报告。

      在省抗震救灾指挥部的指导和州委、州政府的领导下，由州抗震救灾指挥部组织开展抗震救灾工作，主要采取以下措施：

      '
