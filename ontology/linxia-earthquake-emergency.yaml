    - 关键
    text: '（9）加强监测和震情研判。加密开展震情监测研判，密切监视震情发展和地震宏微观异常现象，及时通报震区余震分布情况，加强震区灾害性天气、次生灾害危险源监测，及时预报预警；加强空气、水源、土壤和地质灾害监测，减轻或消除污染危害。

      '
  - id: LX-C042
    section: '5.1'
    title: 州级Ⅰ级应急响应
    subsection: （10）灾害风险排查。对灾区重大危险源、重要目标、重要基础设施进行隐
    char_count: 197
    ontology_refs:
    - RL-LX-1
    - ACT-LX-01..16
    tags:
    - Ⅰ级响应
    - 措施清单
    - 关键
    text: '（10）灾害风险排查。对灾区重大危险源、重要目标、重要基础设施进行隐患排查与监测预警。防范因强余震和降雨形成的滑坡、泥石流、坍塌等次生灾害造成新的人员伤亡和交通堵塞；组织专家对水库、堤坝、闸站等开展险情排查、评估和除险加固，必要时进行人员转移；加强危险化学品生产储存设备、输油气管道、输配电线路等重点设施的受损情况排查，及时采取安全防范措施；对灾区集中安置点和应急避难场所开展次生灾害隐患排查。

      '
  - id: LX-C043
    section: '5.1'
    title: 州级Ⅰ级应急响应
    subsection: （11）抢修生命线工程。抢通灾区运输路线，组织制定紧急运输保障方案，
    char_count: 153
    ontology_refs:
    - RL-LX-1
    - ACT-LX-01..16
    tags:
    - Ⅰ级响应
    - 措施清单
    - 关键
    text: '（11）抢修生命线工程。抢通灾区运输路线，组织制定紧急运输保障方案，规划运输路线，综合调配运力，保障灾区的交通畅通。组织调集通信、供电、供水等车辆，优先确保应急指挥、人员搜救、医疗救治和群众安置等；相关企业抢修供电、通信、供水、供气、广播电视等基础设施，尽快恢复灾区各类基础设施功能，保障群众基本生活需要。

      '
  - id: LX-C044
    section: '5.1'
    title: 州级Ⅰ级应急响应
    subsection: （12）安置受灾群众。组织受灾群众转移，鼓励群众投亲靠友，及时开放应
    char_count: 131
    ontology_refs:
    - RL-LX-1
    - ACT-LX-01..16
    tags:
    - Ⅰ级响应
    - 措施清单
    - 关键
    text: '（12）安置受灾群众。组织受灾群众转移，鼓励群众投亲靠友，及时开放应急避难场所,设置临时、安全的集中安置点；设立救灾物资集中接收点（库），统筹调运食品、饮用水、衣被、帐篷、折叠床等各类生活物资，指导灾区发放救灾物资，保障灾区急需生活物资供应，妥善安置好受灾群众。

      '
  - id: LX-C045
    section: '5.1'
    title: 州级Ⅰ级应急响应
    subsection: （13）加强新闻报道。按要求及时组织召开新闻发布会，有序做好震情、灾
    char_count: 63
    ontology_refs:
    - RL-LX-1
    - ACT-LX-01..16
    tags:
    - Ⅰ级响应
    - 措施清单
    - 关键
    text: '（13）加强新闻报道。按要求及时组织召开新闻发布会，有序做好震情、灾情权威信息发布和新闻宣传报道工作，加强舆情应对和舆论引导。

      '
  - id: LX-C046
    section: '5.1'
    title: 州级Ⅰ级应急响应
    subsection: （14）涉外事务管理。妥善转移安置在灾区工作和旅游的国（境）外人员，
    char_count: 127
    ontology_refs:
    - RL-LX-1
    - ACT-LX-01..16
    tags:
    - Ⅰ级响应
    - 措施清单
    - 关键
    text: '（14）涉外事务管理。妥善转移安置在灾区工作和旅游的国（境）外人员，及时向省上有关部门汇报情况；做好国（境）外新闻媒体釆访工作的组织管理；组织协调国(境)外救援队在灾区开展活动，做好国(境)外捐赠物资款项的接收和管理，按规定做好检验检疫、登记管理等工作。

      '
  - id: LX-C047
    section: '5.1'
    title: 州级Ⅰ级应急响应
    subsection: （15）生产生活恢复。指导灾区党委、政府实施救灾救助，帮助灾区企业恢
    char_count: 58
    ontology_refs:
    - RL-LX-1
    - ACT-LX-01..16
    tags:
    - Ⅰ级响应
    - 措施清单
    - 关键
    text: '（15）生产生活恢复。指导灾区党委、政府实施救灾救助，帮助灾区企业恢复生产、恢复正常市场供应和群众复工、学生复课等。

      '
  - id: LX-C048
    section: '5.1'
    title: 州级Ⅰ级应急响应
    subsection: （16）加强应急值守。震后72小时内，各有关成员单位安排1名县级干部
    char_count: 85
    ontology_refs:
    - RL-LX-1
    - ACT-LX-01..16
    tags:
    - Ⅰ级响应
    - 措施清单
    - 关键
    text: '（16）加强应急值守。震后72小时内，各有关成员单位安排1名县级干部和至少1名科级干部集中在州抗震救灾指挥部办公点值班值守；震后4至7天内，安排至少1名科级干部值班值守。

      '
  - id: LX-C049
    section: '5.2'
    title: 州级Ⅱ级应急响应
    char_count: 114
    ontology_refs:
    - RL-LX-2
    tags:
    - Ⅱ级响应
    - 启动权限
    - 关键
    text: '初判为重大地震灾害后，由州抗震救灾指挥部提出启动地震Ⅱ级应急响应的建议，立即向州委、州政府报告，由州政府决定启动地震Ⅱ级应急响应，第一时间向省委、省政府报告。

      州抗震救灾指挥部参照地震Ⅰ级应急响应有关措施，组织开展应急处置工作。

      '
  - id: LX-C050
    section: '5.3'
    title: 州级Ⅲ级应急响应
    char_count: 270
    ontology_refs:
    - RL-LX-3
    tags:
    - Ⅲ级响应
    - 启动权限
    - 关键
    - 冲突C-LX-02
    text: '初判为较大地震灾害后，由州抗震救灾指挥部办公室提出启动地震Ⅲ级应急响应的建议，立即向州委、州政府报告，由州政府决定启动地震Ⅲ级应急响应。第一时间向省委、省政府报告。

      在省抗震救灾指挥部的指导下，州委、州政府组织协调全州的抗震救灾工作，及时收集上报灾情，组织开展人员搜救、医疗救治、群众安置、基础设施抢修等应急处置工作。州抗震救灾指挥部成立现场指挥部赴受灾地区，协助当地县（市）政府做好抗震救灾工作。

      当灾情超出本州应对能力、震情敏感复杂或发生在重要时段的较大地震灾害事件，州委、州政府向省抗震救灾指挥部报告，按程序报请启动地震Ⅱ级应急响应。

      '
  - id: LX-C051
    section: '5.4'
    title: 州级 Ⅳ级应急响应
    char_count: 242
    ontology_refs:
    - RL-LX-4
    tags:
    - Ⅳ级响应
    - 启动权限
    - 关键
    text: '一般地震灾害发生后，州抗震救灾指挥部办公室及时了解震情、灾情和灾区应对情况，报告州抗震救灾指挥部，并通报州抗震救灾指挥部成员单位和有关部门，根据实际需要，由州抗震救灾指挥部办公室视情决定启动地震Ⅳ级应急响应。

      在省抗震救灾指挥部办公室、州抗震救灾指挥部的指导下，受灾地区县（市）党委、政府、组织开展人员搜救、医疗救护、受灾群众安置、次生灾害防范和应急恢复等工作。州抗震救灾指挥部视情派出联合工作组，指导受灾地区县（市）党委、政府开展应急处置工作，并根据需求给予救援队伍和应急物资支援。

      '
  - id: LX-C052
    section: '6'
    title: 应急结束
    char_count: 116
    ontology_refs:
    - TERM-LX
    tags:
    - 应急结束
    - 终止条件
    text: '在抗震救灾应急工作基本结束、紧急转移和安置人员工作基本完成、地震次生灾害影响基本消除，以及交通运输、电力、通信和供水设施等基本抢修抢通，灾区生活秩序基本恢复后，由应急响应启动机构决定终止应急响应，由应急救援阶段转入灾后恢复重建阶段。

      '
  - id: LX-C053
    section: '7'
    title: 恢复重建
    char_count: 0
    text: ''
    note: 章标题，无正文
  - id: LX-C054
    section: '7.1'
    title: 恢复重建规划
    char_count: 205
    ontology_refs:
    - RECOV-LX-PLAN
    tags:
    - 恢复重建
    text: '特别重大地震灾害发生后，省政府按照国务院及国家相关部委的要求，组织编制灾后恢复重建规划。重大、较大、一般地震灾害发生后，按照分级应对的原则在上一级人民政府的安排部署和有关部门的组织下，按照相关规定按程序由省发改委牵头，会同省财政厅、省应急厅、省地震局等部门和灾区市（州）人民政府编制灾后恢复重建规划。州政府按程序组建灾后恢复重建指导协调小组，研究解决恢复重建中的重大问题，指导受灾县（市）开展灾后恢复重建工作。

      '
  - id: LX-C055
    section: '7.2'
    title: 恢复重建实施
    char_count: 58
    ontology_refs:
    - RECOV-LX-IMPL
    tags:
    - 恢复重建
    text: '州、县（市）人民政府根据灾后恢复重建规划和当地经济社会发展水平，有计划、分步骤地组织实施本行政区域灾后恢复重建工作。

      '
  - id: LX-C056
    section: '8'
    title: 其他地震事件应急
    char_count: 0
    text: ''
    note: 章标题，无正文
  - id: LX-C057
    section: '8.1'
    title: 强有感地震事件
    char_count: 189
    ontology_refs:
    - EVT-LX-FELT
    tags:
    - 其他地震事件
    text: '强有感地震事件是指发生在州政府所在地，以及大中型水库等重要设施场地及附近的震级在4.5级以下，且有明显震感，可能会对社会造成一定影响的地震事件。

      事件发生地县（市）党委、政府负责本行政区强有感地震事件应急处置工作。州应急局迅速了解当地灾情，视情派出工作组协助当地政府开展地震应急处置工作。州地震局及时收集震情，提出震情趋势研判意见。州委宣传部协调相关部门做好科普宣传和舆论引导。

      '
  - id: LX-C058
    section: '8.2'
    title: 临震应急事件
    char_count: 256
    ontology_refs:
    - EVT-LX-IMMINENT
    tags:
    - 临震应急
    text: '临震应急事件是指省级以上人民政府发布短临地震预报后，县级以上人民政府需要及时进行处置的地震事件。

      短临地震预报发布后，州抗震救灾指挥部指导、督促预报区域县（市）党委、政府做好防震抗震和抢险救援准备。地震预报区县（市）人民政府统一指挥部署应急准备工作，并视情组织人员避震疏散或撤离。州地震局加强震情监视，及时报告震情趋势研判意见。州委宣传部协调相关部门做好科普宣传和舆论引导。州抗震救灾指挥部各成员单位对可能发生的地震事件影响后果进行评估并做好防震抗震和抢险救援准备。

      终止临震应急公告由省抗震救灾指挥部统一发布。

      '
  - id: LX-C059
    section: '8.3'
    title: 地震传言事件
    char_count: 193
    ontology_refs:
    - EVT-LX-RUMOR
    tags:
    - 地震传言
    text: '地震传言事件事发地党委、政府负责做好本行政区内地震传言事件的应急处置工作。州地震局迅速对地震传言事件进行分析研判，及时明确事件性质并发布声明。州委宣传部、州委网信办、州公安局负责指导协助当地党委政府采取有效措施平息传言，维护社会秩序稳定。如地震传言扩散迅速对社会正常生产生活秩序造成严重影响时，州抗震救灾指挥部应组织联合工作组赴地震传言影响地区，指导和协助当地党委政府迅速平息地震传言。

      '
  - id: LX-C060
    section: '8.4'
    title: 周边地区地震事件
    char_count: 178
    ontology_refs:
    - EVT-LX-NEARBY
    tags:
    - 周边地震
    - 跨界
    - 关键
    text: '地震发生在周边地区，但对我州造成震灾损失或严重社会影响时，州地震局迅速分析周边地震对我州的影响，研判我州境内的地震烈度，评估地震可能造成的伤亡损失。州抗震救灾指挥部办公室根据震级大小、灾情严重程度和州地震局研判结果，向州抗震救灾指挥部或受影响的县（市）政府提出启动地震应急响应的建议，按照程序决定启动应急响应后，有关县（市）部门和单位立即开展应急处置工作。

      '
  - id: LX-C061
    section: '8.5'
    title: 支援周边地区地震事件
    char_count: 124
    ontology_refs:
    - EVT-LX-SUPPORT
    tags:
    - 对外支援
    text: '当周边发生较大地震灾害事件，向我州提出支援请求时，州抗震救灾指挥部按照州委、州政府的有关要求组织实施对外支援工作。协调州级有关部门组织专业救援队伍进行支援。协调州发改委、州商务局、州交通局、州粮食和物资储备局等部门和单位做好救灾物资筹措和运送工作。

      '
  - id: LX-C062
    section: '9'
    title: 保障措施
    char_count: 0
    text: ''
    note: 章标题，无正文
  - id: LX-C063
    section: '9.1'
    title: 应急指挥系统保障
    char_count: 248
    ontology_refs:
    - SF-LX-01
    tags:
    - 保障
    text: '州、县（市）人民政府要设置应急指挥场所，建立健全相应的地震应急指挥系统，实现省、州、县（市）三级应急指挥平台互联互通。有条件的乡（镇）人民政府积极建立应急指挥平台，实现与州、县（市）应急指挥平台互联互通。州、县（市）应急、地震部门综合利用自动监测、通信、计算机、遥感等技术，建立健全应急指挥信息系统，形成上下贯通、反应灵敏、功能完善、统一高效的应急指挥平台，实现震情灾情快速响应、灾害损失快速评估与动态跟踪、地震趋势判断的快速反馈，为各级党委、政府科学决策和精准指挥调度抗震救灾工作提供有力支撑。

      '
  - id: LX-C064
    section: '9.2'
    title: 队伍建设
    char_count: 210
    ontology_refs:
    - SF-LX-02
    tags:
    - 保障
    - 队伍
    text: '州、县（市）政府要加强地震灾害紧急救援队伍、综合消防救援队伍建设并提供必要支持保障。州、县（市）抗震救灾指挥部成员单位要加强本系统本行业的专业救援队伍建设。乡（镇）人民政府、街道办事处组织动员社会各方面力量，建立基层抗震救灾队伍。各地各有关部门依托社会团体、企事业单位及社区建立地震应急救援志愿者队伍，形成广泛参与地震应急救援的社会动员机制。各级应急、地震部门要加强地震应急专家队伍建设，为地震灾害应急处置提供技术支撑。

      '
  - id: LX-C065
    section: '9.3'
    title: 物资与资金保障
    char_count: 223
    ontology_refs:
    - SF-LX-03
    tags:
    - 保障
    - 物资
    - 资金
    text: '州政府、各县（市）人民政府及其有关部门部门根据相关法律法规及职责任务，制定应急物资保障方案，建立健全物资采购、储备、调拨及紧急配送机制，保障地震灾害应急工作所需生活救助物资、地震救援、监测预警、现场调查、人员防护、应急通信、通信指挥、工程抢险装备、医疗器械和药品等物资装备的有效供应。

      抗震救灾工作所需财政负担的经费，按照财政事权和支出责任划分分级承担。对启动州级层面地震灾害应急响应的，根据县（市）人民政府请求，州政府结合实际情况给予适当支持。

      '
  - id: LX-C066
    section: '9.4'
    title: 避难场所保障
    char_count: 189
    ontology_refs:
    - SF-LX-04
    tags:
    - 保障
    - 避难场所
    text: '州政府、各县（市）人民政府及其有关部门应建立必要的应急避难场所，或者利用符合条件的广场、绿地、公园、学校、体育场馆等公共设施，因地制宜设立符合相关标准的地震灾害应急避难场所，统筹安排所必需的交通运输、通信、供水、供电、排污、环保、物资储备等设施设备。

      学校、医院、影剧院、商场、酒店、体育场馆、宗教场所等人员密集场所设置应急疏散通道，配备必要的救生避险设施，保证通道、出口畅通。

      '
  - id: LX-C067
    section: '9.5'
    title: 基础设施保障
    char_count: 371
    ontology_refs:
    - SF-LX-05
    tags:
    - 保障
    - 基础设施
    text: '州工信局建立健全应急通信工作体系，建立有线和无线相结合、基础通信网络与机动通信系统相配套的应急通信保障系统，确保地震应急救援工作的通信畅通。在基础通信网络等基础设施遭到严重损毁且短时间难以修复的情况下，立即组织相关单位启动应急卫星、短波等无线通信系统和终端设备，确保至少有一种以上临时通信手段有效、畅通。

      州文旅局、州广播电视台要完善广播电视传输覆盖网，建立完善有线和无线相结合的应急广播体系，在广播电视传输覆盖设施遭受到严重损毁且短时间难以修复的情况下，立即启动卫星、短波广播系统，确保至少有一种广播电视传输覆盖手段畅通。

      州工信局、国网临夏供电公司协调指导电力企业加强电力基础设施、电力调度系统建设，保障地震救援现场供电需求和灾区电力供应。

      州公安局、州交通局等部门和单位加强公路紧急运输保障的统一指挥调度，建立应急救援“绿色通道”机制。

      '
  - id: LX-C068
    section: '9.6'
    title: 宣传培训
    char_count: 191
    ontology_refs:
    - SF-LX-06
    tags:
    - 保障
    - 宣传培训
    text: '州、县（市）人民政府要建立健全地震应急管理培训制度，结合实际，组织应急管理人员、救援人员、志愿者等进行地震应急知识和救援技能培训。

      宣传、教育、文旅、地震、广播电视、红十字会、新闻出版等主管部门密切配合，开展防震减灾科学、法律知识普及和宣传教育，动员社会公众积极参与防震减灾活动，提高全社会防震避险和自救互救能力。学校把防震减灾知识教育纳入教学内容，教育、地震等部门加强指导和监督。

      '
  - id: LX-C069
    section: '10'
    title: 预案管理
    char_count: 0
    text: ''
    note: 章标题，无正文
  - id: LX-C070
    section: '10.1'
    title: 预案编制修订
    char_count: 254
    ontology_refs:
    - PLAN-LX-REVISE
    tags:
    - 预案管理
    - 备案
    - 关键
    text: '州应急局会同州地震局等有关部门编制本预案，并根据工作实际需要及时进行修订和完善。

      州、县（市）人民政府应结合实际制定本行政区域地震应急预案，报州抗震救灾指挥部办公室备案。

      州、县（市）人民政府有关部门要结合本部门职能制定地震应急预案或包括抗震救灾内容的应急预案，报本级抗震救灾指挥部办公室备案。

      交通、水务、电力、通信、广播电视等基础设施经营管理单位和学校、医院，以及可能发生次生灾害的设施、矿山、危险物品等生产经营单位制定地震应急预案或包括抗震救灾内容的应急预案，并报所在地县级相抗震救灾指挥部办公室备案。

      '
  - id: LX-C071
    section: '10.2'
    title: 预案演练
    char_count: 200
    ontology_refs:
    - PLAN-LX-DRILL
    tags:
    - 预案管理
    - 演练
    text: '州、县（市）人民政府及其有关部门建立健全抗震救灾演练制度，制定演练计划，根据预案规定和实际情况，采取实战演练、桌面推演等方式，组织开展贴近实际、形式多样、广泛参与的应急演练。上年度发生较大以上级别地震灾害的地区，本年度至少组织进行1次应急演练，机关、学校、医院、企事业单位和基层组织等，要结合实际开展地震应急演练。法律法规和国家另有规定的，从其规定。

      如预案发生重大调整，需及时按照新的预案开展演练。

      '
  - id: LX-C072
    section: '11'
    title: 附则
    char_count: 0
    text: ''
    note: 章标题，无正文
  - id: LX-C073
    section: '11.1'
    title: 奖惩
    char_count: 74
    text: '根据有关法律法规，对在抗震救灾工作中作出突出贡献的单位和个人给予表彰和奖励；对工作不力或玩忽职守等造成严重后果或影响的单位和个人，依法依规追究责任。

      '
  - id: LX-C074
    section: '11.2'
    title: 监督检查
    char_count: 96
    text: '按照州抗震救灾指挥部的统一部署，由指挥部办公室会同有关成员单位，对本预案实施情况进行监督检查，指导各县（市）各有关部门以及重点企事业单位完善地震灾害防范应对措施，切实做好地震灾害应急准备工作。

      '
  - id: LX-C075
    section: '11.3'
    title: 名词术语释义
    char_count: 20
    ontology_refs:
    - RULE-LX-INCLUSIVE
    tags:
    - 术语
    - 数量约定
    - 关键
    text: '本预案所称以上包括本数，以下不包括本数。

      '
  - id: LX-C076
    section: '11.4'
    title: 预案解释
    char_count: 20
    text: '本预案由州抗震救灾指挥部办公室负责解释。

      '
  - id: LX-C077
    section: '11.5'
    title: 预案实施时间
    char_count: 66
    ontology_refs:
    - PLAN-LX-EFFECT
    tags:
    - 实施时间
    - 废止
    text: '本预案自印发之日起实施，临夏回族自治州人民政府办公室关于印发《临夏州地震应急预案》的通知(临州办发〔2012〕392号) 同时废止。

      '
  - id: LX-C078
    section: '11.6'
    title: 附件
    char_count: 670
    ontology_refs:
    - ANNEX-LX-1
    tags:
    - 附件
    - 响应措施表
    - 关键
    - 冲突C-LX-02
    text: '附件 ：临夏州地震灾害应急响应措施。

      附件

      临夏州地震灾害应急响应措施

      [表] 响应级别 | 启动 机构 | 指挥和协调 | 主要响应措施

      [表] 地震Ⅰ级应急响应 | 州委 州政府决定 启动 | 在在省委省政府领导下，接受省抗震救灾指挥部统一指挥，州委、州政府全面动员和组织开展抗震救灾先期处置工作。     | （1）灾情报告；（2）启动应急指挥机构；（3）收集灾情；（4）综合研判；（5）派遣救援队伍；（6）实施交通管制；（7）开展医疗救治；（8）开展灾情损失评估；（9）加强监测和震情研判；（10）灾害风险排查；（11）抢修生命线工程；（12）安置受灾群众；（13）加强新闻报道；（14）涉外事务管理；（15）生产生活恢复；（16）加强应急值守。

      [表] 地震Ⅱ级应急响应 | 州政府决定 启动 |  |

      [表] 地震Ⅲ级应急响应 | 州抗震救灾指挥部决定启动 | 在省抗震救灾指挥部的指导下，州委、州政府统一领导指挥和协调，州抗震救灾指挥部组织开展抗震救灾工作 | （1）收集上报灾情信息；（2）组织开展人员搜救；（3）医疗救护；（4）群众安置；（5）基础设施抢修；（6）实施交通管制；（7）开展灾情损失评估；（8）加强监测和震情研判；（9）灾害风险排查；（10）抢修生命线工程；（11）加强新闻报道；（12）生产生活恢复；（13）加强应急值守。

      [表] 地震Ⅳ级应急响应 | 州抗震救灾指挥部办公室决定启动 | 在省抗震救灾指挥部办公室的指导下，州抗震救灾指挥部派出工作组，协助灾区所在县（市）党委、政府组织开展抗震救灾工作 |

