rule_semantics:
  inclusive_note: 本预案所称"以上"包括本数，"以下"不包括本数（§11.3）
  combinator_default: OR（死亡人数判据与震级判据任一满足即命中）
  tie_break: 命中多级时取 rank 最小者（最高级别）
rules:
- id: RULE-LX-GRADE
  rule_class: 灾害分级
  inputs:
  - death_missing
  - magnitude
  - in_criterion_area
  - is_key_area
  expression: 'IF death_missing >= 300 OR (is_key_area AND magnitude >= 7.0) THEN 特别重大（Ⅰ级）

    ELSE IF death_missing >= 50 OR (in_criterion_area AND 6.0 <= magnitude < 7.0) THEN 重大（Ⅱ级）

    ELSE IF death_missing >= 10 OR (in_criterion_area AND 5.0 <= magnitude < 6.0) THEN 较大（Ⅲ级）

    ELSE IF death_missing < 10 OR (in_criterion_area AND 4.5 <= magnitude < 5.0) THEN 一般（Ⅳ级）

    '
  note: in_criterion_area = 临夏市 OR 震中50km范围内人口密度≥200人/km²的地区；积石山县成立（DEC-LX-03）
  evidence:
  - §3.1
- id: RULE-LX-TIER
  rule_class: 分级应对
  inputs:
  - grade
  - is_cross_boundary
  - exceeds_local_capacity
  expression: 'responsible = MAP(grade, {特别重大: 省抗震救灾指挥部, 重大: 省抗震救灾指挥部, 较大: 州党委政府, 一般: 县党委政府})

    IF is_cross_boundary THEN 上一级党委政府统筹协调，受灾地区党委政府负责本行政区域

    IF exceeds_local_capacity THEN 报请上一级政府提供支援或者负责应对

    '
  evidence:
  - §3.2.1
- id: RULE-LX-ACTIVATION
  rule_class: 响应启动
  inputs:
  - grade
  expression: 'Ⅰ级: 州抗震救灾指挥部提出建议 → 报州委州政府 → 州委、州政府决定启动 → 第一时间报省委省政府

    Ⅱ级: 州抗震救灾指挥部提出建议 → 报州委州政府 → 州政府决定启动 → 第一时间报省委省政府

    Ⅲ级: 州抗震救灾指挥部办公室提出建议 → 报州委州政府 → 州政府决定启动 → 第一时间报省委省政府

    Ⅳ级: 州抗震救灾指挥部办公室了解震情灾情 → 报指挥部并通报成员单位 → 办公室视情决定启动

    '
  conflict: Ⅲ级与附件表不一致，已按 DEC-LX-01 取正文
  evidence:
  - §5.1
  - §5.2
  - §5.3
  - §5.4
- id: RULE-LX-QUICKREPORT
  rule_class: 速报阈值
  inputs:
  - magnitude
  - is_urban
  expression: 'IF (is_urban AND magnitude >= 3.5) OR (NOT is_urban AND magnitude >= 4.0)

    THEN 州地震局快速完成速报参数（时间/地点/震级/震源深度），报州委州政府并通报成员单位

    '
  deadline: 原文无量化时限，见 DEC-LX-06 补桥
  evidence:
  - §4.2
- id: RULE-LX-TERMINATION
  rule_class: 响应终止
  inputs:
  - 应急工作基本结束
  - 转移安置基本完成
  - 次生灾害影响基本消除
  - 生命线基本抢通
  - 生活秩序基本恢复
  expression: ALL(inputs) == true → 由应急响应启动机构决定终止，转入灾后恢复重建阶段
  evidence:
  - §6
- id: RULE-LX-MODIFIER
  rule_class: 响应启动
  inputs:
  - is_minority_area
  - 灾情发展
  expression: 'IF is_minority_area THEN 可根据需要适当提高应急响应级别

    IF 灾情发展变化 THEN 及时调整级别，避免响应不足或响应过度

    '
  standing_note: 临夏州为回族自治州、积石山为民族自治县，该条款在辖域内属常态覆盖（DEC-LX-04）
  evidence:
  - §3.2.2
earthquake_event_layer:
  ingestion:
    id: EQ-LX-INGEST
    authoritative_sources:
      震情要素:
      - 中国地震台网
      - 甘肃省地震局
      - 州地震局速报
      烈度:
      - 省地震局/中国地震局烈度调查成果
      - WG-LX-03 烈度评定
      伤亡与损失:
      - 州应急局灾情上报系统
      - 各成员单位行业摸排
      - WG-LX-03 损失评估
    hard_rule: 震级、震源深度、烈度一律引用官方发布，不得由模型估算或引用未证实来源
  initial_judgement:
    id: EQ-LX-INITJUDGE
    principle: 震后伤亡统计滞后于震级发布，故初判优先走震级判据，伤亡判据用于后续修正
    sequence:
    - step: 1
      action: 取震级与震中位置，判定是否落入判据区域（临夏市 或 震中50km内人口密度≥200人/km²）
    - step: 2
      action: 按 RULE-LX-GRADE 的震级支路给出初判级别
    - step: 3
      action: 伤亡数据回传后按死亡人数支路复判，取更高级别
    - step: 4
      action: 按 MOD-LX-MINORITY 给出提级建议（双结论，不替指挥部拍板）
    - step: 5
      action: 按 RULE-LX-TIER 确定由哪一级党委政府负责应对（与响应级别是两个维度）
    jishishan_shortcut:
      condition: 震中位于积石山县
      rule: 该县人口密度 305.6 人/km²，满足判据区域条件
      table:
      - magnitude: '>=7.0（重要地区）'
        初判: 特别重大Ⅰ级
      - magnitude: 6.0 ~ 7.0
        初判: 重大Ⅱ级
      - magnitude: 5.0 ~ 6.0
        初判: 较大Ⅲ级
      - magnitude: 4.5 ~ 5.0
        初判: 一般Ⅳ级
      - magnitude: <4.5
        初判: 不构成地震灾害分级；若在重要设施场地附近且有明显震感，按 EVT-LX-FELT 强有感地震事件处置
      caveat: 依赖 DEC-LX-03 与 C-LX-11（密度计算口径），须县地震局确认
  aftershock_and_chain:
    id: EQ-LX-CHAIN
    state_plan_coverage:
    - item: 余震防范
      basis: §2.1.1(8) 密切监视震情发展，做好余震防范
    - item: 余震分布通报
      basis: §5.1(9) 及时通报震区余震分布情况
    - item: 强余震与降雨次生灾害
      basis: §5.1(10) 防范因强余震和降雨形成的滑坡、泥石流、坍塌等次生灾害造成新的人员伤亡和交通堵塞
    residual_gap:
    - 无量化的余震震级触发条件（多大余震须重新排查、须撤离作业面）
    - 无现场作业人员在余震条件下的撤离标准（承接县本体 G-13）
    external_calibration:
      source: 2023-12-18 积石山 Ms6.2 级地震震后同震地质灾害排查成果（中国地质环境监测院等，《中国地质灾害与防治学报》2024,35(3):108-118）
      usable: 烈度—隐患点密度系数 Ⅷ度0.1329、Ⅶ度0.0694、Ⅵ度0.0023 处/km²，用于震后次生地质灾害规模先验估算
      note: 属实测标定数据，非预案条款；现场排查数据回传后即行替换
  secondary_hazard_handling:
    id: EQ-LX-SECONDARY
    principle: 次生灾害为地震灾害的组成部分，在既定地震应急响应级别下处置，不另行启动独立响应级别
    owner: WG-LX-08 地震监测和次生灾害防范处置组
    lead_units:
    - 州地震局
    - 州自然资源局
    - 州水务局
    basis:
    - §2.1.1(8) 组职责
    - §5.1(9) 加强监测和震情研判
    - §5.1(10) 灾害风险排查
    scope:
    - 山体崩塌
    - 滑坡
    - 泥石流
    - 堰塞湖
    - 溃坝
    - 地面塌陷
    duties:
    - 密切监视震情发展，做好余震防范
    - 对重大地质灾害和洪水灾害隐患进行监测预警，发生险情时及时组织疏散群众
    - 防范因强余震和降雨形成的滑坡、泥石流、坍塌等次生灾害造成新的人员伤亡和交通堵塞
    - 组织专家对水库、堤坝、闸站开展险情排查、评估和除险加固，必要时进行人员转移
    - 对灾区集中安置点和应急避难场所开展次生灾害隐患排查
    - 对易发次生灾害的重大危险源、重要目标、重大关键基础设施采取紧急处置措施并加强监控
    rules:
    - id: SH-1
      rule: 次生灾害不单独定级，全域只有一个地震灾害等级、一个响应级别、一套指挥链（DEC-LX-11）
    - id: SH-2
      rule: 次生灾害伤亡与损失完成归因后作为分项报送，与建筑物倒塌等直接震害可加总不可叠算
    - id: SH-3
      rule: 堰塞湖与溃坝险情由本组中的州水务局归口，不按一般地质灾害处置
    - id: SH-4
      rule: 集中安置点与应急避难场所启用前须完成次生灾害隐患排查（§5.1(10) 明文要求）
    - id: SH-5
      rule: 次生地质灾害损失评估由 WG-LX-03 牵头汇总，属地单位提供分项数据
    assumption_upgrades:
    - id: ASSUME-EQ-4
      was: 模型假设——安置点选址须先做地质灾害危险性评估
      now: 上位预案明文
      basis: §5.1(10) 灾害风险排查——"对灾区集中安置点和应急避难场所开展次生灾害隐患排查"
      status: 已升级为 RULE，不再需要指挥部确认
    - id: ASSUME-EQ-3
      was: 模型假设——不待定级即启动全量隐患点复核
      now: 上位预案部分支持
      basis: §5.1(10) 明文要求震后对重大危险源、重要目标、重要基础设施隐患排查与监测预警，并防范强余震和降雨形成的次生灾害
      residual_gap: 州预案同样未规定震后地质灾害排查的启动时限与完成时限（承接县本体 G-12）
decisions:
- id: DEC-LX-01
  resolves: C-LX-02
  decided_by: MODEL
  topic: Ⅲ级响应启动权限（正文与附件表冲突）
  conflict: 正文 §5.3 为"州抗震救灾指挥部办公室提出建议、州政府决定启动"；附件表为"州抗震救灾指挥部决定启动"
  ruling: 以正文 §5.3 为准
  rationale: '正文表述完整（含建议主体、报告路径、决定主体），附件表为摘要且同表另有两行整列空白， 属编制疏漏而非有意规定；且Ⅲ级与Ⅱ级同为"州政府决定"符合分级递进逻辑， 若取附件表则Ⅲ级由指挥部自决、Ⅱ级由州政府决定、Ⅳ级由办公室自决，权限阶梯反而断裂。

    '
  requires_confirmation: 州抗震救灾指挥部办公室
- id: DEC-LX-02
  resolves: C-LX-01
  decided_by: MODEL
  topic: 与《国家地震应急预案》2025年修订版的分级阈值冲突
  conflict_table:
  - 级别: 特别重大
    本州预案: 死亡300人以上
    国家2025修订: 死亡200人以上
  - 级别: 重大
    本州预案: 死亡50~300人
    国家2025修订: 死亡30~200人
  - 级别: 较大
    本州预案: 死亡10~50人
    国家2025修订: 死亡10~30人
  - 级别: 一般
    本州预案: 死亡10人以下
    国家2025修订: 死亡10人以下
  analysis: 本州预案阈值与2012版国家预案一致，未同步2025年修订，属预案现势性问题
  ruling: '本地执行以本州预案为准（属地预案在其未修订前仍然有效）； 但报告中须并列标注国标口径，并在终报的预案复盘章节触发 §10.1 修订建议。

    '
  rationale: 执行依据须唯一且可追责，不能因上位修订而自行套用未落地的新阈值；但隐瞒差异会使上报省级时口径不一致
  requires_confirmation: 州抗震救灾指挥部办公室 + 州地震局
  urgency: 高——应急管理部2025-10-31明确要求"加快新一轮各地各级地震应急预案修订"
- id: DEC-LX-03
  decided_by: MODEL
  topic: 积石山县是否落入震级判据区域
  computation: 278089 人 / 909.97 km² = 305.6 人/km² > 200 人/km²
  ruling: 成立——积石山县满足"人口密度达到200人/平方公里"的判据条件
  implication: 该县发生 6.0 级以上地震，可不待伤亡统计直接初判为重大地震灾害（Ⅱ级）并启动相应程序
  dependency: 依赖县本体 DEC-01（总人口 278089 人的单位修正）
  caveat: 原文未明确密度按50km圆域平均还是按行政区计算（C-LX-11）；本裁决按行政区计算
  requires_confirmation: 州地震局 + 县地震局
- id: DEC-LX-04
  decided_by: MODEL
  topic: 少数民族地区提级条款的常态适用
  finding: 临夏回族自治州全域、积石山保安族东乡族撒拉族自治县全域均为少数民族聚居地区，§3.2.2 提级条款属常态覆盖而非例外
  ruling: 报告一律并列输出"推导级别"与"提级建议级别"及理由，由有权机关裁量，模型不替其拍板
  consistency: 与县本体 DEC-EQ-5 口径一致，两级预案采同一处理方式
  requires_confirmation: 州抗震救灾指挥部
- id: DEC-LX-05
  resolves: C-LX-09
  decided_by: MODEL
  topic: Ⅰ级响应措施第（2）项正文与附件表不一致
  conflict: 正文 §5.1(2) 为"靠前指挥"；附件表第（2）项为"启动应急指挥机构"
  ruling: 取并集——第（2）项同时包含"启动应急指挥机构"与"靠前组织指挥和协调"
  rationale: 两者均为Ⅰ级响应的必要动作，且互不排斥；漏掉任一都会造成执行缺项
- id: DEC-LX-06
  resolves: C-LX-06
  decided_by: MODEL
  topic: 震情速报无量化时限
  finding: §4.2 仅表述"快速完成"，而下位的县地质灾害预案反而有 30/60 分钟明确时限
  ruling: '补桥——Ⅰ/Ⅱ级初判情形按 30 分钟内完成速报，Ⅲ/Ⅳ级按 1 小时内， 与县地质灾害预案 §4.1 的时限体系对齐。

    '
  status: 属模型补桥，非原文条款；报告中须标注"依县级预案时限体系类推"
  requires_confirmation: 州地震局
- id: DEC-LX-07
  decided_by: MODEL
  topic: 次生灾害的归口与定级
  ruling: 见 earthquake_event_layer.secondary_hazard_handling 的 SH-1 至 SH-5
  summary: 次生灾害由 WG-LX-08 统一归口，不单独定级；堰塞湖溃坝归州水务局；损失评估由 WG-LX-03 牵头汇总避免重复计数
  requires_confirmation: 州抗震救灾指挥部办公室
- id: DEC-LX-08
  resolves: C-LX-08
  decided_by: MODEL
  topic: 分级应对与响应分级两个维度的混淆风险
  ruling: '报告必须分别输出两个结论——「由哪一级党委政府负责应对」（§3.2.1）与 「启动哪一级响应」（§5），二者不同源、不可互推。 例：较大地震灾害由州党委政府负责应对，同时启动州级Ⅲ级响应；
    重大地震灾害由省抗震救灾指挥部指挥协调，州级仍启动州级Ⅱ级响应作为配合。

    '
  gate: 并入报告生成的 GATE-LX-3
- id: DEC-LX-09
  resolves: C-LX-10
  decided_by: MODEL
  topic: 指挥部成员单位名单不含军地力量
  finding: 临夏军分区、武警临夏支队、州消防救援支队出现在副总指挥名单和多个工作组，但不在成员单位列举中
  ruling: 视为成员单位，在图谱中补入；属编制列举疏漏
  requires_confirmation: 州抗震救灾指挥部办公室
- id: DEC-LX-11
  decided_by: USER
  topic: 应急处置依据的单一性
  ruling: 地震应急处置一律以本预案为唯一依据，次生地质灾害一并按本预案 §2.1.1(8) 与 §5.1(10) 执行，不并用其他专项预案
  rationale: 执行依据唯一才能保证全域一个灾害等级、一个响应级别、一套指挥链，避免同一场地震出现两套口径
  downstream_impact: 取消次生地质灾害的独立定级与跨预案归口规则；相关内容改由本预案条款支撑
- id: DEC-LX-12
  decided_by: MODEL
  topic: 信息报告时限
  ruling: 本预案 §4.2 震情速报表述"快速完成"、§4.3 灾情报告表述"及时报上一级政府"，均未规定量化时限；由指挥部按灾害等级自定并纳入工作要求
  reference_value: 重大及以上：速报30分钟、书面2小时；较大及以下：速报1小时
  status: 属指挥部工作要求而非预案原文条款，上级另有规定从其规定
  requires_confirmation: 州地震局
quality:
  conflicts:
  - id: C-LX-01
    severity: 高
    type: 与上位预案阈值脱节
    location: §3.1 vs 《国家地震应急预案》2025年修订版
    finding: 本州预案沿用2012版国家预案阈值（300/50/10），与2025修订版（200/30/10）不一致
    impact: 同一伤亡规模在州、国两级口径下差一级；上报省级与国家时可能出现级别表述矛盾
    ruling_ref: DEC-LX-02
    verification_needed: 需核实2025年修订版正式文本的分级条款，本条依据为应急管理部2025-10-31解读稿
  - id: C-LX-02
    severity: 高
    type: 正文与附件冲突
    location: §5.3 vs §11.6附件表
    finding: Ⅲ级响应启动主体，正文为州政府决定，附件表为州抗震救灾指挥部决定
    impact: 实战中启动权限归属不清，可能延误或越权
    ruling_ref: DEC-LX-01
  - id: C-LX-03
    severity: 中
    type: 附件表不完整
    location: §11.6附件表
    finding: Ⅱ级响应行的"指挥和协调""主要响应措施"两列空白；Ⅳ级响应行的"主要响应措施"列空白
    impact: 附件表本应是实战速查工具，两级空白使其在Ⅱ、Ⅳ级情形下不可用
  - id: C-LX-05
    severity: 低
    type: 表述语病
    location: §1.3
    finding: 原文"本预案适用于本省州境内或毗邻市（州)发生地震灾害的应对工作"，"本省州境内"表述不清，疑为"本州境内"
    impact: 适用范围的地域边界存在歧义
  - id: C-LX-06
    severity: 中
    type: 时限缺失
    location: §4.2
    finding: 震情速报仅表述"快速完成"，无量化时限；而下位县地质灾害预案有30/60分钟明确时限
    impact: 上位预案时限反而弱于下位预案，无法据以考核
    ruling_ref: DEC-LX-06
  - id: C-LX-07
    severity: 低
    type: 灾种清单的完备性
    location: §2.1.1(8)
    finding: 本预案次生灾害清单含山体崩塌、滑坡、泥石流、堰塞湖、溃坝、地面塌陷、火灾、危化品泄漏、洪水、环境污染，覆盖完整
    impact: 无。堰塞湖与溃坝已明确由州水务局归口（SH-3），不存在处置真空
    ruling_ref: DEC-LX-07
  - id: C-LX-08
    severity: 中
    type: 维度混淆风险
    location: §3.2.1 vs §5
    finding: 分级应对（谁负责）与响应分级（启动哪一级）是两个独立维度，原文相邻编排易被合并理解
    impact: 可能误认为"重大地震灾害由省负责，州就不启动响应"，实则州级仍启动Ⅱ级响应
    ruling_ref: DEC-LX-08
  - id: C-LX-09
    severity: 低
    type: 正文与附件措施项不一致
    location: §5.1(2) vs §11.6附件表第（2）项
    finding: 正文为"靠前指挥"，附件表为"启动应急指挥机构"
    ruling_ref: DEC-LX-05
  - id: C-LX-10
    severity: 低
    type: 成员单位名单不闭合
    location: §2.1.1
    finding: 临夏军分区、武警临夏支队、州消防救援支队在副总指挥与工作组中出现，却不在成员单位列举内
    ruling_ref: DEC-LX-09
  - id: C-LX-11
    severity: 中
    type: 判据计算口径不明
    location: §3.1
    finding: '"震中50公里范围内人口密度达到200人/平方公里的地区"——未明确按50km圆域平均密度还是按行政区密度计算'
    impact: 直接决定积石山县是否落入震级判据区域，进而决定6.0级地震能否直接初判Ⅱ级
    ruling_ref: DEC-LX-03（按行政区计算）
    priority: 该口径必须由州地震局明确，是本预案在积石山适用性的关键开关
  gaps:
  - id: G-LX-01
    topic: 文号与印发日期缺失
    finding: 正文仅有"自印发之日起实施"，无发文字号与印发日期；仅知废止 临州办发〔2012〕392号
    impact: 无法确认现行版本、无法判断是否已按2025年国家预案修订
    action: 向州抗震救灾指挥部办公室索取印发通知原件
  - id: G-LX-02
    topic: 附件表不完整
    finding: 见 C-LX-03
    action: 索取完整版附件表
  - id: G-LX-03
    topic: 底数与联络信息缺失
    finding: 无成员单位联络表、无指挥部组织架构图、无救援队伍与物资装备底数、无应急避难场所清单
    impact: 资源推演与队伍调派推演均无法量化，只能列需求项
    action: 与 G-LX-01 同渠道一并索取
  - id: G-LX-04
    topic: 震情速报无时限
    finding: 见 C-LX-06
  - id: G-LX-05
    topic: 无烈度判据
    finding: 分级只有死亡人数与震级两类判据，无烈度判据；而烈度是震后最早可得的致灾强度指标之一
    impact: 烈度调查成果无法直接进入定级链路，只能作为辅助描述
  - id: G-LX-06
    topic: 《积石山县地震应急预案》仍未获取
    finding: §10.1 证实其应当存在并已报州抗震救灾指挥部办公室备案
    status: 已裁决关闭（DEC-LX-10 参照本预案对应设置；DEC-LX-11 依据单一化）
    decision:
      id: DEC-LX-10
      decided_by: USER
      ruling: 县级组织指挥体系参照《临夏州地震应急预案》对应设置即可，不以获取该县级预案为前提
      implementation: 县指挥部工作组按州级十一个工作组一一对应设置，牵头单位落至县级对应部门
      residual_note: 若该县级预案后续下达且与本设置不一致，以该预案为准；此为常规预案衔接，非缺口
    action: 无需索取；如自然获得可用于校验本设置
    impact: 已消除——组织指挥体系可直接依州预案对应生成
  - id: G-LX-07
    topic: 余震量化触发条件缺失
    finding: 有"做好余震防范""通报余震分布"的定性要求，无量化触发（多大余震须重新排查、须撤离现场作业面）
    impact: 承接县本体 G-13，两级预案均未覆盖余震期现场作业安全
  - id: G-LX-08
    topic: 恢复重建条款过简
    finding: §7 仅两条，无恢复重建的资金机制、评估办法、进度监督与验收标准
    impact: 终报的恢复重建交接章节只能写原则，写不出可执行安排
  - id: G-LX-09
    topic: 无演练与培训的量化考核
    finding: §10.2 仅要求"上年度发生较大以上地震灾害的地区本年度至少1次演练"，其余地区无频次要求
    impact: 未发生灾害的年份无演练强制，能力保持无抓手
inference_spec:
  input_contract:
    seismic_facts:
      required:
      - origin_time
      - magnitude
      - epicenter_place
      - source_authority
      optional:
      - depth_km
      - max_intensity
      - epicenter_lat
      - epicenter_lon
      - aftershock_status
      fields:
        origin_time:
          type: datetime
          note: 发震时刻，作为所有时限的 T0
        magnitude:
          type: number
          note: 震级；初判主判据
        depth_km:
          type: number
        epicenter_place:
          type: string
          note: 须能定位到县（市）与乡镇
        max_intensity:
          type: enum
          values:
          - Ⅴ
          - Ⅵ
          - Ⅶ
          - Ⅷ
          - Ⅸ
          - Ⅹ
          - Ⅺ
          note: 不参与定级（G-LX-05），仅用于灾害规模研判与次生灾害估算
        aftershock_status:
          type: string
        source_authority:
          type: string
          constraint: 中国地震台网 / 甘肃省地震局 / 州地震局速报，三者之一
    area_facts:
      in_criterion_area:
        type: boolean
        note: 是否为"临夏市 或 震中50公里范围内人口密度达到200人/平方公里的地区"
        preset:
          积石山县:
            value: true
            basis: 人口密度 305.6 人/km² > 200，见 DEC-LX-03
            caveat: 口径待州地震局确认（C-LX-11）
          临夏市:
            value: true
            basis: 原文直接列举
          其他县市:
            value: null
            note: 需按各县人口密度逐一核算后填入
      is_key_area:
        type: boolean
        note: 是否"重要地区"（关联Ⅰ级7.0级判据）；原文未定义重要地区范围，属判断项
      is_urban:
        type: boolean
        note: 是否州内城市，决定速报阈值取3.5级还是4.0级
      is_minority_area:
        type: boolean
        default: true
        note: 临夏州全域为民族自治地方，见 DEC-LX-04
      is_cross_boundary:
        type: boolean
        note: 是否跨行政区域，触发上一级统筹
      affected_counties:
        type: array
    casualty_facts:
      note: 震后滞后可得；初判走震级支路，本组回传后复判
      death_missing:
        type: number
        unit: 人
        note: 死亡含失踪，定级主判据
      injured:
        type: number
        unit: 人
        note: 不参与定级
      collapsed_houses:
        type: number
        unit: 间
      special_persons:
        type: object
        note: 港澳台或外籍人员伤亡失踪被困情况，触发 §4.3 特别报告路径
    capacity_facts:
      exceeds_local_capacity:
        type: boolean
        note: 触发 §3.2.1 报请上级支援或负责应对
      situation_sensitive:
        type: boolean
        note: 震情敏感复杂或发生在重要时段，Ⅲ级升Ⅱ级的触发条件之一
    secondary_hazard_facts:
      handled_by: WG-LX-08，在本预案框架内处置
      fields:
        新增或加剧地质灾害隐患点: 处
        受威胁需转移人口: 人
        堰塞湖或溃坝险情: 有/无
        安置点隐患排查结论: 通过/不通过
      note: 次生灾害数据单独列项，完成归因后作为分项报送，不单独定级
    fallback_policy:
    - missing: 伤亡数据
      action: 仅走震级支路初判，报告标注"初判，伤亡待核，回传后复判"
    - missing: 震级
      action: 阻断——震级是初判唯一可用主判据，不得估算
    - missing: in_criterion_area 判定
      action: 保守取 true（安全侧，级别不低估），并标注待核
    - conflict: 多源震级不一致
      action: 取官方最新修订值，并在报告中列出修订过程
  grading_engine:
    step_1_initial_grade:
      rule_ref: RULE-LX-GRADE
      branch: 震级支路（震后最先可得）
      logic: 'IF is_key_area AND magnitude >= 7.0            THEN 特别重大（Ⅰ级）

        ELSE IF in_criterion_area AND 6.0 <= M < 7.0   THEN 重大（Ⅱ级）

        ELSE IF in_criterion_area AND 5.0 <= M < 6.0   THEN 较大（Ⅲ级）

        ELSE IF in_criterion_area AND 4.5 <= M < 5.0   THEN 一般（Ⅳ级）

        ELSE 不构成地震灾害分级；若在州政府所在地或大中型水库等重要设施场地附近且有明显震感，转 EVT-LX-FELT 强有感地震事件处置

        '
      evidence: §3.1
    step_2_casualty_regrade:
      branch: 死亡人数支路（伤亡回传后）
      logic: 'IF death_missing >= 300 THEN 特别重大

        ELSE IF death_missing >= 50 THEN 重大

        ELSE IF death_missing >= 10 THEN 较大

        ELSE 一般

        '
      combine: final_grade = 取 震级支路 与 死亡支路 中更高者
      evidence: §3.1
      inclusive_note: 以上包括本数，以下不包括本数（§11.3）
    step_3_two_dimensions:
      critical: true
      ruling_ref: DEC-LX-08
      dimension_a:
        name: 分级应对——谁负责
        rule_ref: RULE-LX-TIER
        mapping:
          特别重大: 省抗震救灾指挥部指挥协调
          重大: 省抗震救灾指挥部指挥协调
          较大: 州党委政府负责应对
          一般: 县党委政府负责应对
        overrides:
        - condition: is_cross_boundary
          effect: 上一级党委政府统筹协调，受灾地区党委政府负责本行政区域
        - condition: exceeds_local_capacity
          effect: 报请上一级政府提供支援或者负责应对
        evidence: §3.2.1
      dimension_b:
        name: 响应分级——启动哪一级
        mapping:
          特别重大: RL-LX-1
          重大: RL-LX-2
          较大: RL-LX-3
          一般: RL-LX-4
        evidence:
        - §3.2.2
        - §5
      hard_rule: '两个维度不同源、不可互推，必须分别输出。 例：重大地震灾害由省抗震救灾指挥部指挥协调，州级同时启动州级Ⅱ级响应作为配合—— "省负责"不等于"州不启动"。

        '
    step_4_modifiers:
    - id: MOD-LX-MINORITY
      condition: is_minority_area == true
      effect: 建议提高一级
      standing_note: 临夏州全域为回族自治州、积石山为民族自治县，本条属常态覆盖
      output_rule: 并列输出「推导级别」与「提级建议级别」及理由，由有权机关裁量，模型不拍板（DEC-LX-04）
      evidence: §3.2.2
    - id: MOD-LX-ADJUST
      condition: 灾情发展变化
      effect: 及时上调或下调，避免响应不足或响应过度
      evidence: §3.2.2
    - id: MOD-LX-ESCALATE-3TO2
      condition: 已启动Ⅲ级 AND (exceeds_local_capacity OR situation_sensitive OR 发生在重要时段)
      effect: 州委、州政府向省抗震救灾指挥部报告，按程序报请启动地震Ⅱ级应急响应
      evidence: §5.3
  playbooks:
    权限口径: 一律取正文 §5.1–§5.4；Ⅲ级与附件表冲突处按 DEC-LX-01 取正文
    levels:
    - level: RL-LX-1
      roman: Ⅰ
      grade: 特别重大地震灾害
      activation:
        proposer: 州抗震救灾指挥部（提出启动建议，立即向州委、州政府报告）
        decider: 州委、州政府
        upward: 第一时间向省委、省政府报告
      command:
        context: 在省抗震救灾指挥部的指导和州委、州政府的领导下
        organizer: 州抗震救灾指挥部
        commander: 州政府分管副州长（州抗震救灾指挥部总指挥）
        onsite: 立即成立州抗震救灾现场指挥部；指挥长由总指挥或州委州政府指定专人担任
        responsible_tier: 省抗震救灾指挥部指挥和协调（§3.2.1）
      working_groups: 11个工作组全部激活
      actions: ACT-LX-01 至 ACT-LX-16 全量
      duty_watch:
        震后72小时内: 各有关成员单位安排1名县级干部和至少1名科级干部集中在州抗震救灾指挥部办公点值班值守
        震后4至7天内: 安排至少1名科级干部值班值守
      evidence:
      - §5.1
      - §2.1.2
      - §3.2.1
      - §11.6附件表
    - level: RL-LX-2
      roman: Ⅱ
      grade: 重大地震灾害
      activation:
        proposer: 州抗震救灾指挥部（提出启动建议，立即向州委、州政府报告）
        decider: 州政府
        upward: 第一时间向省委、省政府报告
      command:
        organizer: 州抗震救灾指挥部
        commander: 州政府分管副州长（州抗震救灾指挥部总指挥）
        onsite: 立即成立州抗震救灾现场指挥部（较大及以上均适用）
        responsible_tier: 省抗震救灾指挥部指挥和协调（§3.2.1）
      working_groups: 按应急处置工作需要激活
      actions: 参照地震Ⅰ级应急响应有关措施组织开展应急处置工作
      annex_gap: 附件表该级"指挥和协调""主要响应措施"两列空白，只能引正文（C-LX-03）
      evidence:
      - §5.2
      - §2.1.2
      - §3.2.1
    - level: RL-LX-3
      roman: Ⅲ
      grade: 较大地震灾害
      activation:
        proposer: 州抗震救灾指挥部办公室（提出启动建议，立即向州委、州政府报告）
        decider: 州政府
        upward: 第一时间向省委、省政府报告
        conflict_note: 附件表载"州抗震救灾指挥部决定启动"，已按 DEC-LX-01 取正文
      command:
        context: 在省抗震救灾指挥部的指导下
        organizer: 州委、州政府组织协调全州的抗震救灾工作
        onsite: 州抗震救灾指挥部成立现场指挥部赴受灾地区，协助当地县（市）政府
        responsible_tier: 州党委、政府负责应对（§3.2.1）
      actions:
      - 收集上报灾情信息
      - 组织开展人员搜救
      - 医疗救护
      - 群众安置
      - 基础设施抢修
      - 实施交通管制
      - 开展灾情损失评估
      - 加强监测和震情研判
      - 灾害风险排查
      - 抢修生命线工程
      - 加强新闻报道
      - 生产生活恢复
      - 加强应急值守
      escalation: 灾情超出本州应对能力、震情敏感复杂或发生在重要时段时，州委州政府报省抗震救灾指挥部，按程序报请启动Ⅱ级响应
      evidence:
      - §5.3
      - §11.6附件表
      - §3.2.1
    - level: RL-LX-4
      roman: Ⅳ
      grade: 一般地震灾害
      activation:
        proposer: 州抗震救灾指挥部办公室（了解震情灾情后报告指挥部，并通报成员单位和有关部门）
        decider: 州抗震救灾指挥部办公室（视情决定启动）
      command:
        context: 在省抗震救灾指挥部办公室、州抗震救灾指挥部的指导下
        organizer: 受灾地区县（市）党委、政府
        responsible_tier: 县（市、区）党委、政府负责应对（§3.2.1）
        state_support: 州抗震救灾指挥部视情派出联合工作组指导，并根据需求给予救援队伍和应急物资支援
      county_actions:
      - 人员搜救
      - 医疗救护
      - 受灾群众安置
      - 次生灾害防范
      - 应急恢复
      annex_gap: 附件表该级"主要响应措施"列空白（C-LX-03）
      evidence:
      - §5.4
      - §11.6附件表
      - §3.2.1
    other_event_playbooks:
    - event: 强有感地震事件
      trigger: 州政府所在地或大中型水库等重要设施场地及附近 M<4.5 且有明显震感
      responsible: 事件发生地县（市）党委政府
      state_role: 州应急局视情派工作组、州地震局研判、州委宣传部舆论引导
      evidence: §8.1
    - event: 临震应急事件
      trigger: 省级以上人民政府发布短临地震预报
      responsible: 地震预报区县（市）政府统一指挥部署
      termination: 终止临震应急公告由省抗震救灾指挥部统一发布
      evidence: §8.2
    - event: 地震传言事件
      responsible: 事发地党委政府
      state_role: 州地震局研判定性并发布声明；州委宣传部/网信办/公安局指导平息；影响严重时州指挥部派联合工作组
      evidence: §8.3
    - event: 周边地区地震事件
      trigger: 地震发生在周边地区但对本州造成震灾损失或严重社会影响
      flow: 州地震局研判本州烈度与伤亡损失 → 州指挥部办公室提出启动建议 → 按程序决定启动 → 有关县市立即处置
      relevance: 积石山西接青海循化县，跨省界情景唯一依据
      evidence: §8.4
    - event: 支援周边地区
      trigger: 周边发生较大地震灾害并向本州提出支援请求
      responsible: 州抗震救灾指挥部按州委州政府要求组织实施
      evidence: §8.5
    cross_level_immediate:
      note: 不以响应启动为前提的动作
      items:
      - id: IMM-LX-1
        action: 震情速报——州内城市≥3.5级、农村≥4.0级即由州地震局完成速报参数并报州委州政府、通报成员单位
        evidence: §4.2
      - id: IMM-LX-2
        action: 事发地县级以上政府及时将震情灾情报上一级政府，必要时可越级上报
        evidence: §4.3
      - id: IMM-LX-3
        action: 发现港澳台或外籍人员伤亡失踪被困，迅速核实并报州政府办公室、州应急局、州地震局、州文旅局
        evidence: §4.3
      - id: IMM-LX-4
        action: 州地震局协助省上专家迅速开展地震灾害快速评估并提出应急处置决策建议
        evidence: §4.3
      - id: IMM-LX-5
        action: 次生灾害移交——按 EQ-LX-HANDOFF 的 HO-1..HO-4 启动县地质灾害支线
        evidence:
        - §2.1.1(8)
        - DEC-LX-07
  report_templates:
    phases:
    - id: LX-RPT-T1
      name: 首报
      deadline: 依 DEC-LX-06 补桥——Ⅰ/Ⅱ级初判 30 分钟内，Ⅲ/Ⅳ级 1 小时内（原文无量化时限，须标注为类推）
      audience: 州委、州政府；州抗震救灾指挥部成员单位；按级别上报省委省政府
      sections:
      - id: L1
        name: 震情要素
        source: input.seismic_facts
        must_cite_authority: true
      - id: L2
        name: 初判定级
        source: grading_engine.step_1
        must_show:
        - 判据类型（震级/伤亡）
        - 判据区域成立性
        - 初判级别
        - 条款依据
      - id: L3
        name: 双维度结论
        source: grading_engine.step_3
        must_show:
        - 谁负责应对
        - 启动哪一级响应
        hard_rule: 两项必须分列，不得合并
      - id: L4
        name: 响应启动建议
        source: playbooks
        must_show:
        - 建议级别
        - 提议主体
        - 决定主体
        - 总指挥
        - 上报路径
      - id: L5
        name: 提级双结论
        source: grading_engine.step_4
        must_show:
        - 推导级别
        - 提级建议级别
        - 提级理由
      - id: L6
        name: 已采取措施
        source: playbooks.cross_level_immediate
      - id: L7
        name: 次生灾害初步情况与移交
        source: EQ-LX-HANDOFF
        note: 引用县地质灾害支线的独立结论，不换算
      - id: L8
        name: 下一步与请求事项
    - id: LX-RPT-T2
      name: 续报
      cadence: 震后每日；灾情有重大变化时随时
      sections:
      - 定级复核（伤亡回传后按 step_2 复判，是否触发 MOD-LX-ADJUST 或 MOD-LX-ESCALATE-3TO2）
      - 搜救与医疗救治进展
      - 群众转移安置进展（含避难场所开放情况与次生灾害隐患排查结论）
      - 生命线工程抢修进展（交通、电力、通信、供水、供气、广播电视）
      - 震情研判与余震分布通报
      - 灾害风险排查进展（重大危险源、水库堤坝闸站、危化品与管线、安置点）
      - 灾情损失评估进展（烈度评定、房屋安全性鉴定、保险理赔指导）
      - 值班值守落实情况（对照 ACT-LX-16 的72小时/4-7天要求）
      - 涉外与涉港澳台事务（如有）
      - 次生灾害排查与处置进展（隐患点复核、安置点隐患排查、堰塞湖溃坝险情）
    - id: LX-RPT-T3
      name: 专题报告
      trigger: 按需
      types:
      - type: 周边地区地震影响评估
        basis: §8.4
        content: 本州境内烈度研判、伤亡损失评估、是否建议启动响应
      - type: 临震应急处置报告
        basis: §8.2
      - type: 地震传言处置报告
        basis: §8.3
      - type: 对外支援实施报告
        basis: §8.5
    - id: LX-RPT-T4
      name: 终报
      trigger: 满足 RULE-LX-TERMINATION 全部5项条件
      sections:
      - 终止条件逐项核验（应急工作基本结束/转移安置基本完成/次生灾害影响基本消除/生命线基本抢通/生活秩序基本恢复）
      - 终止决定主体与时间（须与启动机构一致）
      - 灾害损失评估最终结论（WG-LX-03）
      - 转入灾后恢复重建阶段的交接（§7：恢复重建规划编制主体、州级指导协调小组组建）
      - 预案执行复盘：本次暴露的冲突与缺口（对照 quality.conflicts / quality.gaps）
      - 修订建议：特别是 C-LX-01（与2025年国家预案阈值脱节）与 G-LX-02（附件表不完整）
      - 演练要求提示：§10.2——上年度发生较大以上地震灾害的地区，本年度至少组织1次应急演练
    cross_cutting_rules:
    - 每份报告须标注依据版本："依《临夏州地震应急预案》编制（文号与印发日期待补，G-LX-01）"
    - 地震灾害级别与次生地质灾害级别并列呈现，各标依据预案，严禁互相换算（DEC-15 / C-LX-04）
    - 分级应对与响应分级两项结论必须分列（DEC-LX-08）
    - 震级、震源深度、烈度一律引用官方发布，注明发布机构与发布时刻
    - 模型补桥内容（速报时限、判据区域口径）须显著标注为"类推/待确认"
  worked_examples:
  - id: LX-EX-A
    label: 积石山6.2级，伤亡未明（首报时刻）
    input:
      seismic:
        magnitude: 6.2
        epicenter_place: 积石山县
        depth_km: 10
      area:
        in_criterion_area: true
        is_minority_area: true
        is_key_area: false
      casualty:
        death_missing: null
    derivation:
      判据支路: 震级支路（伤亡未回传）
      判据区域: 成立——积石山县人口密度 305.6 人/km² > 200（DEC-LX-03）
      初判级别: 重大地震灾害（Ⅱ级）
      判据: 6.2 落入"6.0级以上、7.0级以下"（§3.1）
      分级应对: 省抗震救灾指挥部指挥和协调（§3.2.1）
      响应分级: 州级Ⅱ级应急响应
      提级建议: Ⅰ级（MOD-LX-MINORITY，民族自治地方）
    branch_output:
      提议主体: 州抗震救灾指挥部
      决定主体: 州政府
      上报: 第一时间向省委、省政府报告
      总指挥: 州政府分管副州长
      现场指挥部: 立即成立（较大及以上）
      措施: 参照Ⅰ级十六项措施
      速报时限: 30分钟内（DEC-LX-06 补桥，须标注为类推）
    teaching_point: 震级支路可在伤亡统计前完成定级，是震后黄金时间启动响应的关键。本预案的两条判据中，震级由官方即时发布，伤亡则依赖现场统计，故初判走震级、回传后复判。
  - id: LX-EX-B
    label: 积石山4.8级，轻微
    input:
      seismic:
        magnitude: 4.8
        epicenter_place: 积石山县
      area:
        in_criterion_area: true
        is_minority_area: true
      casualty:
        death_missing: 0
    derivation:
      初判级别: 一般地震灾害（Ⅳ级）
      判据: 4.8 落入"4.5级以上、5.0级以下"；死亡0人 < 10 人，两支路同为Ⅳ级
      分级应对: 县（市、区）党委、政府负责应对
      响应分级: 州级Ⅳ级应急响应
      提级建议: Ⅲ级（供裁量）
    branch_output:
      决定主体: 州抗震救灾指挥部办公室（视情决定启动，无需报州政府）
      主战场: 受灾县（市）党委、政府
      州级角色: 视情派出联合工作组，按需给予救援队伍和物资支援
      速报阈值: 农村地区≥4.0级已达速报线，州地震局须完成速报
    teaching_point: 与 LX-EX-A 相比，决定主体从州政府降到指挥部办公室，主战场从州降到县——级别不同则指挥链完全不同
  - id: LX-EX-C
    label: 伤亡支路反超震级支路
    input:
      seismic:
        magnitude: 5.2
        epicenter_place: 积石山县
      area:
        in_criterion_area: true
        is_minority_area: true
      casualty:
        death_missing: 62
    derivation:
      震级支路: 5.2 落入 5.0~6.0 → 较大（Ⅲ级）
      死亡支路: 62人 落入 50~300 → 重大（Xx Ⅱ级）
      合并规则: 取更高者
      final_grade: 重大地震灾害（Ⅱ级）
      级别跃迁: 首报时按震级初判为Ⅲ级，伤亡回传后须复判升为Ⅱ级
    branch_output:
      复判后决定主体: 由州政府决定启动Ⅱ级（原Ⅲ级亦为州政府决定，但提议主体从办公室变为指挥部）
      分级应对变化: 从"州党委政府负责应对"变为"省抗震救灾指挥部指挥和协调"
      续报要求: 必须在续报中显式记录级别跃迁的时刻、依据与决定主体变更
    teaching_point: '中等震级+高伤亡是最容易漏判的组合。震级支路给出的Ⅲ级会让指挥层误以为可由州级自行处置， 而伤亡一旦过50人，应对主责即上移至省级。复判机制不能省。

      '
  - id: LX-EX-D
    label: 跨省界——青海侧地震影响积石山
    input:
      seismic:
        magnitude: 6.0
        epicenter_place: 青海省循化县
      area:
        is_cross_boundary: true
        affected_counties:
        - 积石山县
    derivation:
      适用条款: §8.4 周边地区地震事件（震中不在本州）
      流程: 州地震局研判本州境内烈度与可能伤亡损失 → 州抗震救灾指挥部办公室依震级、灾情严重程度与研判结果提出启动建议 → 按程序决定启动
      分级应对: 涉及跨行政区域，由上一级党委政府统筹协调，受灾地区党委政府负责本行政区域（§3.2.1）
    teaching_point: '震中在外省时不走 §3.1 的常规定级链路，而走 §8.4。这是积石山的高频情景—— 该县西接青海循化县，2023年震例即为跨省界影响。§8.4 是本预案对此的唯一依据。

      '
  gates:
  - id: GATE-LX-1
    name: 依据版本声明
    check: 是否标注依据《临夏州地震应急预案》及文号待补（G-LX-01）
    fail_action: 阻断
  - id: GATE-LX-2
    name: 定级可回溯
    check: 震级支路与伤亡支路结论是否各自列出并标注条款
    fail_action: 阻断
  - id: GATE-LX-3
    name: 双维度分列
    check: 分级应对（谁负责）与响应分级（启动哪级）是否分别输出且未合并（DEC-LX-08）
    fail_action: 阻断
  - id: GATE-LX-4
    name: 权限一致
    check: 提议主体、决定主体、总指挥是否与正文 §5 一致；Ⅲ级是否按 DEC-LX-01 取正文而非附件表
    fail_action: 阻断
  - id: GATE-LX-5
    name: 提级双结论
    check: 是否并列输出推导级别与提级建议且未替有权机关拍板
    fail_action: 阻断
  - id: GATE-LX-6
    name: 跨预案不换算
    check: 地震灾害级别与次生地质灾害级别是否并列且各标依据，有无互相换算
    fail_action: 阻断
  - id: GATE-LX-7
    name: 补桥标注
    check: 速报时限、判据区域口径等模型补桥内容是否标注为类推/待确认
    fail_action: 阻断
  - id: GATE-LX-8
    name: 权威来源
    check: 震级、震源深度、烈度是否引用官方发布并注明机构与时刻
    fail_action: 阻断
  - id: GATE-LX-9
    name: 复判机制
    check: 首报按震级初判的，续报是否落实伤亡回传后的复判
    fail_action: 告警放行
  - id: GATE-LX-10
    name: 缺口披露
    check: 是否披露受哪些缺口限制（G-LX-01/02/03/06）
    fail_action: 告警放行
  readiness:
    can_produce_now:
    - 地震灾害初判定级（震级支路可在伤亡统计前完成，这是本预案的核心价值）
    - 分级应对与响应分级双维度结论
    - 四级响应的提议主体、决定主体、总指挥、上报路径
    - Ⅰ级十六项措施与Ⅲ级十三项措施清单
    - 五类其他地震事件的处置流程
    - 震情速报阈值判定（城市3.5级/农村4.0级）
    - 响应终止条件核验与终报框架
    - 次生地质灾害向县支线的移交规则（HO-1..HO-4）
    degraded_without_input:
    - blocked_by: G-LX-03
      affects: 队伍调派与物资调运的量化推演——只能列需求项
    - blocked_by: G-LX-02
      affects: Ⅱ级与Ⅳ级的措施清单——只能引正文，无附件表速查
    - blocked_by: C-LX-11
      affects: 积石山是否落入震级判据区域——按行政区密度取 true，若州地震局按圆域平均口径判定则Ⅱ级直判不成立
    - blocked_by: G-LX-05
      affects: 烈度无法进入定级链路，只能作辅助描述
    cannot_produce:
    - 无——G-LX-06 已按 DEC-LX-10 裁决关闭，县级指挥体系按州预案十一个工作组对应设置生成
    highest_value_next_input:
      rank_1: 地质灾害隐患点逐点清单（编号/坐标/乡镇/威胁户数/监测责任人）——解锁次生地质灾害逐点排查与乡镇任务分解
      rank_2: 本预案的印发通知原件（文号、日期）与完整附件表——解决 G-LX-01/G-LX-02
      rank_3: 州地震局对"震中50公里范围内人口密度"计算口径的书面明确——解决 C-LX-11，这是Ⅱ级直判成立与否的开关
      rank_4: 成员单位联络表、救援队伍与物资底数、避难场所清单——解决 G-LX-03
  meta:
    spec_key: linxia_earthquake_response_report
    version: 1
    ontology_ref: linxia_earthquake_emergency@1
    output_artifact: 震后应急报告（首报 / 续报 / 专题报告 / 终报）
    scope_statement: 本规格覆盖地震灾害的定级、响应启动与措施展开，次生灾害作为地震灾害的组成部分在同一响应级别下处置，不单独定级。
    authoritative_for:
    - 地震灾害分级（§3.1）
    - 分级应对——由哪一级党委政府负责（§3.2.1）
    - 州级响应级别、启动主体与决定主体（§5）
    - Ⅰ级十六项措施及各级措施裁剪（§5.1、附件表）
    - 震情速报与灾情报告路径（§4）
    - 响应终止条件（§6）
    not_authoritative_for:
    - 省级与国家级响应的启动
    - 县（市）本级指挥部的人事任命
