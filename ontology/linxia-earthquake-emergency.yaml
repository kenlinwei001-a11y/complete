  disaster_grades:
    evidence:
    - §3.1
    basis: 根据《国家地震应急预案》《甘肃省地震应急预案》相关规定，结合临夏州实际
    magnitude_criterion_scope:
      text: 临夏市以及震中50公里范围内人口密度达到200人/平方公里的地区
      applies_to_jishishan: true
      ref: facts.jishishan_adaptation.population_density
    grades:
    - id: SG-LX-1
      name: 特别重大地震灾害
      roman: Ⅰ
      rank: 1
      criteria:
        death_missing:
          op: '>='
          value: 300
        magnitude:
          op: '>='
          value: 7.0
          area_condition: 重要地区
      combinator: OR
    - id: SG-LX-2
      name: 重大地震灾害
      roman: Ⅱ
      rank: 2
      criteria:
        death_missing:
          min: 50
          max: 300
          min_inclusive: true
          max_inclusive: false
        magnitude:
          min: 6.0
          max: 7.0
          min_inclusive: true
          max_inclusive: false
          area_condition: 判据区域
      combinator: OR
    - id: SG-LX-3
      name: 较大地震灾害
      roman: Ⅲ
      rank: 3
      criteria:
        death_missing:
          min: 10
          max: 50
          min_inclusive: true
          max_inclusive: false
        magnitude:
          min: 5.0
          max: 6.0
          min_inclusive: true
          max_inclusive: false
          area_condition: 判据区域
      combinator: OR
    - id: SG-LX-4
      name: 一般地震灾害
      roman: Ⅳ
      rank: 4
      criteria:
        death_missing:
          op: <
          value: 10
        magnitude:
          min: 4.5
          max: 5.0
          min_inclusive: true
          max_inclusive: false
          area_condition: 判据区域
      combinator: OR
  tiered_responsibility:
    evidence:
    - §3.2.1
    note: 这是"谁负责应对"的维度，与"启动哪一级响应"是两件事，不可混用（C-LX-08）
    rows:
    - grade: 特别重大
      responsible: 省抗震救灾指挥部指挥和协调
      per: 省委、省政府的决策部署
    - grade: 重大
      responsible: 省抗震救灾指挥部指挥和协调
      per: 省委、省政府的决策部署
    - grade: 较大
      responsible: 市（州）党委、政府负责应对
    - grade: 一般
      responsible: 县（市、区）党委、政府负责应对
    cross_boundary: 涉及跨行政区域的地震灾害，由上一级党委、政府统筹协调，受灾地区党委、政府负责本行政区域抗震救灾工作
    capacity_overflow: 当地震灾害超出属地政府的应对能力时，报请上一级政府提供支援或者负责应对
  response_levels:
    evidence:
    - §3.2.2
    - §5.1
    - §5.2
    - §5.3
    - §5.4
    - §11.6附件表
    general_rule: 地震灾害发生后，县级以上政府及其有关部门和单位根据地震灾害初判级别、应急处置能力及预期影响后果，研判确定本级地震应急响应级别
    modifiers:
    - id: MOD-LX-MINORITY
      condition: 地震灾害发生在少数民族聚居地区和其他特殊地区
      effect: 可根据需要适当提高应急响应级别
      evidence: §3.2.2
    - id: MOD-LX-ADJUST
      condition: 灾情发展变化
      effect: 及时调整响应级别，避免响应不足或响应过度
      evidence: §3.2.2
    levels:
    - id: RL-LX-1
      roman: Ⅰ
      trigger_grade: SG-LX-1
      proposer: 州抗震救灾指挥部（提出启动建议，立即向州委、州政府报告）
      decider: 州委、州政府
      annex_decider: 州委、州政府决定启动
      consistent_with_annex: true
      upward_report: 第一时间向省委、省政府报告
      command_context: 在省抗震救灾指挥部的指导和州委、州政府的领导下，由州抗震救灾指挥部组织开展抗震救灾工作
      annex_command_context: 在省委省政府领导下，接受省抗震救灾指挥部统一指挥，州委、州政府全面动员和组织开展抗震救灾先期处置工作
      actions:
      - ACT-LX-01 至 ACT-LX-16 全量
    - id: RL-LX-2
      roman: Ⅱ
      trigger_grade: SG-LX-2
      proposer: 州抗震救灾指挥部（提出启动建议，立即向州委、州政府报告）
      decider: 州政府
      annex_decider: 州政府决定启动
      consistent_with_annex: true
      upward_report: 第一时间向省委、省政府报告
      actions: 参照地震Ⅰ级应急响应有关措施组织开展应急处置工作
      annex_gap: 附件表该行"指挥和协调""主要响应措施"两列为空白（C-LX-03）
    - id: RL-LX-3
      roman: Ⅲ
      trigger_grade: SG-LX-3
      proposer: 州抗震救灾指挥部办公室（提出启动建议，立即向州委、州政府报告）
      decider: 州政府
      annex_decider: 州抗震救灾指挥部决定启动
      consistent_with_annex: false
      conflict_ref: C-LX-02
      decision_ref: DEC-LX-01
      upward_report: 第一时间向省委、省政府报告
      command_context: 在省抗震救灾指挥部的指导下，州委、州政府组织协调全州的抗震救灾工作
      onsite: 州抗震救灾指挥部成立现场指挥部赴受灾地区，协助当地县（市）政府做好抗震救灾工作
      actions_annex:
      - 收集上报灾情信息
      - 组织开展人员搜救
      - 医疗救护
      - 群众安置
      - 基础设施抢修
      - 实施交通管制
      - 开展灾情损失评估
      - 加强监测和震情研判
      - 灾害风险排查
      - 抢修生命线工程
      - 加强新闻报道
      - 生产生活恢复
      - 加强应急值守
      escalation: 当灾情超出本州应对能力、震情敏感复杂或发生在重要时段的较大地震灾害事件，州委、州政府向省抗震救灾指挥部报告，按程序报请启动地震Ⅱ级应急响应
    - id: RL-LX-4
      roman: Ⅳ
      trigger_grade: SG-LX-4
      proposer: 州抗震救灾指挥部办公室（了解震情灾情后报告指挥部并通报成员单位）
      decider: 州抗震救灾指挥部办公室（视情决定启动）
      annex_decider: 州抗震救灾指挥部办公室决定启动
      consistent_with_annex: true
      command_context: 在省抗震救灾指挥部办公室、州抗震救灾指挥部的指导下，受灾地区县（市）党委、政府组织开展工作
      county_duties:
      - 人员搜救
      - 医疗救护
      - 受灾群众安置
      - 次生灾害防范
      - 应急恢复
      state_support: 州抗震救灾指挥部视情派出联合工作组，指导受灾县（市）党委、政府开展应急处置，并根据需求给予救援队伍和应急物资支援
      annex_gap: 附件表该行"主要响应措施"列为空白（C-LX-03）
  response_actions:
    scope: 州级Ⅰ级响应措施集；Ⅱ级参照执行
    evidence:
    - §5.1
    - §11.6附件表
    items:
    - id: ACT-LX-01
      name: 灾情报告
      detail: 第一时间向省抗震救灾指挥部和州委、州政府报告震情、灾情和应急处置工作进展情况
    - id: ACT-LX-02
      name: 靠前指挥
      detail: 靠前组织指挥和协调抗震救灾工作
      annex_variant: 附件表此项作"启动应急指挥机构"（C-LX-09）
    - id: ACT-LX-03
      name: 收集灾情
      detail: 受灾县（市）政府迅速摸排上报；州应急局通过灾情上报系统收集人员伤亡、房屋倒塌、社会影响；各成员单位摸排本行业受灾情况报指挥部办公室
    - id: ACT-LX-04
      name: 综合研判
      detail: 州抗震救灾指挥部组织成员单位综合分析判断地震趋势，全面了解掌握震情
    - id: ACT-LX-05
      name: 派遣救援队伍
      detail: 协调调度消防、矿山和危险化学品救援队、军队和武警部队赴灾区，优先开展人员搜救、伤员救治、受灾群众安置
    - id: ACT-LX-06
      name: 实施交通管制
      detail: 对通往受灾地区的主要通道实施交通管制，优先保证抢险救援、医疗卫生、救灾物资车辆和转送危重伤员车辆进出，设立救援物资车辆停车卸载场地
    - id: ACT-LX-07
      name: 开展医疗救治
      detail: 派遣医疗紧急救援队伍，必要时建立战地医院或医疗点；调度救护车、医疗器械、药品和血浆；统筹各县市医疗资源分流重伤员异地救治；组织心理援助；卫生消杀和疫情防控
    - id: ACT-LX-08
      name: 开展灾情损失评估
      detail: 初评地震影响范围、人员伤亡数量和极震区烈度，制作震中位置图等专题图件；配合省地震局开展发震构造研究与烈度评定；调查灾区范围、受灾人口、成灾人口、建筑物和生命线工程破坏程度；组织专家开展灾害损失评估
    - id: ACT-LX-09
      name: 加强监测和震情研判
      detail: 加密震情监测研判，监视震情发展和宏微观异常，通报余震分布；加强灾害性天气、次生灾害危险源监测预警；加强空气、水源、土壤和地质灾害监测
    - id: ACT-LX-10
      name: 灾害风险排查
      detail: 对重大危险源、重要目标、重要基础设施隐患排查与监测预警；防范强余震和降雨形成的滑坡、泥石流、坍塌等次生灾害；组织专家对水库、堤坝、闸站险情排查评估和除险加固，必要时人员转移；排查危化品设备、输油气管道、输配电线路受损；对灾区集中安置点和应急避难场所开展次生灾害隐患排查
    - id: ACT-LX-11
      name: 抢修生命线工程
      detail: 抢通运输路线，制定紧急运输保障方案，综合调配运力；调集通信、供电、供水车辆优先确保应急指挥、人员搜救、医疗救治和群众安置；企业抢修供电、通信、供水、供气、广播电视等基础设施
    - id: ACT-LX-12
      name: 安置受灾群众
      detail: 组织转移，鼓励投亲靠友，开放应急避难场所，设置临时安全的集中安置点；设立救灾物资集中接收点（库），统筹调运食品、饮用水、衣被、帐篷、折叠床等生活物资
    - id: ACT-LX-13
      name: 加强新闻报道
      detail: 按要求及时组织召开新闻发布会，有序做好震情灾情权威信息发布和新闻宣传报道，加强舆情应对和舆论引导
    - id: ACT-LX-14
      name: 涉外事务管理
      detail: 转移安置在灾区的国境外人员并报省；组织管理国境外媒体采访；协调国境外救援队活动；国境外捐赠物资款项的接收管理与检验检疫登记
    - id: ACT-LX-15
      name: 生产生活恢复
      detail: 指导灾区党委政府实施救灾救助，帮助企业恢复生产、恢复市场供应、群众复工、学生复课
    - id: ACT-LX-16
      name: 加强应急值守
      detail: 震后72小时内各有关成员单位安排1名县级干部和至少1名科级干部集中在州抗震救灾指挥部办公点值班值守；震后4至7天内安排至少1名科级干部值班值守
      quantified: true
  monitoring_and_reporting:
    evidence:
    - §4.1
    - §4.2
    - §4.3
    monitoring:
      owner: 州地震局
      duties:
      - 监测、收集和管理全州各类地震观测数据
      - 及时提出加强年度地震重点危险区和防震减灾工作的意见
      - 州、县（市）地震工作部门加强震情跟踪监测、预测预报和群测群防
      - 对地震预测意见和可能与地震有关的异常现象进行综合分析研判
      forecast_authority: 州政府根据预报的震情决策发布临震预报，指导预报区域加强应急防范
    quick_report:
      id: RULE-LX-QUICKREPORT
      trigger:
        urban:
          op: '>='
          value: 3.5
          scope: 州内城市
        rural:
          op: '>='
          value: 4.0
          scope: 农村地区
      owner: 州地震局
      content:
      - 地震发生时间
      - 地点
      - 震级
      - 震源深度
      to:
      - 州委
      - 州政府
      cc: 州抗震救灾指挥部各成员单位
      deadline: 原文仅表述"快速完成"，无量化时限（G-LX-04 / DEC-LX-06）
    disaster_report:
      paths:
      - actor: 事发地县级以上政府
        action: 及时将震情、灾情等信息报上一级政府
        escalation: 必要时可越级上报
      - actor: 州地震局
        action: 协助省上专家迅速开展地震灾害快速评估并提出应急处置决策建议
        to:
        - 州委
        - 州政府
        cc: 相关部门
      - actor: 州抗震救灾指挥部
        action: 迅速组织开展现场灾情收集、分析研判
        to:
        - 州委
        - 州政府
        - 省应急厅
        - 省地震局
      - actor: 州政府
        action: 较大以上地震灾情及时报告省政府
      special_persons:
        condition: 发现有港澳台或外籍人员伤亡、失踪或被困
        action: 当地政府及有关部门迅速核实并报告州政府办公室、州应急局、州地震局、州文旅局；有关部门依规及时报告州委、州政府和省上有关部门
  termination:
    id: TERM-LX
    evidence:
    - §6
    decider: 应急响应启动机构
    conditions_all_of:
    - 抗震救灾应急工作基本结束
    - 紧急转移和安置人员工作基本完成
    - 地震次生灾害影响基本消除
    - 交通运输、电力、通信和供水设施等基本抢修抢通
    - 灾区生活秩序基本恢复
    transition_to: 灾后恢复重建阶段
  recovery:
    evidence:
    - §7.1
    - §7.2
    planning:
      特别重大: 省政府按照国务院及国家相关部委的要求组织编制灾后恢复重建规划
      重大较大一般: 按分级应对原则，在上一级政府安排部署和有关部门组织下，按程序由省发改委牵头，会同省财政厅、省应急厅、省地震局等部门和灾区市（州）政府编制
      state_role: 州政府按程序组建灾后恢复重建指导协调小组，研究解决恢复重建中的重大问题，指导受灾县（市）开展灾后恢复重建
    implementation: 州、县（市）政府根据规划和当地经济社会发展水平，有计划、分步骤地组织实施本行政区域灾后恢复重建
