    - ACT-LX-01..16
    tags:
    - Ⅰ级响应
    - 措施清单
    - 关键
    text: '（8）开展灾情损失评估。对地震致灾程度做出初步评估，包括地震影响范围、人员伤亡数量和极震区烈度等信息，制作震中位置图等应急救灾专题图件。配合省地震局组织开展发震构造研究，通过对地震烈度、工程结构震害特征、地震地质灾害和社会影响等进行调查，开展烈度评定；调查灾区范围、受灾人口、成灾人口、人员伤亡数量、建筑物和生命线工程破坏程度等，组织专家开展灾害损失评估。

      '
  - id: LX-C041
    section: '5.1'
    title: 州级Ⅰ级应急响应
    subsection: （9）加强监测和震情研判。加密开展震情监测研判，密切监视震情发展和
    char_count: 111
    ontology_refs:
