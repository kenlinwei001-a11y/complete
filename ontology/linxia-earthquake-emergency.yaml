  - id: LX-C023
    section: '3.1'
    title: 地震灾害分级
    char_count: 450
    ontology_refs:
    - SG-LX-1
    - SG-LX-2
    - SG-LX-3
    - SG-LX-4
    - RULE-LX-GRADE
    tags:
    - 分级标准
    - 阈值
    - 关键
    text: '根据《国家地震应急预案》、《甘肃省地震应急预案》相关规定，结合临夏州实际情况，将地震灾害划分为特别重大地震灾害（Ⅰ级）、重大地震灾害（Ⅱ级）、较大地震灾害（Ⅲ级）、一般地震灾害（Ⅳ级）4个等级。

      特别重大地震灾害（Ⅰ级）：造成300人以上死亡（含失踪）的地震灾害，重要地区发生7.0级以上地震，初判为特别重大地震灾害。

      重大地震灾害（Ⅱ级）：造成50人以上、300人以下死亡（含失踪）的地震灾害，临夏市以及震中50公里范围内人口密度达到200人/平方公里的地区发生6.0级以上、7.0级以下地震，初判为重大地震灾害。

      较大地震灾害（Ⅲ级）：造成10人以上、50人以下死亡（含失踪）的地震灾害，临夏市以及震中50公里范围内人口密度达到200人/平方公里的地区发生5.0级以上、6.0级以下地震，初判为较大地震灾害。

      一般地震灾害（Ⅳ级）：造成10人以下死亡（含失踪）的地震灾害，临夏市以及震中50公里范围内人口密度达到200人/平方公里的地区发生4.5级以上地震、5.0级以下地震，初判为一般地震灾害。

      '
  - id: LX-C024
    section: '3.2'
    title: 分级应对与响应分级
    char_count: 0
    text: ''
    note: 章标题，无正文
  - id: LX-C025
    section: 3.2.1
    title: 分级应对
    char_count: 191
    ontology_refs:
    - RULE-LX-TIER
    tags:
    - 分级应对
    - 责任层级
    - 关键
    text: '初判发生特别重大和重大地震灾害，按照省委、省政府的决策部署，由省抗震救灾指挥部指挥和协调抗震救灾工作。初判发生较大地震灾害，由市（州）党委、政府负责应对；初判发生一般地震灾害，由县（市、区）党委、政府负责应对。涉及跨行政区域的地震灾害，由上一级党委、政府统筹协调，受灾地区党委、政府负责本行政区域抗震救灾工作；当地震灾害超出属地政府的应对能力时，报请上一级政府提供支援或者负责应对。

      '
  - id: LX-C026
    section: 3.2.2
    title: 响应分级
    char_count: 186
    ontology_refs:
    - RL-LX-*
    - MOD-LX-MINORITY
    - MOD-LX-ADJUST
    tags:
    - 响应分级
    - 提级
    - 关键
    text: '根据地震强度及影响，地震应急响应由高到低分为Ⅰ级、Ⅱ级、Ⅲ级、Ⅳ级四个级别。地震灾害发生后，县级以上政府及其有关部门和单位等根据地震灾害初判级别、应急处置能力及预期影响后果，研判确定本级地震应急响应级别。

      地震灾害发生在少数民族聚居地区和其他特殊地区，可根据需要适当提高应急响应级别。地震应急响应启动后，可视灾情发展情况对应急响应级别及时进行调整，避免响应不足或响应过度。

      '
  - id: LX-C027
    section: '4'
    title: 监测报告
    char_count: 0
    text: ''
    note: 章标题，无正文
  - id: LX-C028
    section: '4.1'
    title: 地震监测预报
    char_count: 147
    ontology_refs:
    - ACT-LX-MONITOR
    tags:
    - 监测预报
    text: '州地震局负责监测、收集和管理全州各类地震观测数据，及时提出加强年度地震重点危险区和防震减灾工作的意见。州、县（市）地震工作部门加强震情跟踪监测、预测预报和群测群防工作，及时对地震预测意见和可能与地震有关的异常现象进行综合分析研判。州政府根据预报的震情决策发布临震预报，指导预报区域加强应急防范。

      '
  - id: LX-C029
    section: '4.2'
    title: 震情速报
    char_count: 90
    ontology_refs:
    - RULE-LX-QUICKREPORT
    tags:
    - 震情速报
    - 阈值
    text: '州内城市发生3.5级以上地震、农村地区发生4.0级以上地震后，州地震局快速完成地震发生时间、地点、震级、震源深度等速报参数，及时报州委、州政府，同时通报州抗震救灾指挥部各成员单位。

      '
  - id: LX-C030
    section: '4.3'
    title: 灾情报告
    char_count: 257
    ontology_refs:
    - RULE-LX-DISASTER-REPORT
    tags:
    - 灾情报告
    - 上报路径
    text: '地震灾害发生后，事发地县级以上政府及时将震情、灾情等信息报上一级政府，必要时可越级上报。州地震局协助省上专家迅速开展地震灾害快速评估工作并提出应急处置决策建议，报告州委、州政府并抄送相关部门。州抗震救灾指挥部迅速组织开展现场灾情收集、分析研判等工作，有关灾情及时报州委、州政府、省应急厅和省地震局。较大以上地震灾情，州政府及时报告省政府。

      发现有港澳台或外籍人员伤亡、失踪或被困的，当地政府及有关部门要迅速核实并报告州政府办公室、州应急局、州地震局、州文旅局，有关部门要依据规定及时报告州委、州政府和省上有关部门。

      '
  - id: LX-C031
    section: '5'
    title: 应急响应
    char_count: 0
    text: ''
    note: 章标题，无正文
  - id: LX-C032
    section: '5.1'
    title: 州级Ⅰ级应急响应
    char_count: 134
