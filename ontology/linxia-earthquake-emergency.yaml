    - WP-LX
    tags:
    - 工作原则
    text: '抗震救灾工作坚持人民至上、生命至上，以防为主、防救结合，统一指挥、军地联动，分级负责、属地为主，资源共享、快速反应的工作原则。地震灾害发生后，县级以上政府及其有关部门按照各自职责和任务分工开展地震灾害应急处置工作。

      '
