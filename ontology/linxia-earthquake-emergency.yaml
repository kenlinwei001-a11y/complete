    - 措施清单
    - 关键
    text: '（5）派遣救援队伍。根据灾情判断和救灾需求，协调调度消防、矿山和危险化学品救援队、军队和武警部队派遣救援队伍赴灾区抢险救援，优先开展人员搜救、伤员救治、受灾群众安置等。

      '
  - id: LX-C038
    section: '5.1'
    title: 州级Ⅰ级应急响应
    subsection: （6）实施交通管制。对通往受灾地区的主要通道实施交通管制，优先保证
    char_count: 101
    ontology_refs:
    - RL-LX-1
    - ACT-LX-01..16
    tags:
    - Ⅰ级响应
    - 措施清单
    - 关键
    text: '（6）实施交通管制。对通往受灾地区的主要通道实施交通管制，优先保证抢险救援、医疗卫生、运送救灾物资的车辆和转送危重伤员、受灾群众车辆及时进出灾区，设立救援物资车辆停车卸载场地，保障受灾地区内部道路畅通。

      '
  - id: LX-C039
    section: '5.1'
    title: 州级Ⅰ级应急响应
    subsection: （7）开展医疗救治。派遣医疗紧急救援队伍赶赴灾区抢救受伤群众，必要
    char_count: 184
    ontology_refs:
    - RL-LX-1
    - ACT-LX-01..16
    tags:
    - Ⅰ级响应
    - 措施清单
    - 关键
    text: '（7）开展医疗救治。派遣医疗紧急救援队伍赶赴灾区抢救受伤群众，必要时建立战地医院或医疗点，实施现场救治；加大对灾区救护车、医疗器械、药品和血浆等医疗物资的调度供应，确保受伤人员得到及时医治，最大程度减少伤员致死、致残；统筹各县（市）的医疗资源，根据需要分流重伤员，实施异地救治；组织心理咨询专家开展灾后心理援助；及时组织卫生防疫队伍赶赴灾区开展卫生消杀和疫情防控工作。

      '
  - id: LX-C040
    section: '5.1'
    title: 州级Ⅰ级应急响应
    subsection: （8）开展灾情损失评估。对地震致灾程度做出初步评估，包括地震影响范
    char_count: 178
    ontology_refs:
