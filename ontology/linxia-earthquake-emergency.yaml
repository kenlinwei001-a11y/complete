# ==============================================================================
# 临夏州地震应急预案 · 本体图谱（自包含单文件版 v2）
# ------------------------------------------------------------------------------
# 本文件是《临夏州地震应急预案》的完整结构化表达，合并了三部分内容：
#   一、本体图谱      对象类型 / 关系类型 / 事实 / 实例 / 边 / 可判定规则
#   二、地震事件触发层 震情摄入 → 初判 → 双维度定级 → 响应启动 → 次生灾害处置
#   三、推演规格      输入契约 / 定级引擎 / 四级剧本 / 报告模板 / 出稿闸门
#   四、原文分块      78 块逐字原文 + 章节索引，evidence 字段可解析到原文
#
# 依据单一性：本预案为地震应急处置的唯一依据。震后次生地质灾害一并按
#   §2.1.1(8) 地震监测和次生灾害防范处置组职责 与 §5.1(10) 灾害风险排查
#   执行，不并用其他专项预案（DEC-LX-11）。全域只有一个地震灾害等级、
#   一个响应级别、一套指挥链。
#
# 引用方式：evidence 填章节号（如 "§3.1"）→ 经 source_text.section_index
#   解析到 chunk_id → 取 source_text.chunks[].text 得原文逐字内容。
#
# 保真：原文分块未做任何改写、润色或纠错；原文的错别字与语病一并保留，
#   勘误记录在 quality 节。正文行覆盖率 100%（程序校验）。
# ==============================================================================

meta:
  ontology_key: linxia_earthquake_emergency
  display_name: 临夏州地震应急预案 · 本体图谱（自包含单文件版）
  version: 2
  status: FROZEN_V2_SELF_CONTAINED
  domain: 应急管理 / 地震灾害
  language: zh-CN
  jurisdiction:
    province: 甘肃省
    prefecture: 临夏回族自治州
    admin_level: 州（市）级
    subordinate_counties_note: 辖县（市）含积石山保安族东乡族撒拉族自治县
  source_document:
    doc_id: DOC-LX-EQ
    title: 临夏州地震应急预案
    drafted_by: 州应急局会同州地震局等有关部门
    interpreted_by: 州抗震救灾指挥部办公室
    effective: 自印发之日起实施
    supersedes: 临州办发〔2012〕392号
    doc_number: 缺失（G-LX-01）
    issue_date: 缺失（G-LX-01）
    structure: 11章 + 附件《临夏州地震灾害应急响应措施》表
  purpose: '(1) 震后按事实输入完成地震灾害初判定级，确定响应级别、启动权限与指挥人； (2) 打通州—县两级、地震—地质灾害两套预案的衔接口径； (3) 检出与上位国家预案、下位县级预案之间的口径冲突与责任真空。

    '
  conventions:
    number_semantics: 本预案所称"以上"包括本数，"以下"不包括本数（§11.3）
    evidence_ref: 章节号，形如 "§3.1"，经 chunks.section_index 解析
    single_source_of_truth: 任何阈值只在 rules 或 nodes 中定义一次
  self_contained: 本文件合并本体、原文分块与推演规格，无外部依赖
  single_source_doctrine: 本文件为地震应急处置的唯一预案依据。震后次生地质灾害的防范处置一并按本预案 §2.1.1(8) 与 §5.1(10) 执行，不并用其他专项预案，以保证全域执行依据唯一、口径唯一。
  county_tier_note: 县（市）级组织指挥体系按 §2.2 及 DEC-LX-10，参照本预案十一个工作组一一对应设置，牵头单位映射至县级对应部门。
