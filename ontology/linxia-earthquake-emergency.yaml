facts:
  command_structure:
    evidence:
    - §2.1.1
    hq:
      name: 州抗震救灾指挥部
      leadership: 在州委、州政府的领导下，负责统一指挥和协调全州抗震救灾工作
      commander: 州政府分管副州长
      deputy_commanders:
      - 州政府办相关副主任
      - 州应急局局长
      - 州地震局局长
      - 州发展改革委分管负责同志
      - 州公安局分管负责同志
      - 临夏军分区分管负责同志
      - 武警临夏支队分管负责同志
      - 州消防救援支队分管负责同志
    office:
      name: 州抗震救灾指挥部办公室
      seated_at: 州应急局
      director: 州应急局局长（兼）
      deputy_directors:
      - 州地震局局长（兼）
      - 州应急局分管副局长（兼）
      duty: 承担州抗震救灾指挥部日常工作
    member_units:
      count_listed: 30
      list:
        党政群团:
        - 州委宣传部
        - 州委网信办
        - 团州委
        综合管理:
        - 州应急局
        - 州地震局
        - 州发展改革委
        - 州财政局
        - 州统计局
        - 州市场监管局
        社会民生:
        - 州教育局
        - 州民政局
        - 州司法局
        - 州卫健委
        - 州文旅局
        国土资源与环境:
        - 州自然资源局
        - 州生态环境局
        - 州气象局
        基础设施:
        - 州住建局
        - 州交通局
        - 州水务局
        - 州工信局
        经济与物资:
        - 州农业农村局
        - 州商务局
        - 州粮食和物资储备局
        安全力量:
        - 州公安局
        传播与金融:
        - 州广播电视台
        - 州银保监分局
        社会组织与企业:
        - 州红十字会
        - 中国电信临夏分公司
        - 国网临夏供电公司
        - 中石油临夏销售分公司
      extensibility: 根据工作需要，可增加有关部门和单位负责同志参加
      note: '指挥部成员名单未列临夏军分区、武警临夏支队、州消防救援支队， 但三家均在副总指挥名单及多个工作组参加单位中——名单口径不闭合，见 C-LX-10

        '
    onsite_hq:
      name: 州抗震救灾现场指挥部
      evidence:
      - §2.1.2
      trigger: 较大及以上地震灾害发生后，立即成立
      chief: 州抗震救灾指挥部总指挥 或 州委、州政府指定专人
      duty: 指导协调和组织开展现场应急救援工作，各工作组按任务分工开展工作
      dissolution: 应急救援阶段结束后自动撤销
    county_tier:
      name: 县（市）抗震救灾指挥部
      evidence:
      - §2.2
      leadership: 在本级党委、政府的领导下，按照州抗震救灾指挥部的指挥调度
      duty: 负责指导协调和组织本行政区域抗震救灾工作
  jishishan_adaptation:
    purpose: 将州预案的通用判据落到积石山县的具体参数
    population_density:
      county_population:
        value: 278089
        unit: 人
        source: 积石山县突发地质灾害应急预案 §1.6
        caveat: 依 DEC-01 修正原文"万人"衍字
      county_area_km2: 909.97
      density:
        value: 305.6
        unit: 人每平方公里
        formula: 278089 / 909.97
      threshold_in_plan: 200
      conclusion: 积石山县人口密度 305.6 人/km² 高于州预案 200 人/km² 的判据阈值
      implication: 州预案 §3.1 的震级判据对积石山县成立——该县发生 6.0 级以上地震，可不待伤亡统计直接初判为重大地震灾害（Ⅱ级）
      decision_ref: DEC-LX-03
      caveat: '原文表述为"震中50公里范围内人口密度达到200人/平方公里的地区"， 是按50 km圆域平均密度计算还是按行政区密度计算，原文未明确（C-LX-11）。 本结论按行政区密度计算，若按圆域平均（含大量山区与邻县）可能低于阈值。

        '
    precedent_check:
      event: 2023-12-18 积石山 Ms6.2 地震
      magnitude_criterion: 6.2 落入 6.0以上、7.0以下
      derived_grade: 重大地震灾害（Ⅱ级）
      note: 与实际处置量级相符，可作为判据校验样例
nodes:
  working_groups:
    activation_condition: 较大及以上地震灾害发生后，根据应急处置工作需要设立
    evidence:
    - §2.1.1
    groups:
    - id: WG-LX-01
      name: 综合协调组
      lead:
      - 州应急局
      members:
      - 州发改委
      - 州财政局
      - 州交通局
      - 州地震局
      duties:
      - 抗震救灾综合协调
      - 收集汇总震情灾情等信息
      - 承办抗震救灾有关会议活动
    - id: WG-LX-02
      name: 抢险救援组
      lead:
      - 州应急局
      members:
      - 州地震局
      - 州公安局
      - 临夏军分区
      - 武警临夏支队
      - 州消防救援支队
      - 专业救援队伍
      - 民间救援力量
      duties:
      - 制订实施抗震救灾力量配置方案
      - 调配救援队伍和装备
      - 搜救被困群众和受伤人员
      - 组织救援人员和物资运转
      - 清理灾区现场
      - 处置次生灾害
    - id: WG-LX-03
      name: 地震灾情调查及灾害损失评估组
      lead:
      - 州应急局
      - 州地震局
      members:
      - 州财政局
      - 州住建局
      - 州水务局
      - 州卫健委
      - 州农业农村局
      - 州教育局
      - 州自然资源局
      - 州交通局
      - 州科技局
      - 州统计局
      - 州银保监分局
      duties:
      - 开展地震烈度、发震构造、地震宏观异常现象调查
      - 调查受灾范围、建（构）筑物和基础设施破坏程度、工程结构震害特征
      - 调查人员伤亡数量、地震社会影响和各种地震地质灾害
      - 组织对地震灾害损失进行评估
      - 组织开展灾区房屋安全性鉴定
      - 指导灾区做好保险理赔
      scope_note: 本组职责明文含"各种地震地质灾害"调查，次生地质灾害损失评估由本组牵头汇总，避免与直接震害重复计数
    - id: WG-LX-04
      name: 群众生活保障组
      lead:
      - 州应急局
      members:
      - 州民政局
      - 州发改委
      - 州粮食和物资储备局
      - 州教育局
      - 州工信局
      - 州财政局
      - 州住建局
      - 州水务局
      - 州商务局
      - 州气象局
      - 州红十字会
      - 国网临夏供电公司
      - 州消防救援支队
