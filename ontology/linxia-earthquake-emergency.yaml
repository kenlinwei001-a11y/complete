    - ORG-LX-OFFICE
    - WG-LX-*
    tags:
    - 组织机构
    - 工作组
    - 职责
    text: '州抗震救灾指挥部在州委、州政府的领导下，负责统一指挥和协调全州抗震救灾工作。由州政府分管副州长任总指挥，州政府办相关副主任、州应急局局长、州地震局局长和州发展改革委、州公安局、临夏军分区、武警临夏支队、州消防救援支队分管负责同志任副总指挥，成员由州委宣传部、州委网信办、州教育局、州科技局、州工信局、州民政局、州司法局、州财政局、州自然资源局、州生态环境局、州住建局、州交通局、州水务局、州农业农村局、州商务局、州文旅局、州卫健委、州应急局、州市场监管局、州统计局、州粮食和物资储备局、团州委、州气象局、州地震局、州广播电视台、州银保监分局、州红十字会、中国电信临夏分公司、国网临夏供电公司、中石油临夏销售分公司等部门负责同志为成员；根据工作需要，可增加有关部门和单位负责同志参加。

      州抗震救灾指挥部办公室设在州应急局，承担州抗震救灾指挥部日常工作；州应急局局长兼任办公室主任，州地震局局长、州应急局分管副局长兼任办公室副主任。

      较大及以上地震灾害发生后，根据应急处置工作需要，州抗震救灾指挥部设立以下工作组：

      '
