    items:
    - id: EVT-LX-FELT
      name: 强有感地震事件
      definition: 发生在州政府所在地以及大中型水库等重要设施场地及附近的震级在4.5级以下、且有明显震感、可能对社会造成一定影响的地震事件
      responsible: 事件发生地县（市）党委、政府
      state_actions:
      - 州应急局迅速了解灾情并视情派工作组
      - 州地震局收集震情并提出趋势研判意见
      - 州委宣传部协调科普宣传和舆论引导
    - id: EVT-LX-IMMINENT
      name: 临震应急事件
      definition: 省级以上人民政府发布短临地震预报后，县级以上人民政府需要及时进行处置的地震事件
      actions:
      - 州抗震救灾指挥部指导督促预报区域县（市）党委政府做好防震抗震和抢险救援准备
      - 地震预报区县（市）政府统一指挥部署应急准备，视情组织人员避震疏散或撤离
      - 州地震局加强震情监视，及时报告趋势研判意见
      - 州委宣传部协调科普宣传和舆论引导
      - 各成员单位对可能发生的地震事件影响后果进行评估并做好准备
      termination: 终止临震应急公告由省抗震救灾指挥部统一发布
    - id: EVT-LX-RUMOR
      name: 地震传言事件
      responsible: 事发地党委、政府
      actions:
      - 州地震局迅速分析研判，及时明确事件性质并发布声明
      - 州委宣传部、州委网信办、州公安局指导协助当地采取有效措施平息传言
      - 传言扩散迅速并严重影响生产生活秩序时，州抗震救灾指挥部组织联合工作组赴影响地区
    - id: EVT-LX-NEARBY
      name: 周边地区地震事件
      definition: 地震发生在周边地区，但对本州造成震灾损失或严重社会影响
      actions:
      - 州地震局迅速分析周边地震对本州的影响，研判本州境内地震烈度，评估可能造成的伤亡损失
      - 州抗震救灾指挥部办公室根据震级大小、灾情严重程度和研判结果，向州抗震救灾指挥部或受影响县（市）政府提出启动响应的建议
      - 按程序决定启动应急响应后，有关县（市）部门和单位立即开展应急处置
      relevance_to_jishishan: 积石山县西接青海循化县，2023年震例即为跨省界影响，本条为跨界情景的唯一依据
    - id: EVT-LX-SUPPORT
      name: 支援周边地区地震事件
      definition: 周边发生较大地震灾害事件并向本州提出支援请求
