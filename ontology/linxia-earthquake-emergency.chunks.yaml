      主要职责：制订实施受灾群众救助工作方案以及相应的资金、物资保障措施，组织调集、转运受灾地区生活必需品等抗震救灾物资，指导做好受灾群众的紧急转移和安置工作，保障受灾地区群众基本生活和市场供应；统筹安排社会组织和志愿者队伍参与受灾群众救助等工作。
  - id: LX-C013
