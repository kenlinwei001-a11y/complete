    char_count: 122
    ontology_refs: [ORG-LX-ONSITE]
    tags: [现场指挥部]
    text: |
      较大及以上地震灾害发生后，立即成立州抗震救灾现场指挥部，指导协调和组织开展现场应急救援工作。现场指挥部指挥长由州抗震救灾指挥部总指挥或州委、州政府指定专人担任，各工作组按照任务分工开展相关工作。应急救援阶段结束后，州抗震救灾现场指挥部自动撤销。
