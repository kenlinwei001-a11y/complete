      参加单位：州发改委、州财政局、州交通局、州地震局。
      主要职责：负责抗震救灾综合协调工作，收集汇总震情、灾情等信息，承办抗震救灾有关会议、活动等。
  - id: LX-C010
    section: "2.1.1"
    title: 州抗震救灾指挥部
    subsection: （2）抢险救援组
    char_count: 142
