      参加单位：州财政局、州住建局、州水务局、州卫健委、州
      农业农村局、州教育局、州自然资源局、州交通局、州科技局、州统计局、州银保监分局。
      主要职责：开展地震烈度、发震构造、地震宏观异常现象、受灾范围、建（构）筑物和基础设施破坏程度、工程结构震害特征、人员伤亡数量、地震社会影响和各种地震地质灾害等调查，组织对地震灾害损失进行评估；组织开展灾区房屋安全性鉴定工作；指导灾区做好保险理赔等工作。
  - id: LX-C012
    section: "2.1.1"
