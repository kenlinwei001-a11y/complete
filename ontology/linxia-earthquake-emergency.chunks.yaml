    tags: [组织机构, 工作组, 职责]
    text: |
      （2）抢险救援组
      牵头单位：州应急局
      参加单位：州地震局、州公安局、临夏军分区、武警临夏支队、州消防救援支队、专业救援队伍、民间救援力量。
      主要职责：制订实施抗震救灾力量配置方案，调配救援队伍和装备，搜救被困群众和受伤人员；组织救援人员和物资的运转；清理受地灾区现场；处置次生灾害等。
  - id: LX-C011
    section: "2.1.1"
