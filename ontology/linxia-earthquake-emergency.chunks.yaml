      主要职责：组派医疗卫生救援队伍，调集医疗器械、药品等物资，对受伤人员进行救治和转移；检查、监测灾区饮用水源、食品等；做好伤员、灾区群众和救援人员的医疗服务与心理救助；制定灾后防疫方案，做好卫生防疫工作。
