# ==============================================================================
# 六、规则层：可判定表达式（供推演引擎直接求值）
# ==============================================================================
rule_semantics:
  inclusive_note: '"以上"含本数（>=），"以下"不含本数（<）'
  combinator_default: OR（任一条件满足即命中该级）
  tie_break: 命中多级时取 rank 最小者（最高级别）

rules:
  - id: RULE-GRADE-DISASTER
    rule_class: 分级判定
    inputs: [death_missing, direct_loss_cny]
    expression: |
      IF death_missing >= 30 OR direct_loss_cny >= 30000000 THEN "特别重大"
      ELSE IF death_missing >= 10 OR direct_loss_cny >= 5000000 THEN "重大"
      ELSE IF death_missing >= 3  OR direct_loss_cny >= 1000000 THEN "较大"
      ELSE "一般"
    outcome: SeverityGrade(dimension=灾情)
    evidence: ["§1.5.2", "§5.4"]

  - id: RULE-GRADE-RISK
    rule_class: 分级判定
    inputs: [evacuation_persons, potential_loss_cny, blocks_river_tributary, blocks_trunk_transport]
    expression: |
      IF evacuation_persons >= 1000 OR potential_loss_cny >= 100000000 OR blocks_river_tributary THEN "特别重大"
      ELSE IF evacuation_persons >= 500 OR potential_loss_cny >= 50000000 OR blocks_trunk_transport THEN "重大"
      ELSE IF evacuation_persons >= 100 OR potential_loss_cny >= 5000000 THEN "较大"
      ELSE "一般"
    outcome: SeverityGrade(dimension=险情)
    evidence: ["§1.5.1", "§5.4"]

  - id: RULE-RESPONSE-LEVEL
    rule_class: 响应启动
    inputs: [grade_disaster, grade_risk, social_attention]
    expression: |
      level = MIN_RANK(
        MAP(grade_disaster, {特别重大: Ⅰ, 重大: Ⅱ, 较大: Ⅲ, 一般: Ⅳ}),
        MAP(grade_risk,     {特别重大: Ⅰ, 重大: Ⅱ, 较大: Ⅲ, 一般: Ⅳ}),
        MAP(social_attention, {特别高: Ⅰ, 非常高: Ⅱ, 较高: Ⅲ, 一般关注: Ⅳ})
      )
    modifiers:
      - {id: MOD-MINORITY, condition: 灾害发生在少数民族聚居地区或其他特殊地区, effect: 可适当提高响应级别, evidence: "§5.5"}
      - {id: MOD-JUMP,     condition: 特殊时期及突发情况, effect: 可越级启动响应, evidence: "§5.2"}
      - {id: MOD-ADJUST,   condition: 灾情发展变化, effect: 及时上调或下调，避免响应不足或过度, evidence: ["§5.2", "§5.5"]}
      - {id: MOD-CAPACITY, condition: 超出本县党委政府应对能力, effect: 办公室报总指挥，按程序报请启动二级响应, evidence: "§5.6.2(Ⅲ级段)"}
    outcome: ResponseLevel
    evidence: ["§5.1", "§5.4", "§5.5"]

  - id: RULE-REPORT-SLA
    rule_class: 报告时限
    inputs: [scale_label]
    expression: |
      IF scale_label IN ("大型","特大型") THEN {速报: 30min, 书面: 120min(自事发), 可直报: [省, 国]}
      ELSE IF scale_label IN ("小型","中型") THEN {速报: 60min}
    outcome: 报告时限义务
    evidence: ["§4.1"]

  - id: RULE-WARNING-RESPONSE
    rule_class: 预警响应
    inputs: [warning_level]
    expression: |
      actions = UNION(WR of all levels with rank >= rank(warning_level))   -- 累积叠加
      IF warning_level == Ⅰ THEN ADD(紧急撤离信号, 疏散受威胁人员, 转移重要财产, 上报州政府, 启动应急预案)
      IF warning_level == Ⅱ THEN ADD(告知受威胁对象, 做好启动预案准备)
    outcome: 行动清单
    evidence: ["§3.3"]

  - id: RULE-TERMINATION
    rule_class: 响应启动
    inputs: [险情受控, 搜救完成, 群众安置, 生活保障, 设施抢通, 秩序恢复]
    expression: ALL(inputs) == true → 由启动机关决定终止响应，转入恢复重建阶段
    outcome: 响应终止
    evidence: ["§5.7"]

  - id: RULE-PLAN-REVISION
    rule_class: 预案修订
    inputs: [法规变化, 机构调整, 风险变化, 资源变化, 信息变化, 演练发现, 编制单位判断]
    expression: ANY(inputs) == true → 应当及时修订应急预案
    outcome: 触发预案修订
    evidence: ["§8.4"]

# ==============================================================================
# 七、质量层：冲突、缺口与待补（推演前必须先看这一节）
# ==============================================================================
quality:
  conflicts:
    - id: C-01
      severity: 高
      type: 数值单位错误
      location: "§1.6"
      finding: '"总人口278089万人" —— 278089 万人 ≈ 27.8 亿，与县域量级矛盾'
      likely_truth: 总人口 278089 人（约 27.8 万人）
      impact: 一切人口占比类推演（受威胁人口占比、人均资产）依赖此值
    - id: C-02
      severity: 高
      type: 数值缺失
      location: "§1.6"
      finding: '"其中易发地质灾害面积平方公里，占全县总面积的47%" —— 数值空缺'
      likely_truth: 909.97 × 47% ≈ 427.69 平方公里
      impact: 易发区面积无法直接引用，需补测或按比例推算并标注
    - id: C-03
      severity: 中
      type: 分类不完整
      location: "§1.6"
      finding: 现存318处按规模分为"1特大型 + 51中型 + 266小型"，缺"大型"档（计 0），而响应分级中 Ⅱ级对应"大型"
      impact: Ⅱ级响应在现状隐患清单中无对应存量对象，情景推演需显式说明"大型=0"是事实还是漏统计
    - id: C-04
      severity: 中
      type: 定义缺口
      location: "§1.6 vs §1.3 / §10.1"
      finding: 灾害点统计含"不稳定斜坡"142处（占 39%，最大类目），但适用范围与术语表均未列入
      impact: 最大类目缺乏定义与处置口径，预案适用性存疑
    - id: C-05
      severity: 低
      type: 名称不一致
      location: "§2.3(9) / §2.1；§6(九) / §2.3(3)"
      finding: 县武警中队 ↔ 县武警大队；县气象站 ↔ 县气象局；县卫生健康委 ↔ 县卫生健康局；县农业局（气象站）↔ 县农业农村局
      impact: 机构实体消歧困难，图谱中已按同一实体归并并保留别名
    - id: C-06
      severity: 中
      type: 职责范围不足
      location: "§2.3(10) vs §5.6.1(11)"
      finding: 新闻宣传组职责仅表述舆情监看管控，未含新闻发布与信息发布；而 Ⅰ级响应措施要求"及时召开新闻发布会，有序做好险情灾情信息发布"
      impact: 新闻发布责任主体在组织层面悬空
    - id: C-07
      severity: 高
      type: 程序冲突
      location: "§5.3.1 vs §5.5"
      finding: |
        §5.3.1：Ⅳ级由办公室建议、总指挥决定启动；Ⅲ级由总指挥启动；Ⅱ级由总指挥建议、县长决定；Ⅰ级由县长启动。
        §5.5：Ⅳ级由办公室视情启动（办公室主任任总指挥）；Ⅲ级由指挥部视情启动（分管领导任总指挥）；Ⅱ级报请县政府同意（政府主要领导任总指挥）；Ⅰ级报请县委县政府同意（县委县政府主要领导任总指挥）。
      impact: 同一响应级别存在两套启动权限与指挥人安排，实战会产生指挥权争议；推演时必须先冻结采用哪一套
      recommendation: 以 §5.5 为准（更细、含指挥人安排），§5.3.1 改为与之一致的表述
    - id: C-08
      severity: 中
      type: 口径漂移
      location: "§1.5.1(2) vs §5.4(2)②"
      finding: 重大险情定义含"铁路主要干线、高速公路、民航和航道中断"，Ⅱ级响应启动条件缩为"公路主要干线、高速公路中断"
      impact: 铁路/民航/航道中断场景在响应启动条件中失去触发点
    - id: C-09
      severity: 中
      type: 主体错误
      location: "§5.5 末段"
      finding: '县级预案中写"各县（市）人民政府根据地质灾害分级…确定本级应急响应分级标准"，主体应为"各乡（镇）人民政府"（§5.4 末段即为正确表述）'
      impact: 疑为从州级预案复制未改，下位授权对象错位
    - id: C-10
      severity: 高
      type: 分类体系不匹配
      location: "§4.1 vs §1.5"
      finding: 信息报告时限按"小型/中型/大型/特大型"（规模口径），而险情灾情分级按"一般/较大/重大/特别重大"（后果口径），两套体系无映射条款
      impact: 接报后无法确定适用 30 分钟还是 1 小时时限；推演已按 响应级别 Ⅳ/Ⅲ/Ⅱ/Ⅰ ↔ 小/中/大/特大型 建立映射（源自 §5.1），需在新报告中显式声明该映射
    - id: C-11
      severity: 中
      type: 牵头单位冲突
      location: "§2.3(7) vs §6(七)"
      finding: 基础设施保障组由县发改局牵头（含电力、通信），但通讯与电力保障由县工信局牵头
      impact: 同一事项两个牵头单位
    - id: C-12
      severity: 低
      type: 名单遗漏
      location: "§6(十一) vs §2.1"
      finding: 县司法局承担法制保障但不在指挥部成员单位名单；县科技局、县市场监管局、县疾控中心同样出现在工作组但不在成员名单
      impact: 成员单位名单需补齐
    - id: C-13
      severity: 低
      type: 编号错误
      location: "§1.4 出现两次（预案体系、工作原则）；§5.6.2 出现两次（Ⅱ级、Ⅲ级）"
      impact: 引用定位困难；本体中已按内容重排为 §1.4 预案体系 / §1.5 工作原则、§5.6.2 Ⅱ级 / §5.6.3 Ⅲ级 / §5.6.4 Ⅳ级
    - id: C-14
      severity: 中
      type: 层级越位
      location: "§6(四) 资金保障"
      finding: 表述"特别重大、重大由州政府启动响应""较大、一般由县（市）政府启动响应"，是州级视角；县级预案中 Ⅰ/Ⅱ 级均由本县启动（§5.5），资金分担口径与响应启动口径不咬合
      impact: Ⅰ/Ⅱ级响应的县级资金来源不明确

  gaps:
    - id: G-01
      topic: 隐患点空间明细
      finding: 仅有 363/318 的总量与分类统计，无逐点清单（编号、坐标、乡镇、威胁户数、监测责任人）
      needed_for: 资源推演、撤离路线推演、乡镇级预案生成
    - id: G-02
      topic: 应急避难场所
      finding: §5.6.1(3) 要求"开放应急避难场所或设置集中安置点"，全文无场所清单、容量、位置
      needed_for: 转移安置容量推演
    - id: G-03
      topic: 队伍与物资底数
      finding: §6(一)(二) 只有能力建设要求，无队伍数量/人数/装备/物资储备量
      needed_for: 缺口分析与调运推演
    - id: G-04
      topic: 预警阈值
      finding: 预警级别仅有定性描述（可能性大小），无降雨量/位移速率等量化触发阈值
      needed_for: 自动预警推演与漏报回溯（§3.3 已承认存在漏报情形）
    - id: G-05
      topic: 附件缺失
      finding: 无成员单位联络表、无隐患点分布图、无组织架构图、无流程图、无"明白卡"模板
      needed_for: 预案可操作性；上位规范通常要求附件
    - id: G-06
      topic: 恢复重建
      finding: §5.7 仅一句"转入恢复重建阶段"，无恢复重建章节（评估、规划、资金、监督）
      needed_for: 全周期推演
    - id: G-07
      topic: 与相邻县及跨界灾害
      finding: 县域与青海循化县接壤，无跨省界地质灾害联动条款
      needed_for: 跨界情景推演
    - id: G-08
      topic: 2023年积石山6.2级地震后的风险变化
      finding: 预案未反映震后地质灾害隐患激增这一重大风险变化（§8.4 修订触发条件③"面临的风险发生重大变化"）
      needed_for: 现势性评估；属外部知识，需人工核实后补入
      confidence: 外部补全（待核）

# ==============================================================================
# 八、推演接口：新报告如何基于本图谱生成
# ==============================================================================
inference_hooks:
  scenario_simulation:
    name: 情景推演（给定事件 → 输出处置全链条）
    input_schema:
      event_time: datetime
      location: {township: string, village: string, site_id: "string?"}
      hazard_type: HazardType.id
      death_missing: "number?"
      injured: "number?"
      direct_loss_cny: "number?"
      evacuation_persons: "number?"
      potential_loss_cny: "number?"
      blocks_river_tributary: "boolean?"
      blocks_trunk_transport: "boolean?"
      social_attention: "enum?"
      warning_level_at_time: "WarningLevel.id?"
    pipeline:
      - {step: 1, apply: RULE-GRADE-DISASTER, out: grade_disaster}
      - {step: 2, apply: RULE-GRADE-RISK,     out: grade_risk}
      - {step: 3, apply: RULE-RESPONSE-LEVEL, out: response_level}
      - {step: 4, apply: RULE-REPORT-SLA,     out: reporting_obligations, note: 需先解决 C-10 口径映射}
      - {step: 5, traverse: "response_level -[response_includes]-> Action", out: action_checklist}
      - {step: 6, traverse: "Action -[responsible_for]<- Organization", out: responsibility_matrix}
      - {step: 7, traverse: "Action -[action_uses]-> Resource -[resource_secured_by]-> Organization", out: resource_plan}
      - {step: 8, apply: RULE-TERMINATION, out: termination_criteria}
    output_report_sections:
      - 事件研判与定级（含定级依据与证据引用）
      - 响应启动建议（含启动主体、指挥人、越级/提级理由）
      - 分钟级信息报告清单（30/60/120 分钟节点）
      - 责任矩阵（工作组 × 措施 × 牵头/参加单位）
      - 资源需求与缺口（对照 G-03 标注不可算项）
      - 终止条件与恢复重建衔接
  gap_audit:
    name: 覆盖度审计（对照上位法规/新大纲 → 输出修订建议）
    method: 以 legal_basis 为对照轴，逐条检查本体节点覆盖情况；quality.conflicts + quality.gaps 直接构成整改台账
    output: 修订建议清单（问题、位置、建议表述、依据、优先级）
  resource_planning:
    name: 资源推演
    known_inputs: [facts.hazard_inventory.active_sites]
    blocked_by: [G-01, G-02, G-03]
    note: 当前仅能做总量级估算（318 点 / 13777 人 / 8.32 亿元资产），逐点推演需先补 G-01
  township_plan_generation:
    name: 乡镇级预案批量生成
    basis: plan_system.tiers（17 乡镇 + 17 重点隐患点一点一案）
    method: 以县级本体为模板，替换主体层级（县→乡镇）、裁剪响应级别至 Ⅳ/Ⅲ、绑定该乡镇隐患点子图
    blocked_by: [G-01]

