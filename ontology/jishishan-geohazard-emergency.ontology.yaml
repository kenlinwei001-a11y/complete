# ==============================================================================
# 积石山县突发地质灾害应急预案 · 本体图谱（Ontology Graph）
# ------------------------------------------------------------------------------
# 用途：作为"新报告推演"的语义底座。所有事实只存一份（facts），所有阈值以可判定
#       规则表达（rules），所有论断绑定证据（evidence → 原文章节）。
# 对齐：docs/PRD-addendum-ontology-core.md 的元模型（object_types / link_types /
#       derivation_specs），可直接映射为 DataCore A4 的本体版本发布载荷。
# ==============================================================================

meta:
  ontology_key: jishishan_geohazard_emergency
  display_name: 积石山县突发地质灾害应急预案本体
  version: 1
  status: DRAFT
  domain: 应急管理 / 突发地质灾害
  language: zh-CN
  jurisdiction:
    country: 中国
    province: 甘肃省
    prefecture: 临夏回族自治州
    county: 积石山保安族东乡族撒拉族自治县
    admin_level: 县级
  purpose: >
    将预案文本结构化为对象-关系图谱，支撑三类推演：
    (1) 情景推演——给定灾情/险情输入，自动判级、判定响应级别、展开责任链与措施清单；
    (2) 覆盖度推演——对照上位法规与新大纲，检出缺失、口径冲突与责任真空；
    (3) 资源推演——按隐患点分布与威胁人口，推演队伍/物资/资金缺口。
  source_documents:
    - doc_id: DOC-1
      title: 积石山县突发地质灾害应急预案
      type: 县级专项应急预案
      format: docx
      sha_note: 由用户上传的单一源文件，本体全部事实均溯源至此
      structure: 10 章（总则/组织机构/预防预警/信息报告/应急响应/应急保障/责任奖惩/预案管理/预案解释/附则）
  conventions:
    id_style: 大写类型前缀 + 连字符编号，全局唯一
    number_semantics: 本预案"以上"含本数，"以下"不含本数（源自 §10.1 末段）
    currency: CNY
    evidence_ref: 值为原文章节号，形如 "§1.5.1"
    single_source_of_truth: 任何数字只在 facts 或 rules 中定义一次，其余位置以 $ref 引用

# ==============================================================================
# 一、元模型：对象类型（object_types）
# ==============================================================================
object_types:

  - type_key: Region
    display_name: 行政区域
    primary_key: id
    properties:
      - {key: id, dataType: string, required: true}
      - {key: name, dataType: string, required: true}
      - {key: level, dataType: enum, enumValues: [国, 省, 州, 县, 乡镇, 村]}
      - {key: area_km2, dataType: number}
      - {key: population, dataType: number, temporal: true}
      - {key: village_count, dataType: number}
      - {key: township_count, dataType: number}

  - type_key: Organization
    display_name: 组织机构
    primary_key: id
    properties:
      - {key: id, dataType: string, required: true}
      - {key: name, dataType: string, required: true}
      - {key: org_class, dataType: enum, enumValues: [指挥部, 办公室, 工作组, 成员单位, 政府, 党委, 救援队伍, 专家组, 企业]}
      - {key: level, dataType: enum, enumValues: [国, 省, 州, 县, 乡镇, 村]}
      - {key: contact, dataType: string}
      - {key: duties, dataType: string}

  - type_key: Role
    display_name: 岗位/职务
    primary_key: id
    properties:
      - {key: id, dataType: string, required: true}
      - {key: name, dataType: string, required: true}
      - {key: appointed_from, dataType: string, description: 由何种职务的人担任}

  - type_key: HazardType
    display_name: 地质灾害类型
    primary_key: id
    properties:
      - {key: id, dataType: string, required: true}
      - {key: name, dataType: string, required: true}
      - {key: definition, dataType: string}
      - {key: trigger_factors, dataType: string}

  - type_key: HazardSite
    display_name: 地质灾害隐患点/灾害点
    primary_key: id
    properties:
      - {key: id, dataType: string, required: true}
      - {key: hazard_type_ref, dataType: ref, refTo: HazardType}
      - {key: scale, dataType: enum, enumValues: [特大型, 大型, 中型, 小型]}
      - {key: status, dataType: enum, enumValues: [现存险情, 已消除]}
      - {key: threatened_population, dataType: number, temporal: true}
      - {key: threatened_asset_cny, dataType: number, temporal: true}
      - {key: is_key_site, dataType: boolean, description: 是否列为全县重点隐患点}
      - {key: mitigation_measure, dataType: enum, enumValues: [工程治理, 搬迁避让, 群测群防, 专业监测, 未处置]}

  - type_key: SeverityGrade
    display_name: 险情/灾情分级
    primary_key: id
    properties:
      - {key: id, dataType: string, required: true}
      - {key: name, dataType: enum, enumValues: [特别重大, 重大, 较大, 一般]}
      - {key: dimension, dataType: enum, enumValues: [险情, 灾情]}
      - {key: rank, dataType: number, description: 1=最高}

  - type_key: WarningLevel
    display_name: 气象风险预报预警级别
    primary_key: id
    properties:
      - {key: id, dataType: string, required: true}
      - {key: roman, dataType: enum, enumValues: [Ⅰ, Ⅱ, Ⅲ, Ⅳ]}
      - {key: color, dataType: enum, enumValues: [红色, 橙色, 黄色, 蓝色]}
      - {key: name, dataType: string}
      - {key: risk_statement, dataType: string}
      - {key: rank, dataType: number, description: 1=最高}

  - type_key: ResponseLevel
    display_name: 应急响应级别
    primary_key: id
    properties:
      - {key: id, dataType: string, required: true}
      - {key: roman, dataType: enum, enumValues: [Ⅰ, Ⅱ, Ⅲ, Ⅳ]}
      - {key: scale_label, dataType: enum, enumValues: [特大型, 大型, 中型, 小型]}
      - {key: rank, dataType: number}
      - {key: proposer, dataType: string, description: 提出建议主体}
      - {key: decider, dataType: string, description: 决定启动主体}
      - {key: onsite_commander, dataType: string, description: 总指挥担任者}

  - type_key: Rule
    display_name: 可判定规则（阈值/条件）
    primary_key: id
    properties:
      - {key: id, dataType: string, required: true}
      - {key: rule_class, dataType: enum, enumValues: [分级判定, 响应启动, 报告时限, 预警响应, 预案修订]}
      - {key: expression, dataType: string, description: 见 §2 派生公式 DSL 兼容表达式}
      - {key: outcome, dataType: string}

  - type_key: Action
    display_name: 应急措施/处置动作
    primary_key: id
    properties:
      - {key: id, dataType: string, required: true}
      - {key: name, dataType: string, required: true}
      - {key: phase, dataType: enum, enumValues: [预防, 预警, 报告, 响应, 保障, 恢复, 善后]}
      - {key: description, dataType: string}

  - type_key: Resource
    display_name: 应急资源（队伍/物资/装备/资金/系统）
    primary_key: id
    properties:
      - {key: id, dataType: string, required: true}
      - {key: name, dataType: string, required: true}
      - {key: resource_class, dataType: enum, enumValues: [队伍, 物资装备, 指挥系统, 资金, 交通, 医疗, 通信电力, 后勤, 技术, 制度, 法制]}
      - {key: owner_org_ref, dataType: ref, refTo: Organization}

  - type_key: LegalBasis
    display_name: 编制依据（法规/上位预案）
    primary_key: id
    properties:
      - {key: id, dataType: string, required: true}
      - {key: title, dataType: string, required: true}
      - {key: basis_class, dataType: enum, enumValues: [法律, 行政法规, 国家预案, 国务院决定, 地方性法规, 省级预案, 州级预案, 县级预案]}
      - {key: level, dataType: enum, enumValues: [国, 省, 州, 县]}

  - type_key: Term
    display_name: 术语定义
    primary_key: id
    properties:
      - {key: id, dataType: string, required: true}
      - {key: term, dataType: string, required: true}
      - {key: definition, dataType: string, required: true}

  - type_key: Evidence
    display_name: 证据（原文出处）
    primary_key: id
    properties:
      - {key: id, dataType: string, required: true}
      - {key: doc_id, dataType: string, required: true}
      - {key: section, dataType: string, required: true}
      - {key: quote, dataType: string}
      - {key: confidence, dataType: enum, enumValues: [原文直述, 原文推算, 外部补全, 存疑]}

# ==============================================================================
# 二、元模型：关系类型（link_types）
# ==============================================================================
link_types:
  - {link_key: located_in,          from_type: HazardSite,    to_type: Region,         cardinality: "1:N", desc: 隐患点位于区域}
  - {link_key: part_of_region,      from_type: Region,        to_type: Region,         cardinality: "1:N", desc: 行政隶属}
  - {link_key: member_of,           from_type: Organization,  to_type: Organization,   cardinality: "N:N", desc: 成员单位隶属于指挥部/工作组}
  - {link_key: leads,               from_type: Organization,  to_type: Organization,   cardinality: "1:N", desc: 牵头单位领衔工作组}
  - {link_key: office_of,           from_type: Organization,  to_type: Organization,   cardinality: "1:1", desc: 办公室设于/服务于指挥部}
  - {link_key: holds_role,          from_type: Organization,  to_type: Role,           cardinality: "1:N", desc: 机构负责人担任岗位}
  - {link_key: reports_to,          from_type: Organization,  to_type: Organization,   cardinality: "N:N", desc: 信息上报路径}
  - {link_key: responsible_for,     from_type: Organization,  to_type: Action,         cardinality: "N:N", desc: 机构承担措施}
  - {link_key: site_of_type,        from_type: HazardSite,    to_type: HazardType,     cardinality: "1:N", desc: 隐患点属灾害类型}
  - {link_key: grade_defined_by,    from_type: SeverityGrade, to_type: Rule,           cardinality: "1:N", desc: 分级由阈值规则定义}
  - {link_key: triggers_response,   from_type: SeverityGrade, to_type: ResponseLevel,  cardinality: "1:1", desc: 分级触发响应级别}
  - {link_key: warning_triggers,    from_type: WarningLevel,  to_type: Action,         cardinality: "N:N", desc: 预警级别触发响应行动}
  - {link_key: escalates_from,      from_type: WarningLevel,  to_type: WarningLevel,   cardinality: "1:1", desc: 高级别在低级别基础上叠加}
  - {link_key: response_includes,   from_type: ResponseLevel, to_type: Action,         cardinality: "N:N", desc: 响应级别包含措施}
  - {link_key: response_escalates,  from_type: ResponseLevel, to_type: ResponseLevel,  cardinality: "1:1", desc: 响应级别参照/升级关系}
  - {link_key: action_uses,         from_type: Action,        to_type: Resource,       cardinality: "N:N", desc: 措施消耗资源}
  - {link_key: resource_secured_by, from_type: Resource,      to_type: Organization,   cardinality: "N:N", desc: 保障责任单位}
  - {link_key: derives_from,        from_type: LegalBasis,    to_type: LegalBasis,     cardinality: "1:N", desc: 下位预案承接上位}
  - {link_key: evidenced_by,        from_type: Evidence,      to_type: Evidence,       cardinality: "N:N", desc: 任意节点 → 证据（通用挂载，实现为 evidence 字段）}

