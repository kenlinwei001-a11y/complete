# ==============================================================================
# 五、规则层
# ==============================================================================
rule_semantics:
  inclusive_note: 本预案所称"以上"包括本数，"以下"不包括本数（§11.3）
  combinator_default: OR（死亡人数判据与震级判据任一满足即命中）
  tie_break: 命中多级时取 rank 最小者（最高级别）

rules:
  - id: RULE-LX-GRADE
    rule_class: 灾害分级
    inputs: [death_missing, magnitude, in_criterion_area, is_key_area]
    expression: |
      IF death_missing >= 300 OR (is_key_area AND magnitude >= 7.0) THEN 特别重大（Ⅰ级）
      ELSE IF death_missing >= 50 OR (in_criterion_area AND 6.0 <= magnitude < 7.0) THEN 重大（Ⅱ级）
      ELSE IF death_missing >= 10 OR (in_criterion_area AND 5.0 <= magnitude < 6.0) THEN 较大（Ⅲ级）
      ELSE IF death_missing < 10 OR (in_criterion_area AND 4.5 <= magnitude < 5.0) THEN 一般（Ⅳ级）
    note: in_criterion_area = 临夏市 OR 震中50km范围内人口密度≥200人/km²的地区；积石山县成立（DEC-LX-03）
    evidence: ["§3.1"]

  - id: RULE-LX-TIER
    rule_class: 分级应对
    inputs: [grade, is_cross_boundary, exceeds_local_capacity]
    expression: |
      responsible = MAP(grade, {特别重大: 省抗震救灾指挥部, 重大: 省抗震救灾指挥部, 较大: 州党委政府, 一般: 县党委政府})
      IF is_cross_boundary THEN 上一级党委政府统筹协调，受灾地区党委政府负责本行政区域
      IF exceeds_local_capacity THEN 报请上一级政府提供支援或者负责应对
    evidence: ["§3.2.1"]

  - id: RULE-LX-ACTIVATION
    rule_class: 响应启动
    inputs: [grade]
    expression: |
      Ⅰ级: 州抗震救灾指挥部提出建议 → 报州委州政府 → 州委、州政府决定启动 → 第一时间报省委省政府
      Ⅱ级: 州抗震救灾指挥部提出建议 → 报州委州政府 → 州政府决定启动 → 第一时间报省委省政府
      Ⅲ级: 州抗震救灾指挥部办公室提出建议 → 报州委州政府 → 州政府决定启动 → 第一时间报省委省政府
      Ⅳ级: 州抗震救灾指挥部办公室了解震情灾情 → 报指挥部并通报成员单位 → 办公室视情决定启动
    conflict: Ⅲ级与附件表不一致，已按 DEC-LX-01 取正文
    evidence: ["§5.1", "§5.2", "§5.3", "§5.4"]

  - id: RULE-LX-QUICKREPORT
    rule_class: 速报阈值
    inputs: [magnitude, is_urban]
    expression: |
      IF (is_urban AND magnitude >= 3.5) OR (NOT is_urban AND magnitude >= 4.0)
      THEN 州地震局快速完成速报参数（时间/地点/震级/震源深度），报州委州政府并通报成员单位
    deadline: 原文无量化时限，见 DEC-LX-06 补桥
    evidence: ["§4.2"]

  - id: RULE-LX-TERMINATION
    rule_class: 响应终止
    inputs: [应急工作基本结束, 转移安置基本完成, 次生灾害影响基本消除, 生命线基本抢通, 生活秩序基本恢复]
    expression: ALL(inputs) == true → 由应急响应启动机构决定终止，转入灾后恢复重建阶段
    evidence: ["§6"]

  - id: RULE-LX-MODIFIER
    rule_class: 响应启动
    inputs: [is_minority_area, 灾情发展]
    expression: |
      IF is_minority_area THEN 可根据需要适当提高应急响应级别
      IF 灾情发展变化 THEN 及时调整级别，避免响应不足或响应过度
    standing_note: 临夏州为回族自治州、积石山为民族自治县，该条款在辖域内属常态覆盖（DEC-LX-04）
    evidence: ["§3.2.2"]

# ==============================================================================
# 六、地震事件触发层
# ------------------------------------------------------------------------------
# 把一次真实地震接入预案执行：事件摄入 → 初判 → 定级 → 分级应对 → 响应启动 →
# 措施展开 → 次生灾害移交。同时定义与县地质灾害本体的联动。
# ==============================================================================
earthquake_event_layer:

  ingestion:
    id: EQ-LX-INGEST
    authoritative_sources:
      震情要素: [中国地震台网, 甘肃省地震局, 州地震局速报]
      烈度: [省地震局/中国地震局烈度调查成果, WG-LX-03 烈度评定]
      伤亡与损失: [州应急局灾情上报系统, 各成员单位行业摸排, WG-LX-03 损失评估]
    hard_rule: 震级、震源深度、烈度一律引用官方发布，不得由模型估算或引用未证实来源

  initial_judgement:
    id: EQ-LX-INITJUDGE
    principle: 震后伤亡统计滞后于震级发布，故初判优先走震级判据，伤亡判据用于后续修正
    sequence:
      - {step: 1, action: 取震级与震中位置，判定是否落入判据区域（临夏市 或 震中50km内人口密度≥200人/km²）}
      - {step: 2, action: 按 RULE-LX-GRADE 的震级支路给出初判级别}
      - {step: 3, action: 伤亡数据回传后按死亡人数支路复判，取更高级别}
      - {step: 4, action: 按 MOD-LX-MINORITY 给出提级建议（双结论，不替指挥部拍板）}
      - {step: 5, action: 按 RULE-LX-TIER 确定由哪一级党委政府负责应对（与响应级别是两个维度）}
    jishishan_shortcut:
      condition: 震中位于积石山县
      rule: 该县人口密度 305.6 人/km²，满足判据区域条件
      table:
        - {magnitude: ">=7.0（重要地区）", 初判: 特别重大Ⅰ级}
        - {magnitude: "6.0 ~ 7.0", 初判: 重大Ⅱ级}
        - {magnitude: "5.0 ~ 6.0", 初判: 较大Ⅲ级}
        - {magnitude: "4.5 ~ 5.0", 初判: 一般Ⅳ级}
        - {magnitude: "<4.5", 初判: 不构成地震灾害分级；若在重要设施场地附近且有明显震感，按 EVT-LX-FELT 强有感地震事件处置}
      caveat: 依赖 DEC-LX-03 与 C-LX-11（密度计算口径），须县地震局确认

  secondary_hazard_handoff:
    id: EQ-LX-HANDOFF
    criticality: 关键——本层是两套预案能否协同的唯一枢纽
    state_side:
      owner: WG-LX-08 地震监测和次生灾害防范处置组
      lead_units: [州地震局, 州自然资源局, 州水务局]
      scope: [山体崩塌, 滑坡, 泥石流, 堰塞湖, 溃坝, 地面塌陷]
      duty: 对重大地质灾害和洪水灾害隐患进行监测预警，一旦发生险情及时组织疏散群众
      evidence: ["§2.1.1(8)"]
    county_side:
      ontology: jishishan_geohazard_emergency@3
      owner: 县地质灾害应急指挥部（震后转为抗震救灾指挥部下的次生地质灾害防范支线）
      scope: [崩塌, 滑坡, 泥石流, 地面塌陷, 不稳定斜坡]
      gap: 县预案灾害类型不含堰塞湖与溃坝，仅在险情分级中以"江河支流被阻断"隐含堰塞（C-LX-07）
    handoff_rules:
      - {id: HO-1, rule: 次生地质灾害的监测预警与疏散决策，震后由 WG-LX-08 统一归口；县地质灾害应急指挥部作为其技术支撑与属地执行单元}
      - {id: HO-2, rule: 次生地质灾害的定级仍按县地质灾害预案口径执行，但结论上报 WG-LX-08 而非独立对外发布（承接 DEC-15）}
      - {id: HO-3, rule: 堰塞湖与溃坝险情超出县地质灾害预案适用范围，由 WG-LX-08 中的州水务局归口，县级配合}
      - {id: HO-4, rule: 灾情损失评估中"各种地震地质灾害"的调查由 WG-LX-03 牵头，县调查评估组提供分项数据，避免两套统计重复计数}
    reinforced_assumptions:
      note: 县本体中原为模型假设的两条，在州预案中找到明文依据，置信度升级
      items:
      - id: ASSUME-EQ-4
        was: 模型假设——安置点选址须先做地质灾害危险性评估
        now: 上位预案明文
        basis: §5.1(10) 灾害风险排查——"对灾区集中安置点和应急避难场所开展次生灾害隐患排查"
        status: 已升级为 RULE，不再需要指挥部确认
      - id: ASSUME-EQ-3
        was: 模型假设——不待定级即启动全量隐患点复核
        now: 上位预案部分支持
        basis: §5.1(10) 明文要求震后对重大危险源、重要目标、重要基础设施隐患排查与监测预警，并防范强余震和降雨形成的次生灾害
        residual_gap: 州预案同样未规定震后地质灾害排查的启动时限与完成时限（承接县本体 G-12）

  aftershock_and_chain:
    id: EQ-LX-CHAIN
    state_plan_coverage:
      - {item: 余震防范, basis: "§2.1.1(8) 密切监视震情发展，做好余震防范"}
      - {item: 余震分布通报, basis: "§5.1(9) 及时通报震区余震分布情况"}
      - {item: 强余震与降雨次生灾害, basis: "§5.1(10) 防范因强余震和降雨形成的滑坡、泥石流、坍塌等次生灾害造成新的人员伤亡和交通堵塞"}
    residual_gap:
      - 无量化的余震震级触发条件（多大余震须重新排查、须撤离作业面）
      - 无现场作业人员在余震条件下的撤离标准（承接县本体 G-13）
    external_calibration:
      ref: jishishan_geohazard_emergency@3 → earthquake_calibration_2023
      usable: 烈度—隐患点密度系数（Ⅷ度0.1329、Ⅶ度0.0694、Ⅵ度0.0023 处/km²）可用于震后次生地质灾害规模的先验估算

  interoperability_matrix:
    purpose: 一次地震中两套预案同时运转时，各条线的归属与冲突消解
    rows:
      - {dimension: 总指挥, 地震线: 州政府分管副州长（州级）/ 县抗震救灾指挥部（县级）, 地质灾害线: 依县预案 §5.5 分级确定, 裁决: 对外统一以抗震救灾指挥部为准}
      - {dimension: 灾害分级, 地震线: 死亡300/50/10 或 震级7.0/6.0/5.0/4.5, 地质灾害线: 死亡30/10/3 或 损失3000万/500万/100万, 裁决: 两个级别并存且都成立，并列呈现严禁互换（DEC-15）}
      - {dimension: 伤亡统计, 地震线: 全域地震灾害伤亡, 地质灾害线: 仅次生地质灾害归因分项, 裁决: 分项可加总不可叠算（ASSUME-EQ-2）}
      - {dimension: 次生灾害监测, 地震线: WG-LX-08 归口, 地质灾害线: 县自然资源局执行, 裁决: HO-1}
      - {dimension: 损失评估, 地震线: WG-LX-03 牵头, 地质灾害线: 县调查评估组 WG-08, 裁决: HO-4}
      - {dimension: 信息发布, 地震线: WG-LX-11 州委宣传部, 地质灾害线: 县新闻宣传组 WG-10, 裁决: 州级响应期一律由 WG-LX-11 统一发布}
      - {dimension: 堰塞湖溃坝, 地震线: WG-LX-08 州水务局, 地质灾害线: 不在适用范围, 裁决: HO-3}

# ==============================================================================
# 七、裁决台账
# ------------------------------------------------------------------------------
# decided_by = MODEL 的为默认裁决，州/县指挥部可推翻，推翻后须 bump meta.version
# ==============================================================================
decisions:

  - id: DEC-LX-01
    resolves: C-LX-02
    decided_by: MODEL
    topic: Ⅲ级响应启动权限（正文与附件表冲突）
    conflict: 正文 §5.3 为"州抗震救灾指挥部办公室提出建议、州政府决定启动"；附件表为"州抗震救灾指挥部决定启动"
    ruling: 以正文 §5.3 为准
    rationale: >
      正文表述完整（含建议主体、报告路径、决定主体），附件表为摘要且同表另有两行整列空白，
      属编制疏漏而非有意规定；且Ⅲ级与Ⅱ级同为"州政府决定"符合分级递进逻辑，
      若取附件表则Ⅲ级由指挥部自决、Ⅱ级由州政府决定、Ⅳ级由办公室自决，权限阶梯反而断裂。
    requires_confirmation: 州抗震救灾指挥部办公室

  - id: DEC-LX-02
    resolves: C-LX-01
    decided_by: MODEL
    topic: 与《国家地震应急预案》2025年修订版的分级阈值冲突
    conflict_table:
      - {级别: 特别重大, 本州预案: 死亡300人以上, 国家2025修订: 死亡200人以上}
      - {级别: 重大,     本州预案: 死亡50~300人,  国家2025修订: 死亡30~200人}
      - {级别: 较大,     本州预案: 死亡10~50人,   国家2025修订: 死亡10~30人}
      - {级别: 一般,     本州预案: 死亡10人以下,  国家2025修订: 死亡10人以下}
    analysis: 本州预案阈值与2012版国家预案一致，未同步2025年修订，属预案现势性问题
    ruling: >
      本地执行以本州预案为准（属地预案在其未修订前仍然有效）；
      但报告中须并列标注国标口径，并在终报的预案复盘章节触发 §10.1 修订建议。
    rationale: 执行依据须唯一且可追责，不能因上位修订而自行套用未落地的新阈值；但隐瞒差异会使上报省级时口径不一致
    requires_confirmation: 州抗震救灾指挥部办公室 + 州地震局
    urgency: 高——应急管理部2025-10-31明确要求"加快新一轮各地各级地震应急预案修订"

  - id: DEC-LX-03
    decided_by: MODEL
    topic: 积石山县是否落入震级判据区域
    computation: 278089 人 / 909.97 km² = 305.6 人/km² > 200 人/km²
    ruling: 成立——积石山县满足"人口密度达到200人/平方公里"的判据条件
    implication: 该县发生 6.0 级以上地震，可不待伤亡统计直接初判为重大地震灾害（Ⅱ级）并启动相应程序
    dependency: 依赖县本体 DEC-01（总人口 278089 人的单位修正）
    caveat: 原文未明确密度按50km圆域平均还是按行政区计算（C-LX-11）；本裁决按行政区计算
    requires_confirmation: 州地震局 + 县地震局

  - id: DEC-LX-04
    decided_by: MODEL
    topic: 少数民族地区提级条款的常态适用
    finding: 临夏回族自治州全域、积石山保安族东乡族撒拉族自治县全域均为少数民族聚居地区，§3.2.2 提级条款属常态覆盖而非例外
    ruling: 报告一律并列输出"推导级别"与"提级建议级别"及理由，由有权机关裁量，模型不替其拍板
    consistency: 与县本体 DEC-EQ-5 口径一致，两级预案采同一处理方式
    requires_confirmation: 州抗震救灾指挥部

  - id: DEC-LX-05
    resolves: C-LX-09
    decided_by: MODEL
    topic: Ⅰ级响应措施第（2）项正文与附件表不一致
    conflict: 正文 §5.1(2) 为"靠前指挥"；附件表第（2）项为"启动应急指挥机构"
    ruling: 取并集——第（2）项同时包含"启动应急指挥机构"与"靠前组织指挥和协调"
    rationale: 两者均为Ⅰ级响应的必要动作，且互不排斥；漏掉任一都会造成执行缺项

  - id: DEC-LX-06
    resolves: C-LX-06
    decided_by: MODEL
    topic: 震情速报无量化时限
    finding: §4.2 仅表述"快速完成"，而下位的县地质灾害预案反而有 30/60 分钟明确时限
    ruling: >
      补桥——Ⅰ/Ⅱ级初判情形按 30 分钟内完成速报，Ⅲ/Ⅳ级按 1 小时内，
      与县地质灾害预案 §4.1 的时限体系对齐。
    status: 属模型补桥，非原文条款；报告中须标注"依县级预案时限体系类推"
    requires_confirmation: 州地震局

  - id: DEC-LX-07
    resolves: C-LX-07
    decided_by: MODEL
    topic: 次生地质灾害的两套预案归口
    ruling: 见 earthquake_event_layer.secondary_hazard_handoff 的 HO-1 至 HO-4
    summary: 州级响应期由 WG-LX-08 统一归口，县地质灾害应急指挥部为技术支撑与属地执行单元；堰塞湖溃坝归州水务局；损失评估由 WG-LX-03 牵头汇总以避免重复计数
    requires_confirmation: 州抗震救灾指挥部办公室 + 县地质灾害应急指挥部办公室

  - id: DEC-LX-08
    resolves: C-LX-08
    decided_by: MODEL
    topic: 分级应对与响应分级两个维度的混淆风险
    ruling: >
      报告必须分别输出两个结论——「由哪一级党委政府负责应对」（§3.2.1）与
      「启动哪一级响应」（§5），二者不同源、不可互推。
      例：较大地震灾害由州党委政府负责应对，同时启动州级Ⅲ级响应；
      重大地震灾害由省抗震救灾指挥部指挥协调，州级仍启动州级Ⅱ级响应作为配合。
    gate: 并入报告生成的 GATE-LX-3

  - id: DEC-LX-09
    resolves: C-LX-10
    decided_by: MODEL
    topic: 指挥部成员单位名单不含军地力量
    finding: 临夏军分区、武警临夏支队、州消防救援支队出现在副总指挥名单和多个工作组，但不在成员单位列举中
    ruling: 视为成员单位，在图谱中补入；属编制列举疏漏
    requires_confirmation: 州抗震救灾指挥部办公室

# ==============================================================================
# 八、质量层
# ==============================================================================
quality:
  conflicts:
    - id: C-LX-01
      severity: 高
      type: 与上位预案阈值脱节
      location: "§3.1 vs 《国家地震应急预案》2025年修订版"
      finding: 本州预案沿用2012版国家预案阈值（300/50/10），与2025修订版（200/30/10）不一致
      impact: 同一伤亡规模在州、国两级口径下差一级；上报省级与国家时可能出现级别表述矛盾
      ruling_ref: DEC-LX-02
      verification_needed: 需核实2025年修订版正式文本的分级条款，本条依据为应急管理部2025-10-31解读稿
    - id: C-LX-02
      severity: 高
      type: 正文与附件冲突
      location: "§5.3 vs §11.6附件表"
      finding: Ⅲ级响应启动主体，正文为州政府决定，附件表为州抗震救灾指挥部决定
      impact: 实战中启动权限归属不清，可能延误或越权
      ruling_ref: DEC-LX-01
    - id: C-LX-03
      severity: 中
      type: 附件表不完整
      location: "§11.6附件表"
      finding: Ⅱ级响应行的"指挥和协调""主要响应措施"两列空白；Ⅳ级响应行的"主要响应措施"列空白
      impact: 附件表本应是实战速查工具，两级空白使其在Ⅱ、Ⅳ级情形下不可用
    - id: C-LX-04
      severity: 高
      type: 跨预案分级口径差异
      location: 本预案 §3.1 vs 积石山县突发地质灾害应急预案 §1.5.2
      finding: 地震灾害按死亡300/50/10分级，地质灾害灾情按死亡30/10/3分级，差约一个数量级
      impact: 同一场地震的两条线级别必然不同，若不并列标注会被误读为矛盾或误报
      ruling_ref: 承接县本体 DEC-15；本预案侧补充 DEC-LX-08
    - id: C-LX-05
      severity: 低
      type: 表述语病
      location: "§1.3"
      finding: 原文"本预案适用于本省州境内或毗邻市（州)发生地震灾害的应对工作"，"本省州境内"表述不清，疑为"本州境内"
      impact: 适用范围的地域边界存在歧义
    - id: C-LX-06
      severity: 中
      type: 时限缺失
      location: "§4.2"
      finding: 震情速报仅表述"快速完成"，无量化时限；而下位县地质灾害预案有30/60分钟明确时限
      impact: 上位预案时限反而弱于下位预案，无法据以考核
      ruling_ref: DEC-LX-06
    - id: C-LX-07
      severity: 中
      type: 次生灾害灾种范围不一致
      location: "§2.1.1(8) vs 积石山县地质灾害预案 §1.3"
      finding: 州预案次生灾害含堰塞湖、溃坝；县地质灾害预案灾害类型仅崩塌滑坡泥石流地面塌陷，无堰塞湖溃坝
      impact: 堰塞湖与溃坝在县级层面无处置依据，存在责任真空
      ruling_ref: DEC-LX-07（HO-3）
    - id: C-LX-08
      severity: 中
      type: 维度混淆风险
      location: "§3.2.1 vs §5"
      finding: 分级应对（谁负责）与响应分级（启动哪一级）是两个独立维度，原文相邻编排易被合并理解
      impact: 可能误认为"重大地震灾害由省负责，州就不启动响应"，实则州级仍启动Ⅱ级响应
      ruling_ref: DEC-LX-08
    - id: C-LX-09
      severity: 低
      type: 正文与附件措施项不一致
      location: "§5.1(2) vs §11.6附件表第（2）项"
      finding: 正文为"靠前指挥"，附件表为"启动应急指挥机构"
      ruling_ref: DEC-LX-05
    - id: C-LX-10
      severity: 低
      type: 成员单位名单不闭合
      location: "§2.1.1"
      finding: 临夏军分区、武警临夏支队、州消防救援支队在副总指挥与工作组中出现，却不在成员单位列举内
      ruling_ref: DEC-LX-09
    - id: C-LX-11
      severity: 中
      type: 判据计算口径不明
      location: "§3.1"
      finding: '"震中50公里范围内人口密度达到200人/平方公里的地区"——未明确按50km圆域平均密度还是按行政区密度计算'
      impact: 直接决定积石山县是否落入震级判据区域，进而决定6.0级地震能否直接初判Ⅱ级
      ruling_ref: DEC-LX-03（按行政区计算）
      priority: 该口径必须由州地震局明确，是本预案在积石山适用性的关键开关

  gaps:
    - id: G-LX-01
      topic: 文号与印发日期缺失
      finding: 正文仅有"自印发之日起实施"，无发文字号与印发日期；仅知废止 临州办发〔2012〕392号
      impact: 无法确认现行版本、无法判断是否已按2025年国家预案修订
      action: 向州抗震救灾指挥部办公室索取印发通知原件
    - id: G-LX-02
      topic: 附件表不完整
      finding: 见 C-LX-03
      action: 索取完整版附件表
    - id: G-LX-03
      topic: 底数与联络信息缺失
      finding: 无成员单位联络表、无指挥部组织架构图、无救援队伍与物资装备底数、无应急避难场所清单
      impact: 资源推演与队伍调派推演均无法量化，只能列需求项
      action: 与 G-LX-01 同渠道一并索取
    - id: G-LX-04
      topic: 震情速报无时限
      finding: 见 C-LX-06
    - id: G-LX-05
      topic: 无烈度判据
      finding: 分级只有死亡人数与震级两类判据，无烈度判据；而烈度是震后最早可得的致灾强度指标之一
      impact: 烈度调查成果无法直接进入定级链路，只能作为辅助描述
    - id: G-LX-06
      topic: 《积石山县地震应急预案》仍未获取
      finding: §10.1 证实其应当存在并已报州抗震救灾指挥部办公室备案
      status: 从"不确定是否存在"升级为"确认应当存在，仅未获取"
      action: 索取渠道新增州抗震救灾指挥部办公室（州应急局），优先于此前的县级渠道
      impact: 县级抗震救灾指挥部的具体组成、职责、启动权限仍不可知；本体现只能用州预案 §2.2 的原则性表述
    - id: G-LX-07
      topic: 余震量化触发条件缺失
      finding: 有"做好余震防范""通报余震分布"的定性要求，无量化触发（多大余震须重新排查、须撤离现场作业面）
      impact: 承接县本体 G-13，两级预案均未覆盖余震期现场作业安全
    - id: G-LX-08
      topic: 恢复重建条款过简
      finding: §7 仅两条，无恢复重建的资金机制、评估办法、进度监督与验收标准
      impact: 终报的恢复重建交接章节只能写原则，写不出可执行安排
    - id: G-LX-09
      topic: 无演练与培训的量化考核
      finding: §10.2 仅要求"上年度发生较大以上地震灾害的地区本年度至少1次演练"，其余地区无频次要求
      impact: 未发生灾害的年份无演练强制，能力保持无抓手
